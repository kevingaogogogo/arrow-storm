const TAU = Math.PI * 2;
const LEADERBOARD_ID = "019fc5b1-da1d-77b0-80c7-697b169f0d1c";
const LEADERBOARD_CACHE_MS = 5 * 60 * 1000;
// 排行榜镜像（GitHub Pages 静态文件，国内稳定读取；jsonblob 负责写入）
const LEADERBOARD_MIRROR = "https://kevingaogogogo.github.io/arrow-storm/leaderboard.json";
const LEADERBOARD_LOCAL_KEY = "arrowStormLeaderboardCache";
// 每日挑战：按日期生成固定种子（所有玩家同一天同一关卡配置，公平竞技）
function dailySeed() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  let h = y * 10000 + m * 100 + d;
  let seed = 2166136261;
  const s = String(h);
  for (let i = 0; i < s.length; i++) {
    seed ^= s.charCodeAt(i);
    seed = Math.imul(seed, 16777619);
  }
  return seed >>> 0;
}
// 固定种子随机数（mulberry32，可复现）
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// 每日挑战：按日期生成固定种子（所有玩家同一天同一关卡配置，公平竞技）
// 支持 ?daily=1 URL 直接进入，或菜单按钮运行时切换
let DAILY = new URLSearchParams(location.search).has("daily") ? { seed: dailySeed(), rand: mulberry32(dailySeed()) } : null;
// 每日挑战：全局随机数替换为固定种子（同一日所有玩家看到相同的三选一/敌人生成）
if (DAILY) {
  const origRandom = Math.random;
  Math.random = function() {
    // 每帧随机消耗量不同，但固定种子保证可复现性
    return DAILY.rand();
  };
  // 供游戏逻辑判断是否每日挑战
  window.__daily = true;
}

const Leaderboard = {
  tabs: [
    { key: "chapter", label: "关卡榜" },
    { key: "totalDmg", label: "伤害榜" },
    { key: "tankDmg", label: "抗伤榜" },
    { key: "gold", label: "金币榜" }
  ],
  data: null,
  status: "idle",
  champion: "暂无王者",
  get id() {
    return localStorage.getItem("arrowStormLeaderboardId") || LEADERBOARD_ID;
  },
  set id(value) {
    if (value) localStorage.setItem("arrowStormLeaderboardId", value);
  },
  sanitizeName(name) {
    return Array.from(String(name || "").trim()).slice(0, 10).join("") || "无名箭客";
  },
  getPlayerName() {
    return this.sanitizeName(localStorage.getItem("arrowStormPlayerName") || "");
  },
  ensurePlayerName() {
    const saved = this.getPlayerName();
    if (saved && saved !== "无名箭客") return saved;
    if (typeof DEMO !== "undefined" && DEMO) {
      localStorage.setItem("arrowStormPlayerName", "DemoAI");
      return "DemoAI";
    }
    const input = prompt("请输入玩家名称（最多10字）", "");
    const name = this.sanitizeName(input);
    localStorage.setItem("arrowStormPlayerName", name);
    return name;
  },
  normalize(data) {
    const source = data && Array.isArray(data.players) ? data.players : [];
    return {
      version: 1,
      players: source.map(p => ({
        name: this.sanitizeName(p.name),
        chapter: Math.max(1, Math.floor(Number(p.chapter) || 1)),
        room: Math.max(0, Math.floor(Number(p.room) || 0)),
        totalDmg: Math.max(0, Math.floor(Number(p.totalDmg) || 0)),
        tankDmg: Math.max(0, Math.floor(Number(p.tankDmg) || 0)),
        gold: Math.max(0, Math.floor(Number(p.gold) || 0)),
        ts: Math.max(0, Number(p.ts) || Date.now())
      }))
    };
  },
  async request(method, id, body) {
    const options = { method, cache: "no-store" };
    if (body) {
      options.headers = { "Content-Type": "application/json" };
      options.body = JSON.stringify(body);
    }
    const res = await fetch(`https://jsonblob.com/api/jsonBlob/${id}`, options);
    // 记录 blob 过期时间（jsonblob 免费版 24h TTL——用于保活迁移）
    const exp = res.headers && res.headers.get ? res.headers.get("X-jsonblob-expires-at") : null;
    if (exp) this.expiresAt = new Date(exp).getTime();
    return res;
  },
  // jsonblob 免费版 24h 过期：剩余寿命 <12h 时迁移到新 blob（数据续命，玩家打开游戏即保活）
  async refreshIfExpiring() {
    try {
      if (!this.expiresAt || this.expiresAt - Date.now() > 12 * 3600 * 1000) return;
      if (!this.data) return;
      const id = await this.createBlob(this.data);
      await this.request("PUT", id, this.data);
      this.flashLeaderboardMsg && this.flashLeaderboardMsg("排行榜数据已续期");
    } catch (_) {}
  },
  flashLeaderboardMsg: null,
  async createBlob(initial) {
    const res = await fetch("https://jsonblob.com/api/jsonBlob", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(initial || { version: 1, players: [] })
    });
    if (!res.ok) throw new Error("leaderboard create failed");
    const location = res.headers.get("Location") || "";
    const id = location.split("/").filter(Boolean).pop();
    if (id) this.id = id;
    return id || this.id;
  },
  async load(options = {}) {
    const silent = !!options.silent;
    if (!silent) this.status = "loading";
    // 尝试顺序：jsonblob（实时权威）→ GitHub 镜像（jsonblob 挂了时的降级快照）→ localStorage 缓存（离线兜底）
    // 注意：mirror 是部署时静态快照，若优先会掩盖 jsonblob 的新数据
    const attempts = [
      async () => {
        let id = this.id;
        let res = await this.request("GET", id);
        if (res.status === 404) {
          id = await this.createBlob({ version: 1, players: [] });
          res = await this.request("GET", id);
        }
        if (!res.ok) throw new Error("jsonblob failed");
        return this.normalize(await res.json());
      },
      async () => {
        const res = await fetch(LEADERBOARD_MIRROR, { cache: "no-store" });
        if (!res.ok) throw new Error("mirror failed");
        return this.normalize(await res.json());
      },
      async () => {
        const raw = localStorage.getItem(LEADERBOARD_LOCAL_KEY);
        if (!raw) throw new Error("no cache");
        return this.normalize(JSON.parse(raw));
      }
    ];
    let lastErr = null;
    for (const fn of attempts) {
      try {
        const data = await fn();
        this.data = data;
        this.status = "ready";
        // 缓存成功数据（离线兜底）
        try { localStorage.setItem(LEADERBOARD_LOCAL_KEY, JSON.stringify(data)); } catch (_) {}
        this.cacheChampion();
        this.refreshIfExpiring(); // jsonblob 剩余寿命 <12h 自动迁移续命
        return data;
      } catch (e) { lastErr = e; }
    }
    if (!silent) this.status = "error";
    throw lastErr || new Error("leaderboard load failed");
  },
  isProgressBetter(a, b) {
    if ((a.chapter || 1) !== (b.chapter || 1)) return (a.chapter || 1) > (b.chapter || 1);
    if ((a.room || 0) !== (b.room || 0)) return (a.room || 0) > (b.room || 0);
    return (a.ts || 0) < (b.ts || 0);
  },
  mergeRecord(players, record) {
    const clean = this.normalize({ players: [record] }).players[0];
    const idx = players.findIndex(p => p.name === clean.name);
    if (idx < 0) return players.concat(clean);
    const prev = players[idx];
    const merged = Object.assign({}, prev);
    if (this.isProgressBetter(clean, prev)) {
      merged.chapter = clean.chapter;
      merged.room = clean.room;
      merged.ts = clean.ts;
    } else if (clean.chapter === prev.chapter && clean.room === prev.room) {
      merged.ts = Math.min(prev.ts || clean.ts, clean.ts);
    }
    merged.totalDmg = Math.max(prev.totalDmg || 0, clean.totalDmg || 0);
    merged.tankDmg = Math.max(prev.tankDmg || 0, clean.tankDmg || 0);
    merged.gold = Math.max(prev.gold || 0, clean.gold || 0);
    players[idx] = merged;
    return players;
  },
  async submit(record) {
    // 本地开发/测试环境（localhost/file）不提交排行榜，防测试数据污染线上
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.protocol === "file:") return;
    try {
      const name = this.sanitizeName(record && record.name);
      const guardKey = `arrowStormLeaderboardSubmitAt:${name}`;
      const last = Number(localStorage.getItem(guardKey) || "0");
      const now = Date.now();
      if (now - last < 60000) return;
      localStorage.setItem(guardKey, String(now));
      // 基础数据必须从 jsonblob 读（唯一权威写入源）——不能走 mirror（静态镜像可能滞后，会覆盖丢数据）
      let board = { version: 1, players: [] };
      try {
        const res = await this.request("GET", this.id);
        if (res.ok) board = this.normalize(await res.json());
      } catch (_) {}
      // blob 过期（404）：用 GitHub 镜像做基础重建，尽量保留部署时的数据
      if (!board.players || board.players.length === 0) {
        try {
          const mres = await fetch(LEADERBOARD_MIRROR, { cache: "no-store" });
          if (mres.ok) board = this.normalize(await mres.json());
        } catch (_) {}
      }
      const next = this.normalize(board);
      next.players = this.mergeRecord(next.players, Object.assign({}, record, { name }));
      let res = await this.request("PUT", this.id, next);
      if (res.status === 404) {
        const id = await this.createBlob(next);
        res = await this.request("PUT", id, next);
      }
      if (res.ok) {
        this.data = next;
        this.status = "ready";
        this.cacheChampion();
        this.refreshIfExpiring(); // 提交后检查剩余寿命，<12h 自动迁移
      }
    } catch (_) {}
  },
  getTop(kind, n = 20) {
    const players = (this.data && this.data.players ? this.data.players : []).slice();
    if (kind === "chapter") {
      players.sort((a, b) => (b.chapter - a.chapter) || (b.room - a.room) || (a.ts - b.ts));
    } else {
      players.sort((a, b) => ((b[kind] || 0) - (a[kind] || 0)) || (a.ts - b.ts));
    }
    return players.slice(0, n);
  },
  cacheChampion() {
    const top = this.getTop("chapter", 1)[0];
    this.champion = top ? `👑 关卡之王: ${top.name} · 第${top.chapter}章` : "暂无王者";
    localStorage.setItem("arrowStormChampionCache", JSON.stringify({ text: this.champion, ts: Date.now() }));
  },
  loadChampion() {
    try {
      const cached = JSON.parse(localStorage.getItem("arrowStormChampionCache") || "null");
      if (cached && Date.now() - cached.ts < LEADERBOARD_CACHE_MS) this.champion = cached.text || "暂无王者";
    } catch (_) {}
    this.load({ silent: true }).catch(() => {});
  },
  // 改名：清除本地姓名 + 排行榜本地缓存（下次开局重新输入，重新上榜）
  resetName() {
    localStorage.removeItem("arrowStormPlayerName");
    localStorage.removeItem("arrowStormChampionCache");
    localStorage.removeItem(LEADERBOARD_LOCAL_KEY);
    try { localStorage.removeItem("arrowStormLeaderboardSubmitAt:无名箭客"); } catch (_) {}
    const input = prompt("请输入新的玩家名称（最多10字）", "");
    const name = this.sanitizeName(input);
    localStorage.setItem("arrowStormPlayerName", name);
    this.flashMessage && this.flashMessage(`玩家名称已更新：${name}`);
  }
};

function themeForChapter(chapter) { return (Math.max(1, chapter) - 1) % THEMES.length; }

function rebuildThemeDecor(game) {
  game.decor.length = 0;
  for (let i = 0; i < 38; i++) game.decor.push(game.makeDecor(Util.rand(0, CONFIG.H), Util.pick(getTheme().decor)));
}
// 场景切换：只绑定章节，进新章时调用
function checkThemeSwitch(game) {
  const want = themeForChapter(game.chapter || 1);
  if (want !== themeIndex) {
    themeIndex = want;
    themeTrans = 1;
    game.flashMessage(`第 ${game.chapter} 章 · ${THEMES[want].name}`);
    audio.upgrade();
    audio.bgmStart(want); // 章节切换背景音乐
    rebuildThemeDecor(game);
  }
}
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const Util = {
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  rand(a, b) { return a + Math.random() * (b - a); },
  randi(a, b) { return Math.floor(Util.rand(a, b + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  dist2(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return dx * dx + dy * dy;
  },
  circleHit(a, b) {
    const r = a.r + b.r;
    return Util.dist2(a, b) <= r * r;
  },
  worldScale(y) {
    return Util.clamp(0.42 + y / CONFIG.H * 0.92, 0.42, 1.34);
  },
  roadWidth(y) {
    const t = Util.clamp(y / CONFIG.H, 0, 1);
    return CONFIG.ROAD_TOP_W + (CONFIG.ROAD_BOTTOM_W - CONFIG.ROAD_TOP_W) * t;
  },
  onRoadX(x, y, margin = 0) {
    return Math.abs(x - CONFIG.W / 2) <= Util.roadWidth(y) / 2 - margin;
  }
};

class AudioSystem {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = localStorage.getItem("arrowStormMuted") === "1";
    this.bgmTimer = null;
    this.bgmStep = 0;
    this.bgmTheme = -1;
  }
  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.22;
    this.master.connect(this.ctx.destination);
    // 若已在播放 BGM，ensure 后恢复
    if (this.bgmTheme >= 0) this.bgmStart(this.bgmTheme);
  }
  toggle() {
    this.ensure();
    this.muted = !this.muted;
    localStorage.setItem("arrowStormMuted", this.muted ? "1" : "0");
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.22, this.ctx.currentTime, 0.02);
  }
  tone(freq, dur, type = "sine", gain = 0.5, slide = 1) {
    this.ensure();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  // ── 背景音乐：Web Audio 合成循环（5 章节主题不同）──
  // 主题：0森林轻快 / 1沙漠低沉 / 2冰原空灵 / 3火狱激昂 / 4暗影诡异
  bgmStart(theme) {
    this.ensure();
    if (!this.ctx) return;
    this.bgmStop();
    this.bgmTheme = theme;
    const T = BGM_THEMES[theme] || BGM_THEMES[0];
    const beatMs = 60000 / T.bpm;
    this.bgmStep = 0;
    this.bgmTimer = setInterval(() => {
      if (this.muted || !this.ctx) return;
      const step = this.bgmStep++;
      const note = T.scale[step % T.scale.length];
      if (note > 0) this._bgmNote(note, beatMs / 1000 * 0.85, T.wave, T.vol);
      if (step % 4 === 0) this._bgmNote(T.bass, beatMs / 1000 * 3.2, "sine", T.bassVol);
    }, beatMs);
  }
  bgmStop() {
    if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; }
  }
  _bgmNote(freq, dur, wave, gain) {
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }
  shoot() { this.tone(520, 0.06, "triangle", 0.18, 1.8); }
  hit() { this.tone(180, 0.08, "square", 0.12, 0.65); }
  upgrade() { this.tone(660, 0.12, "sine", 0.22, 1.7); setTimeout(() => this.tone(920, 0.1, "sine", 0.18, 1.35), 55); }
  chest() { this.tone(480, 0.12, "triangle", 0.25, 1.5); setTimeout(() => this.tone(880, 0.16, "triangle", 0.22, 1.7), 90); }
  boss() { this.tone(110, 0.45, "sawtooth", 0.3, 0.55); }
  death() { this.tone(220, 0.5, "sawtooth", 0.25, 0.25); }
  sword() { this.tone(760, 0.08, "triangle", 0.12, 1.25); }
  coin() { this.tone(1320, 0.05, "sine", 0.07, 1.9); }
}

  { name: "沙漠", bpm: 92, wave: "sine", vol: 0.055, bass: 98, bassVol: 0.04, scale: [196, 220, 262, 220, 294, 262, 220, 196] },         // 低沉神秘
  { name: "冰原", bpm: 76, wave: "sine", vol: 0.05, bass: 196, bassVol: 0.03, scale: [784, 988, 784, 659, 784, 988, 1175, 988] },        // 空灵高音
  { name: "火狱", bpm: 150, wave: "sawtooth", vol: 0.04, bass: 110, bassVol: 0.035, scale: [440, 554, 659, 554, 880, 659, 554, 440] },  // 激昂
  { name: "暗影", bpm: 84, wave: "square", vol: 0.035, bass: 55, bassVol: 0.03, scale: [220, 233, 220, 208, 220, 233, 262, 233] }       // 诡异半音
];

const audio = new AudioSystem();

class Pool {
  constructor(Type) {
    this.Type = Type;
    this.items = [];
  }
  get(...args) {
    let item = this.items.find(e => !e.active);
    if (!item) {
      item = new this.Type();
      this.items.push(item);
    }
    item.init(...args);
    return item;
  }
  active() {
    return this.items.filter(e => e.active);
  }
}

class Particle {
  constructor() { this.active = false; }
  init(x, y, vx, vy, life, color, size, text, crit) {
    this.active = true;
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
    this.text = text || "";
    this.crit = !!crit;
  }
  update(dt) {
    this.life -= dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += (this.text ? 20 : 95) * dt;
    if (this.life <= 0) this.active = false;
  }
  render(g) {
    const a = Util.clamp(this.life / this.maxLife, 0, 1);
    g.save();
    g.globalAlpha = a;
    if (this.text) {
      // 伤害数字：弹出缩放 + 上浮
      const popScale = this.crit ? 1.6 : 1.35;
      const sc = popScale - (popScale - 1) * Util.clamp(1 - a, 0, 1);
      g.translate(this.x, this.y);
      g.scale(sc, sc);
      g.font = `${this.crit ? 30 : 21}px Microsoft YaHei, sans-serif`;
      g.textAlign = "center";
      g.lineWidth = this.crit ? 5 : 3;
      g.strokeStyle = "rgba(61,30,7,0.85)";
      g.fillStyle = this.crit ? "#ffd56a" : this.color;
      g.strokeText(this.text, 0, 0);
      g.fillText(this.text, 0, 0);
    } else {
      g.fillStyle = this.color;
      g.beginPath();
      g.arc(this.x, this.y, this.size * (0.5 + a), 0, TAU);
      g.fill();
    }
    g.restore();
  }
}

class Arrow {
  constructor() { this.active = false; }
  init(x, y, angle, damage, range, pierce, critChance, fire, ice) {
    this.active = true;
    this.x = x; this.y = y;
    this.lastX = x; this.lastY = y;
    this.angle = angle;
    this.vx = Math.sin(angle) * CONFIG.BASE_ARROW_SPEED;
    this.vy = -Math.cos(angle) * CONFIG.BASE_ARROW_SPEED;
    this.damage = damage;
    this.range = range;
    this.travel = 0;
    this.r = 7;
    this.pierce = pierce;
    this.pierceMult = 1; // 贯穿伤害递减倍率（每穿 1 个 -25%，封底 40%）
    this.critChance = critChance;
    this.fire = fire;
    this.ice = ice;
    this.split = false;
    this.volt = 0;
    this.frostfire = false;
    this.homing = false;
    this.pierceAll = false;
    this.hitIds = new Set();
    this.arrowIdx = 0; // 多箭序号（追踪箭按序号锁定不同目标，视觉分离不重叠）
  }
  update(dt, game) {
    this.lastX = this.x; this.lastY = this.y;
    // 追踪箭：持续朝最近敌人转向（拐弯追人）
    // v3.44: 多箭按序号锁定不同目标（第1支追最近、第2支追次近…），弹道分离不重叠
    if (this.homing) {
      let best = null, bestD = 999999, bestI = -1;
      const wantIdx = this.arrowIdx % 3;
      let cnt = -1;
      for (const e of game.enemies.active()) {
        if (e.dead || this.hitIds.has(e.id)) continue;
        const d = Util.dist2(this, e);
        if (d < bestD) { best = e; bestD = d; bestI = ++cnt; }
      }
      // 让第 N 支箭锁定第 N 近的敌人（多目标分离；只有一个目标时仍全部追它）
      if (best && bestI >= wantIdx) {
        let target = best, targetD = bestD;
        if (bestI > wantIdx) {
          let nearer = 0;
          for (const e of game.enemies.active()) {
            if (e.dead || this.hitIds.has(e.id)) continue;
            const d = Util.dist2(this, e);
            if (d < targetD) {
              if (nearer === wantIdx) { target = e; targetD = d; break; }
              nearer++;
            }
          }
        }
        const wantAngle = Math.atan2(target.x - this.x, -(target.y - this.y));
        // 当前朝向角
        let curAngle = Math.atan2(this.vx, -this.vy);
        // 最短角差转向（追踪速率 7 rad/s，快移可甩开）
        let diff = wantAngle - curAngle;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const turn = Util.clamp(diff, -7 * dt, 7 * dt);
        curAngle += turn + (this.arrowIdx > 0 ? 0.12 * (this.arrowIdx % 2 ? 1 : -1) : 0); // 多箭弹道偏移防重叠
        const sp = Math.hypot(this.vx, this.vy);
        this.vx = Math.sin(curAngle) * sp;
        this.vy = -Math.cos(curAngle) * sp;
        // 追踪尾迹：金色轨迹
        if (Math.random() < 0.7) game.particles.get(this.x, this.y, Util.rand(-8, 8), Util.rand(-8, 8), 0.3, "#f7c948", Util.rand(1.5, 3));
      }
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.travel += Math.hypot(this.vx * dt, this.vy * dt);
    // 属性箭拖尾：火=火星，冰=冰晶
    if (this.fire && Math.random() < 0.5) {
      game.particles.get(this.x, this.y, Util.rand(-14, 14), Util.rand(-14, 14), 0.3, Util.pick(["#ff7b3d", "#ffb15b", "#ff4f3d"]), Util.rand(2, 4));
    } else if (this.ice && Math.random() < 0.45) {
      game.particles.get(this.x, this.y, Util.rand(-12, 12), Util.rand(-12, 12), 0.35, Util.pick(["#9fe8ff", "#5fc6ff", "#d6f5ff"]), Util.rand(2, 3.5));
    }
    // 弹射墙：撞任意房间边缘反弹（顶部/底部/左/右四边都触发，弹射后重置飞行段继续飞）
    // 修复：之前只弹顶部且反弹后vy向下→剩余bounce浪费；左右墙不弹→斜射直接消失；travel未重置→弹完马上消失
    let bounced = false;
    if (this.bounce > 0 && this.travel < this.range) {
      if (this.y < -80 && this.vy < 0) {
        this.bounce--; this.y = -78; this.vy = Math.abs(this.vy) * 0.9; this.vx *= 0.95; bounced = true;
      } else if (this.y > CONFIG.H + 80 && this.vy > 0) {
        this.bounce--; this.y = CONFIG.H + 78; this.vy = -Math.abs(this.vy) * 0.9; this.vx *= 0.95; bounced = true;
      } else if (this.x < -40 && this.vx < 0) {
        this.bounce--; this.x = -38; this.vx = Math.abs(this.vx) * 0.9; this.vy *= 0.95; bounced = true;
      } else if (this.x > CONFIG.W + 40 && this.vx > 0) {
        this.bounce--; this.x = CONFIG.W + 38; this.vx = -Math.abs(this.vx) * 0.9; this.vy *= 0.95; bounced = true;
      }
    }
    if (bounced) {
      this.travel = 0; // 弹射开启新飞行段（否则弹完马上因射程耗尽消失）
      for (let i = 0; i < 6; i++) game.particles.get(this.x, this.y, Util.rand(-20, 20), Util.rand(-20, 20), 0.3, "#c77dff", Util.rand(2, 4));
    } else if (this.y < -80 || this.y > CONFIG.H + 80 || this.x < -40 || this.x > CONFIG.W + 40 || this.travel > this.range) {
      this.active = false;
    }
    for (const e of game.enemies.active()) {
      if (!this.active || e.dead || this.hitIds.has(e.id)) continue;
      if (Util.circleHit(this, e)) {
        this.hitIds.add(e.id);
        // 命中顿帧：每次命中微停 30ms，营造打击重量
        game.hitStop = Math.max(game.hitStop || 0, 0.03);
        const crit = Math.random() < this.critChance;
        // 贯穿递减：每穿过一个目标伤害 ×0.75（pierceMult 随贯穿次数下降）
        const dmg = this.damage * this.pierceMult * (crit ? (this.critDmg || 2) : 1);
        e.takeDamage(dmg, crit, game, this.fire, this.ice);
        // 毒箭：无视护甲 DOT（4/秒 3 秒）
        if (this.poison && !e.poisonT) {
          e.poisonT = 3;
          e.poisonDps = 4;
        }
        // 吸血：命中概率回血（防多箭+追踪无脑站桩）
        if (this.lifesteal > 0 && Math.random() < 0.35) {
          game.player.hp = Math.min(game.player.maxHp, game.player.hp + this.lifesteal);
          if (Math.random() < 0.3) game.particles.get(game.player.x, game.player.y - 20, Util.rand(-10, 10), Util.rand(-40, -10), 0.4, "#ff6b81", Util.rand(2, 4));
        }
        // 乘区联动 1：分裂箭 —— 命中生成 2 支小箭（30% 伤害）
        // 平衡：小箭是纯物理散射（不继承追踪/元素/吸血/弹射），散开可能打空——
        // 之前继承 homing 导致 3主箭×2小箭=6支追踪箭全命中，伤害爆炸且必中
        if (this.split) {
          for (const da of [-0.22, 0.22]) {
            game.arrows.get(this.x, this.y, this.angle + da, this.damage * 0.3, this.range * 0.6, 0, 0, false, false);
          }
        }
        // 乘区联动 2：雷电箭 —— 弹射至最近其他敌人（50% 伤害）
        if (this.volt > 0) {
          let best = null, bestD = 999999;
          for (const e2 of game.enemies.active()) {
            if (e2 === e || e2.dead || this.hitIds.has(e2.id)) continue;
            const d = Util.dist2(e, e2);
            if (d < bestD && d < 300 * 300) { best = e2; bestD = d; }
          }
          if (best) {
            best.takeDamage(this.damage * 0.5 * (game.player.elemBoost || 1), false, game, this.fire, this.ice); // 元素大师强化弹射
            for (let i = 0; i < 6; i++) game.particles.get(best.x, best.y, Util.rand(-40, 40), Util.rand(-60, 10), 0.3, "#d9f7ff", Util.rand(2, 5));
          }
        }
        // 乘区联动 3：冰火共鸣 —— 冰冻敌人受火伤时爆炸
        if (this.frostfire && this.fire && e.iceT > 0) {
          const eb = game.player.elemBoost || 1; // 元素大师强化
          e.takeDamage(this.damage * 0.8 * eb, false, game, false, false);
          for (const e2 of game.enemies.active()) {
            if (e2 === e || e2.dead) continue;
            if (Util.dist2(e, e2) <= 110 * 110) e2.takeDamage(this.damage * 0.4 * eb, false, game, false, false);
          }
          for (let i = 0; i < 20; i++) game.particles.get(e.x, e.y, Util.rand(-120, 120), Util.rand(-140, 40), 0.5, Util.pick(["#ff7b3d", "#5fc6ff"]), Util.rand(3, 7));
        }
        // 法杖专属：元素新星（命中爆炸 AOE）
        if (this.staveNova) {
          const eb = game.player.elemBoost || 1;
          for (const e2 of game.enemies.active()) {
            if (e2 === e || e2.dead) continue;
            if (Util.dist2(e, e2) <= 130 * 130) e2.takeDamage(this.damage * 0.6 * eb, false, game, this.fire, this.ice);
          }
          for (let i = 0; i < 18; i++) game.particles.get(e.x, e.y, Util.rand(-130, 130), Util.rand(-140, 40), 0.5, Util.pick(["#c77dff", "#ff7b3d", "#5fc6ff"]), Util.rand(3, 7));
        }
        // 法杖专属：法球分裂（命中生成 2 个小法球）
        if (this.staveSplit && !this._splitDone) {
          this._splitDone = true;
          const eb = game.player.elemBoost || 1;
          for (let s = 0; s < 2; s++) {
            const na = game.arrows.get(e.x, e.y - 10, this.angle + (s === 0 ? 1.2 : -1.2), this.damage * 0.35 * eb, 500, 0, 0, this.fire, this.ice);
            na.isStave = true; na.volt = 0; na.homing = false;
          }
        }
        // 法杖专属：灵魂汲取（命中回血）
        if (this.staveDrain > 0) {
          game.player.hp = Math.min(game.player.maxHp, game.player.hp + this.staveDrain);
        }
        this.pierce -= 1;
        if (this.pierce < 0) this.active = false;
        else this.pierceMult = Math.max(0.4, this.pierceMult * 0.75); // 贯穿伤害递减（封底 40%）
      }
    }
  }
  render(g) {
    g.save();
    // 法杖能量球：大光球渲染（区别于箭矢）
    if (this.isStave) {
      let cbody, cglow;
      if (this.fire) { cbody = "#ff7b3d"; cglow = "#ff4f3d"; }
      else if (this.ice) { cbody = "#5fc6ff"; cglow = "#3fa9ff"; }
      else { cbody = "#c77dff"; cglow = "#a865ff"; }
      g.shadowBlur = 24;
      g.shadowColor = cglow;
      g.fillStyle = cglow;
      g.globalAlpha = 0.3;
      g.beginPath();
      g.arc(this.x, this.y, 14, 0, TAU);
      g.fill();
      g.globalAlpha = 1;
      g.fillStyle = cbody;
      g.beginPath();
      g.arc(this.x, this.y, 8, 0, TAU);
      g.fill();
      g.fillStyle = "rgba(255,255,255,0.65)";
      g.beginPath();
      g.arc(this.x - 2, this.y - 2, 3, 0, TAU);
      g.fill();
      g.restore();
      return;
    }
    // 属性箭配色：普通紫 / 火橙红 / 冰蓝
    let body, glow, hot, trail;
    if (this.fire) { body = "#ff7b3d"; glow = "#ff4f3d"; hot = "#ffe3c2"; trail = "rgba(255,121,61,0.75)"; }
    else if (this.ice) { body = "#5fc6ff"; glow = "#3fa9ff"; hot = "#e6f9ff"; trail = "rgba(95,198,255,0.75)"; }
    else { body = CONFIG.COLORS.purple; glow = CONFIG.COLORS.purple; hot = CONFIG.COLORS.purpleHot; trail = "rgba(255,255,255,0.78)"; }
    g.strokeStyle = trail;
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(this.lastX, this.lastY + 10);
    g.lineTo(this.x, this.y + 26);
    g.stroke();
    g.shadowBlur = 18;
    g.shadowColor = glow;
    g.strokeStyle = hot;
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(this.x, this.y + 12);
    g.lineTo(this.x, this.y - 18);
    g.stroke();
    g.fillStyle = body;
    g.beginPath();
    g.moveTo(this.x, this.y - 24);
    g.lineTo(this.x - 7, this.y - 9);
    g.lineTo(this.x + 7, this.y - 9);
    g.closePath();
    g.fill();
    g.restore();
  }
}

class Bullet {
  constructor() { this.active = false; }
  init(x, y, vx, vy, r = 7, damage = 10, elem = null) {
    this.active = true;
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.r = r; this.damage = damage;
    this.elem = elem; // "fire" 灼烧 / "ice" 减速 / "poison" 中毒 / null 无
  }
  update(dt, game) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -40 || this.x > CONFIG.W + 40 || this.y < -60 || this.y > CONFIG.H + 80) this.active = false;
    if (this.active && game.player.canBeHit() && Util.circleHit(this, game.player)) {
      this.active = false;
      game.player.hurt(this.damage, game, 0, 36);
      // 属性弹：命中附加 DOT/减速
      if (this.elem === "fire") game.player.fireDotT = 3;       // 灼烧 3 秒
      else if (this.elem === "poison") game.player.poisonDotT = 3; // 中毒 3 秒
      else if (this.elem === "ice") game.player.iceSlowT = 2.5;   // 减速 2.5 秒
    }
  }
  render(g) {
    g.save();
    // 属性弹渲染：火=橙红 / 冰=冰蓝 / 毒=毒绿 / 普通=琥珀
    if (this.elem === "fire") { g.shadowColor = "#ff5a3d"; g.fillStyle = "#ff9b6b"; }
    else if (this.elem === "ice") { g.shadowColor = "#5fc6ff"; g.fillStyle = "#9fe8ff"; }
    else if (this.elem === "poison") { g.shadowColor = "#8aff5c"; g.fillStyle = "#b8ff8a"; }
    else { g.shadowColor = "#ff7043"; g.fillStyle = "#ffb15b"; }
    g.shadowBlur = 13;
    g.beginPath();
    g.arc(this.x, this.y, this.r, 0, TAU);
    g.fill();
    g.restore();
  }
}

// 地面危险区域（Boss 专属技能）：预警 → 生效 → 消失
// type: "spike" 地刺(高伤害爆发) / "vine" 藤蔓(减速+持续伤) / "frost" 冰域(强减速) / "fire" 火海(高持续伤) / "shadow" 暗影波
class Zone {
  constructor() { this.active = false; }
  init(x, y, type, game) {
    this.active = true;
    this.x = x; this.y = y;
    this.type = type;
    this.warn = 0.7;          // 预警时间（玩家可走位）
    this.life = 1.6;          // 生效持续时间
    this.t = 0;
    this.r = type === "frost" ? 70 : 52;
    // 伤害/效果强度随章节缩放
    const ch = game.chapter || 1;
    this.dps = type === "fire" ? 22 + ch * 3 : type === "vine" ? 10 + ch * 2 : 0;
    this.dmg = type === "spike" ? 26 + ch * 5 : type === "shadow" ? 20 + ch * 4 : 0;
  }
  update(dt, game) {
    this.t += dt;
    if (this.t < this.warn) return; // 预警阶段
    const effT = this.t - this.warn;
    // 生效阶段：对区域内玩家造成效果（区域伤害绕过无敌帧，持续压制）
    const p = game.player;
    const d = Math.hypot(p.x - this.x, p.y - this.y);
    if (d < this.r + p.r * 0.6) {
      if (this.type === "spike" || this.type === "shadow") {
        // 地刺/暗影波：高爆发持续伤害（绕过无敌帧）
        p.hp -= this.dmg * dt * 1.6;
        p.inv = Math.max(p.inv || 0, 0.05);
        p.knockY += 20 * dt;
        if (Math.random() < 0.15) game.particles.get(p.x, p.y, Util.rand(-20, 20), Util.rand(-40, 10), 0.4, "#ff7043", Util.rand(2, 4));
      } else if (this.type === "fire" || this.type === "vine") {
        // 火海/藤蔓：持续伤害（绕过无敌帧）
        p.hp -= this.dps * dt;
        p.inv = Math.max(p.inv || 0, 0.05);
        if (Math.random() < 0.2) game.particles.get(p.x, p.y, Util.rand(-20, 20), Util.rand(-40, 10), 0.4, this.type === "fire" ? "#ff7b3d" : "#5cb85c", Util.rand(2, 4));
      } else if (this.type === "frost") {
        // 冰域：强减速 + 少量持续伤害
        p.frostZoneT = 0.15;
        p.hp -= 4 * dt;
        p.inv = Math.max(p.inv || 0, 0.05);
      }
      if (p.hp <= 0) game.gameOver();
    }
    // 特效粒子
    if (Math.random() < 0.5) {
      const colors = { spike: "#d9a441", vine: "#5cb85c", frost: "#9fe8ff", fire: "#ff7b3d", shadow: "#a865ff" };
      game.particles.get(this.x + Util.rand(-this.r, this.r), this.y + Util.rand(-this.r, this.r), Util.rand(-20, 20), Util.rand(-30, 10), 0.35, colors[this.type] || "#fff", Util.rand(2, 5));
    }
    if (effT > this.life) this.active = false;
  }
  render(g) {
    g.save();
    const warnPhase = this.t < this.warn;
    const prog = warnPhase ? this.t / this.warn : (this.t - this.warn) / this.life;
    const alpha = warnPhase ? 0.25 + prog * 0.4 : 0.65 - prog * 0.3;
    const colors = { spike: "#d9a441", vine: "#5cb85c", frost: "#9fe8ff", fire: "#ff7b3d", shadow: "#a865ff" };
    const c = colors[this.type] || "#fff";
    g.globalAlpha = alpha;
    g.fillStyle = c;
    // 预警：虚线圆环 + 半透明填充；生效：实心
    if (warnPhase) {
      g.setLineDash([6, 6]);
      g.lineWidth = 3;
      g.strokeStyle = c;
      g.beginPath();
      g.arc(this.x, this.y, this.r, 0, TAU);
      g.stroke();
      g.setLineDash([]);
      g.fillStyle = c;
      g.globalAlpha = alpha * 0.3;
      g.beginPath();
      g.arc(this.x, this.y, this.r, 0, TAU);
      g.fill();
    } else {
      g.globalAlpha = alpha;
      g.beginPath();
      g.arc(this.x, this.y, this.r, 0, TAU);
      g.fill();
      // 内部细节：按类型画标记
      g.globalAlpha = 0.9;
      g.fillStyle = "#fff";
      g.font = "bold 16px sans-serif";
      g.textAlign = "center";
      g.fillText(this.type === "spike" ? "▲" : this.type === "vine" ? "❋" : this.type === "frost" ? "❄" : this.type === "fire" ? "🔥" : "☠", this.x, this.y + 6);
    }
    g.restore();
  }
}

// 金币实体：掉落物，靠近玩家自动磁吸（弓箭传说式捡钱爽感）
class Coin {
  constructor() { this.active = false; }
  init(x, y, value, vx, vy) {
    this.active = true;
    this.x = x; this.y = y;
    this.value = value;
    this.vx = vx !== undefined ? vx : Util.rand(-40, 40);
    this.vy = vy !== undefined ? vy : Util.rand(-90, -30);
    this.t = Util.rand(0, TAU);
    this.phase = Util.rand(0, TAU);
    this.settleT = 0.5; // 出生弹跳后原地停留
  }
  update(dt, game) {
    this.t += dt * 4;
    // 落地停留：只在出生时短暂弹跳，之后原地漂浮（不丢失）
    if (this.settleT > 0) {
      this.settleT -= dt;
      this.vy += 260 * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.settleT <= 0) { this.vx = 0; this.vy = 0; }
    }
    // 磁吸：靠近玩家自动飞过去
    const p = game.player;
    const dx = p.x - this.x, dy = p.y - this.y;
    const d = Math.hypot(dx, dy);
    if (d < 130) {
      const pull = (1 - d / 130) * 520;
      this.x += dx / d * pull * dt;
      this.y += dy / d * pull * dt;
      if (d < 24) {
        this.active = false;
        game.runGold = (game.runGold || 0) + this.value;
        game.particles.get(this.x, this.y, Util.rand(-20, 20), Util.rand(-40, 10), 0.3, "#f7c948", Util.rand(2, 4));
        audio.coin();
      }
    }
    // 不因下落丢失：金币永久停留在场景内
  }
  render(g) {
    g.save();
    const bob = Math.sin(this.t) * 3;
    g.translate(this.x, this.y + bob);
    g.shadowBlur = 10;
    g.shadowColor = "#f7c948";
    g.fillStyle = "#f7c948";
    g.beginPath();
    g.arc(0, 0, 5.5, 0, TAU);
    g.fill();
    g.fillStyle = "#fff1a8";
    g.beginPath();
    g.arc(0, 0, 3, 0, TAU);
    g.fill();
    g.restore();
  }
}

let enemyId = 1;
class Enemy {
  constructor() { this.active = false; }
  init(type, x, y, wave) {
    this.active = true;
    this.id = enemyId++;
    this.type = type;
    this.x = x; this.y = y;
    this.wave = wave;
    this.dead = false;
    this.t = Math.random() * 10;
    this.shootT = Util.rand(0.4, 1.8);
    this.fireT = 0;
    this.iceT = 0;
    this.poisonT = 0;
    this.poisonDps = 0;
    this.drift = Util.rand(-1, 1);
    this.isBoss = type === "boss";
    this.hitFlash = 0;
    // 抗性系统（流派反制）：装甲=物理减伤（克制纯伤害流），灵体=元素免疫（克制元素流）
    // 随波次出现：3波后装甲怪，5波后灵体怪
    this.armored = false;
    this.ethereal = false;
    if (!this.isBoss && wave >= 3 && Math.random() < 0.16) this.armored = true;
    if (!this.isBoss && wave >= 5 && Math.random() < 0.12) this.ethereal = true;
    // 首次遇到抗性怪：教育提示（防玩家困惑）
    if (this.armored && !game._armoredHint) { game._armoredHint = true; setTimeout(() => game.flashMessage("装甲怪：物理减伤 50%，元素箭克制"), 1200); }
    if (this.ethereal && !game._etherealHint) { game._etherealHint = true; setTimeout(() => game.flashMessage("灵体怪：免疫元素，物理箭克制"), 1200); }
    // 精英怪：非 Boss 波 18% 概率（随章节提升），金色边框 + 词缀 + 5倍金币
    this.isElite = !this.isBoss && Math.random() < Math.min(0.3, 0.18 + (game.chapter || 1) * 0.02) && wave >= 2;
    this.eliteAffix = this.isElite ? Util.pick(["swift", "huge", "armored", "splitter"]) : null;
    // 难度曲线：敌人 HP 随波次增长（每波 +11%），基础值提高——第三章起玩家伤害高，需要更厚的怪
    const chapBonus = 1 + Math.floor((SaveSystem.data.bestWave || 0) / 10) * 0.15;
    const waveBonus = 1 + (wave - 1) * 0.11;
    let hp = { minion: 30, archer: 44, tank: 110, flyer: 34, boss: 500 + wave * 85 }[type] * chapBonus * waveBonus;
    // 章节加成：每章敌人 HP 额外 +12%（第三章开始明显变厚，破无敌）
    hp *= 1 + ((game && game.chapter) || 1) * 0.12;
    // 精英词缀加成
    if (this.isElite) {
      hp *= this.eliteAffix === "huge" ? 3.2 : this.eliteAffix === "armored" ? 2.4 : 1.7;
      if (this.eliteAffix === "swift") this.drift = Util.rand(1.5, 2.5);
    }
    this.hp = Math.round(hp);
    this.maxHp = this.hp;
    this.r = this.isBoss ? 72 : type === "tank" ? 28 : 21;
    if (this.isElite && this.eliteAffix === "huge") this.r *= 1.5;
    this.baseSpeed = type === "tank" ? 18 : type === "flyer" ? 22 : 0;
    if (this.isElite && this.eliteAffix === "swift") this.baseSpeed = (this.baseSpeed || 26) + 40;
    this.bossRush = 0;
    // Boss 按章节绑定，不再按波次轮换。
    this.bossKind = this.isBoss ? bossForChapter((game && game.chapter) || 1).kind : null;
    if (this.isBoss) {
      const chapterScale = 1 + Math.floor((((game && game.chapter) || 1) - 1) / 5) * 0.18;
      if (this.bossKind === "demon") this.hp = Math.round(this.hp * 1.35);
      if (this.bossKind === "frost") this.hp = Math.round(this.hp * 1.18);
      this.hp = Math.round(this.hp * chapterScale);
      this.maxHp = this.hp;
    }
  }
  takeDamage(amount, crit, game, fire, ice) {
    // 抗性结算（减伤而非免疫，避免玩家死局）：
    // 装甲=物理减伤50%（元素伤害全额）；灵体=元素减伤50%（物理全额）
    if (this.armored && !fire && !ice) amount *= 0.5;
    if (this.ethereal && (fire || ice)) amount *= 0.5;
    if (amount <= 0) {
      // 抗性提示
      if (Math.random() < 0.4) game.particles.get(this.x, this.y - this.r - 10, Util.rand(-10, 10), -40, 0.5, this.ethereal ? "#9fe8ff" : "#cfd4dc", 1, "抗性", false);
      return;
    }
    this.hp -= amount;
    this.hitFlash = 0.08; // 受击白闪
    if (fire) this.fireT = 3;
    if (ice) this.iceT = 2.5;
    game.damageNumber(this.x, this.y - this.r - 12, Math.round(amount), crit);
    audio.hit();
    // 属性命中特效：火=橙色爆燃，冰=蓝白冰晶
    if (fire) for (let i = 0; i < 8; i++) game.particles.get(this.x, this.y, Util.rand(-70, 70), Util.rand(-100, 20), Util.rand(0.3, 0.6), Util.pick(["#ff7b3d", "#ff4f3d", "#ffb15b"]), Util.rand(3, 7));
    if (ice) for (let i = 0; i < 8; i++) game.particles.get(this.x, this.y, Util.rand(-70, 70), Util.rand(-100, 20), Util.rand(0.3, 0.6), Util.pick(["#9fe8ff", "#5fc6ff", "#e6f9ff"]), Util.rand(3, 6));
    for (let i = 0; i < 4; i++) game.particles.get(this.x, this.y, Util.rand(-55, 55), Util.rand(-90, -20), 0.35, crit ? "#ffd56a" : "#fb8840", Util.rand(3, 7));
    if (this.hp <= 0) this.kill(game);
  }
  kill(game) {
    if (this.dead) return;
    this.dead = true;
    this.active = false;
    game.kills += 1;
    game.score += this.isBoss ? CONFIG.BOSS_SCORE : CONFIG.ENEMY_SCORE;
    // Boss 击杀：慢镜 + 重震屏
    if (this.isBoss) {
      game.slowMo = 0.6;
      game.shake = Math.max(game.shake || 0, 18);
    } else {
      game.shake = Math.max(game.shake || 0, 3.5);
    }
    // 金币掉落：收紧经济（v3.44：小兵2→1/弓手3→2/坦克5→3/精英4→3倍/Boss40→30），第1章≈75金
    const base = this.isBoss ? 30 : { minion: 1, archer: 2, tank: 3, flyer: 2 }[this.type] || 1;
    // 招财天赋：金币获取加成
    const goldMult = (game.player.heroGoldMult || 1);
    const total = Math.round(base * (1 + game.wave * 0.015) * (this.isElite ? 3 : 1) * goldMult);
    // 拆成 1-3 枚金币掉落（更有捡钱感）
    const nCoins = this.isBoss ? 5 : this.isElite ? 3 : Util.randi(1, 2);
    for (let i = 0; i < nCoins; i++) {
      game.coins.get(this.x + Util.rand(-14, 14), this.y + Util.rand(-10, 10), Math.max(1, Math.round(total / nCoins)), Util.rand(-60, 60), Util.rand(-140, -40));
    }
    for (let i = 0; i < (this.isBoss ? 34 : this.isElite ? 22 : 12); i++) {
      game.particles.get(this.x, this.y, Util.rand(-130, 130), Util.rand(-180, 60), Util.rand(0.35, 0.9), this.isBoss || this.isElite ? "#f7c948" : "#d99a48", Util.rand(3, 10));
    }
    if (this.isBoss) {
      game.boss = null;
      game.spawnChest();
    }
    // 分裂词缀：精英死亡分裂成 2 个小兵
    // ⚠️ 关键：分裂出的 minion 必须强制非精英——否则 Enemy.init 有 18-30% 概率
    // 再随机成 splitter 精英 → 杀掉又分裂 → 无限循环 → 房间永远清不完（卡死根因！）
    if (this.isElite && this.eliteAffix === "splitter" && !this._noSplit) {
      for (let i = 0; i < 2; i++) {
        const sub = game.enemies.get("minion", this.x + (i ? 50 : -50), this.y + 20, game.wave);
        sub.isElite = false;
        sub.eliteAffix = null;
        sub._noSplit = true; // 保险：即使意外标记精英也不分裂
      }
      game.flashMessage("精英分裂成 2 个小兵！");
    }
    // 图鉴解锁：击杀记录怪物/Boss/精英词缀
    if (this.isBoss) codexUnlock("monsters", "boss_" + this.bossKind);
    else codexUnlock("monsters", this.type);
    if (this.isElite && this.eliteAffix) codexUnlock("monsters", "elite_" + this.eliteAffix);
  }
  update(dt, game) {
    this.t += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const scroll = 0;
    this.y += scroll;
    if (this.fireT > 0) {
      this.fireT -= dt;
      // 灼烧：精英/Boss 减半（元素流不是无脑最优）
      const dotMul = (this.isElite || this.isBoss) ? 0.5 : 1;
      this.takeDot(8 * (game.player.elemBoost || 1) * (game.player.burnMult || 1) * dotMul * dt, game, "#e54d3c");
    }
    // 毒 DOT：无视护甲（剧毒箭）
    if (this.poisonT > 0) {
      this.poisonT -= dt;
      this.hp -= (this.poisonDps || 4) * (game.player.elemBoost || 1) * dt; // 元素大师强化毒 DOT
      if (Math.random() < 0.1) game.particles.get(this.x, this.y - this.r * 0.5, Util.rand(-12, 12), Util.rand(-30, -5), 0.4, "#8aff5c", Util.rand(2, 3.5));
      if (this.hp <= 0) this.kill(game);
    }
    if (this.iceT > 0) this.iceT -= dt;
    const slow = this.iceT > 0 ? 0.5 / (game.player.slowMult || 1) : 1;
    // 房间制：敌人主动朝玩家移动（不再依赖滚动）
    // 小兵/坦克/飞行怪持续向玩家靠近，射手保持距离
    if (!this.isBoss && this.type !== "archer") {
      const dx = game.player.x - this.x;
      const dy = game.player.y - this.y;
      const d = Math.max(1, Math.hypot(dx, dy));
      // 冲刺怪（小兵/精英swift）加速冲脸，其他缓慢逼近
      // v3.44: 移速随章节缩放——第1章慢(×0.85)后期快(×1.1)，初始章节不再瞬追
      const ch = (game.chapter || 1);
      const chSpd = 0.85 + ch * 0.05;
      const chase = (this.type === "minion" ? (this.isElite ? 140 : 100)
        : this.type === "tank" ? 42
        : this.type === "flyer" ? 88 : 60) * chSpd;
      let chaseSpeed = (this.isElite && this.eliteAffix === "swift" ? 170 : chase) * slow;
      // 攻击欲望：小兵受伤后狂暴（被打加速逼近，越打越急）
      if (this.type === "minion" && this.hp < this.maxHp * 0.5 && !this.isElite) {
        chaseSpeed *= 1.35;
        if (Math.random() < 0.04) game.particles.get(this.x, this.y - this.r, Util.rand(-10, 10), -30, 0.3, "#ff6b4d", Util.rand(2, 4));
      }
      // 走位 IQ：小兵逼近时横向绕行（蛇形接近，不直线送死）
      if (this.type === "minion" && d < 260) {
        const weave = Math.sin(this.t * 3 + this.drift * 6) * 46;
        const perpX = -dy / d, perpY = dx / d;
        this.x += perpX * weave * dt + dx / d * chaseSpeed * dt;
        this.y += perpY * weave * dt + dy / d * chaseSpeed * dt;
      } else {
        this.x += dx / d * chaseSpeed * dt;
        this.y += dy / d * chaseSpeed * dt;
      }
      // 包抄 IQ：多个小兵用不同 drift 绕左右翼（不挤成一团直线冲）
      if (this.type === "minion" && d < 300) {
        const side = (this.drift > 0.5 ? 1 : -1) * 34;
        const perpX = -dy / d, perpY = dx / d;
        this.x += perpX * side * dt * 1.4;
        this.y += perpY * side * dt * 1.4;
      }
    } else if (!this.isBoss && this.type === "archer") {
      // 射手：保持距离（玩家靠近则后退，远离则前进）+ 侧移走位
      const dx = game.player.x - this.x;
      const dy = game.player.y - this.y;
      const d = Math.max(1, Math.hypot(dx, dy));
      const strafe = Math.sin(this.t * 1.7 + this.drift * 5) * 60;
      const perpX = -dy / d, perpY = dx / d;
      if (d < 260) {
        this.x += (-dx / d * 55 + perpX * strafe) * slow * dt;
        this.y += (-dy / d * 55 + perpY * strafe) * slow * dt;
      } else if (d > 340) {
        this.x += (dx / d * 45 + perpX * strafe) * slow * dt;
        this.y += (dy / d * 45 + perpY * strafe) * slow * dt;
      } else {
        // 中距离：侧移绕圈保持压制
        this.x += perpX * strafe * slow * dt;
        this.y += perpY * strafe * slow * dt;
      }
    }
    // 飘动感：飞行怪左右摆动
    if (this.type === "flyer") {
      this.x += Math.sin(this.t * 2.4 + this.drift) * 30 * dt;
    }
    // 攻击欲望：射手更频繁攻击 + 预判玩家走位 + 概率连射 + 弹幕伤害随章节
    if (this.type === "archer") {
      this.shootT -= dt;
      if (this.shootT <= 0) {
        // 射击频率随章节提升（攻击欲望成长）
        const ch = (game.chapter || 1);
        this.shootT = Util.rand(Math.max(0.7, 1.3 - ch * 0.08), Math.max(1.0, 1.9 - ch * 0.08));
        const lead = game.player.x + game.player.vx * 0.3;
        const leadY = game.player.y + game.player.vy * 0.3;
        const ldx = lead - this.x, ldy = leadY - this.y;
        const llen = Math.max(1, Math.hypot(ldx, ldy));
        const bulletDmg = 8 + ch * 1.5;
        const bvx = ldx / llen * (180 + ch * 6);
        const bvy = ldy / llen * (180 + ch * 6);
        // 属性弹：第3章起 archer 25% 冰弹（减速玩家），精英 40% 随机属性（火/冰/毒）
        let elem = null;
        if (this.isElite && Math.random() < 0.4) elem = Util.pick(["fire", "ice", "poison"]);
        else if (ch >= 3 && Math.random() < 0.25) elem = "ice";
        game.bullets.get(this.x, this.y + this.r * 0.4, bvx, bvy, 7, bulletDmg, elem);
        // 30% 概率连射第二发（预判偏移，逼玩家侧移）
        if (Math.random() < 0.3 + ch * 0.02) {
          const off = Util.rand(-0.1, 0.1);
          const a2 = Math.atan2(bvy, bvx) + off;
          game.bullets.get(this.x, this.y + this.r * 0.4, Math.cos(a2) * (190 + ch * 6), Math.sin(a2) * (190 + ch * 6), 6, bulletDmg * 0.8);
        }
      }
    }
    // 坦克：撞击力增强（近身会造成更大威胁）+ 撞击伤害随章节
    if (this.type === "tank") {
      const tdx = game.player.x - this.x;
      const tdy = game.player.y - this.y;
      const td = Math.max(1, Math.hypot(tdx, tdy));
      if (td < 130) {
        const sp = 90 * slow;
        this.x += tdx / td * sp * dt;
        this.y += tdy / td * sp * dt;
      }
    }
    // 精英专属技能：swift 疾冲 / armored 震地 / splitter 自爆分裂加速
    if (this.isElite && !this.isBoss) {
      if (this.eliteAffix === "swift") {
        // 疾冲：周期性爆发冲刺（v3.44: 削弱——之前2.6s一次130px瞬移粘人甩不掉）
        this.dashT = (this.dashT || 0) - dt;
        if (this.dashT <= 0) {
          this.dashT = 3.2;
          const dx2 = game.player.x - this.x, dy2 = game.player.y - this.y;
          const d2 = Math.max(1, Math.hypot(dx2, dy2));
          this.x += dx2 / d2 * 100;
          this.y += dy2 / d2 * 100;
          for (let i = 0; i < 8; i++) game.particles.get(this.x, this.y, Util.rand(-40, 40), Util.rand(-40, 40), 0.4, "#ffd56a", Util.rand(2, 5));
        }
      } else if (this.eliteAffix === "armored") {
        // 震地：近身时 AOE 弹幕
        this.stompT = (this.stompT || 0) - dt;
        if (this.stompT <= 0 && Util.circleHit(this, game.player) === false && Math.hypot(game.player.x - this.x, game.player.y - this.y) < 240) {
          this.stompT = 3.2;
          for (let i = 0; i < 8; i++) {
            const a = (i / 8) * TAU;
            game.bullets.get(this.x, this.y + this.r * 0.4, Math.cos(a) * 140, Math.sin(a) * 140, 6, 8 + (game.chapter || 1));
          }
        }
      } else if (this.eliteAffix === "splitter") {
        // 分裂怪：低血时（<40%）才加速冲脸——之前无条件每帧冲脸导致"快+粘人甩不掉"
        // ⚠️ 注意：chaseSpeed 是上面 if 块的块级 let 变量，这里引用会 ReferenceError
        // 导致 rAF 主循环中断 = 游戏"卡住"（曾修过：v3.44 前的卡死根因）
        if (this.hp < this.maxHp * 0.4) {
          const sdx = game.player.x - this.x, sdy = game.player.y - this.y;
          const sd = Math.max(1, Math.hypot(sdx, sdy));
          const spd = 130 * (0.85 + (game.chapter || 1) * 0.05) * slow; // 低血加速（降至130）
          this.x += sdx / sd * spd * dt;
          this.y += sdy / sd * spd * dt;
        }
      }
    }
    if (this.isBoss) this.updateBoss(dt, game, slow);
    if (this.y > CONFIG.H + this.r + 80) this.active = false;
    if (!this.dead && game.player.canBeHit() && Util.circleHit(this, game.player)) {
      // 碰撞伤害随章节成长（v3.44: 前期温和 13+ch×2，第1章15 可挨3下）
      const hitDmg = 13 + (game.chapter || 1) * 2;
      game.player.hurt(hitDmg, game, Math.sign(game.player.x - this.x) * 90, 50);
    }
  }
  takeDot(amount, game, color) {
    this.hp -= amount;
    if (Math.random() < 0.06) game.particles.get(this.x, this.y - this.r, Util.rand(-15, 15), -45, 0.35, color, 4);
    if (this.hp <= 0) this.kill(game);
  }
  shootAtPlayer(game, speed) {
    const dx = game.player.x - this.x;
    const dy = game.player.y - this.y;
    const len = Math.max(1, Math.hypot(dx, dy));
    game.bullets.get(this.x, this.y + this.r * 0.4, dx / len * speed, dy / len * speed, 8, 10 + (game.chapter || 1) * 2);
  }
  updateBoss(dt, game, slow) {
    // Boss 主动逼近玩家（不再左右死摆）+ 周期性冲锋压脸
    const px = game.player.x, py = game.player.y;
    const dx = px - this.x, dy = py - this.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    // 狂暴阶段：血量 <35% 时全面强化（攻击欲望爆发）
    const enrage = this.hp < this.maxHp * 0.35;
    if (enrage && !this._enraged) {
      this._enraged = true;
      game.flashMessage("Boss 狂暴了！");
      audio.boss();
      for (let i = 0; i < 26; i++) game.particles.get(this.x, this.y, Util.rand(-140, 140), Util.rand(-160, 60), 0.8, "#ff3b30", Util.rand(4, 10));
    }
    const enrageMult = enrage ? 1.5 : 1;
    // 逼近速度：保持中距压制（太近会退，太远会追）——x/y 同时逼近
    // v3.44: 狂暴追速 1.25→1.5，压迫感更强
    const chaseSpeed = 70 * slow * (enrage ? 1.5 : 1);
    this.x += dx / d * chaseSpeed * dt;
    this.y += dy / d * chaseSpeed * 0.8 * dt;
    // 冲锋：狂暴前 3.2 秒一次，狂暴后 1.5 秒一次（更频繁压脸）
    this.rushT -= dt;
    if (this.rushT <= 0) {
      this.rushT = (enrage ? 1.5 : 3.2) + Util.rand(0, 1.2);
      this.rushing = 1.5; // v3.44: 1.1→1.5s，冲锋距离拉长 36%
      this.rushDirX = dx / d;
      this.rushDirY = dy / d;
      audio.boss();
    }
    if (this.rushing > 0) {
      this.rushing -= dt;
      const rushSpd = 300 * (enrage ? 1.3 : 1); // v3.44: 240→300
      this.x += this.rushDirX * rushSpd * dt;
      this.y += this.rushDirY * rushSpd * dt;
    }
    // 玩家太远时加速逼近，太近时后撤保持压力
    if (d > 320) { this.x += dx / d * 90 * dt; this.y += dy / d * 90 * dt; }
    else if (d < 110 && this.rushing <= 0) { this.x -= dx / d * 60 * dt; this.y -= dy / d * 60 * dt; }
    // 压迫上限放宽：Boss 可以压到玩家附近（0.82 高度），冲锋不再被 clamp 截断
    this.y = Util.clamp(this.y, 100, CONFIG.H * 0.82);
    this.x = Util.clamp(this.x, 80, CONFIG.W - 80);
    // 多样化攻击：随机攻击顺序（不固定轮换，玩家无法背板）+ 专属 Zone 技能 40% 概率
    this.shootT -= dt;
    if (this.shootT <= 0) {
      // 狂暴时攻击更密：普通攻击间隔乘 0.5（v3.44: 0.65→0.5，狂暴攻速翻倍体感明显）
      const cdMult = enrage ? 0.5 : 1;
      // 45% 概率放专属地面技能（zone），否则随机普通攻击
      if (Math.random() < 0.45) {
        this.attackMode = 3;
      } else {
        this.attackMode = Math.floor(Math.random() * 3);
      }
      const mode = this.attackMode;
      if (this.bossKind === "treant") {
        // 树精王（召唤+藤蔓）：扇形（0）→ 召唤（1）→ 藤蔓直线（2）→ 藤蔓地刺阵（3）
        if (mode === 0) {
          this.shootT = (1.5 * cdMult);
          for (let i = -2; i <= 2; i++) {
            const a = Math.atan2(py - this.y, px - this.x) + i * 0.24;
            game.bullets.get(this.x, this.y + 35, Math.cos(a) * 175, Math.sin(a) * 175, 8, (10 + (game.chapter || 1) * 2));
          }
        } else if (mode === 1) {
          this.shootT = (1.8 * cdMult);
          const sm1 = game.enemies.get("minion", this.x + Util.rand(-40, 40), this.y + 70, game.wave);
          const sm2 = game.enemies.get("minion", this.x + Util.rand(-40, 40), this.y + 85, game.wave);
          const sm3 = game.enemies.get("minion", this.x + Util.rand(-60, 60), this.y + 100, game.wave);
          sm1.isElite = false; sm1.eliteAffix = null; sm1._noSplit = true; // Boss 召唤物非精英
          sm2.isElite = false; sm2.eliteAffix = null; sm2._noSplit = true;
          sm3.isElite = false; sm3.eliteAffix = null; sm3._noSplit = true;
        } else if (mode === 2) {
          this.shootT = (1.2 * cdMult);
          const a = Math.atan2(py - this.y, px - this.x);
          game.bullets.get(this.x, this.y + 30, Math.cos(a) * 300, Math.sin(a) * 300, 12, (14 + (game.chapter || 1) * 2));
          game.bullets.get(this.x + Math.sin(this.t) * 40, this.y + 40, Math.cos(a) * 300, Math.sin(a) * 300, 10, (12 + (game.chapter || 1) * 2));
        } else {
          // 专属：玩家脚下 + 左右撒藤蔓地刺阵
          this.shootT = (2.4 * cdMult);
          game.zones.get(px, py, "vine", game);
          game.zones.get(px - 110, py + Util.rand(-30, 30), "vine", game);
          game.zones.get(px + 110, py + Util.rand(-30, 30), "vine", game);
          this.say && this.say("藤蔓地刺阵！快离开");
        }
      } else if (this.bossKind === "scorpion") {
        // 沙蝎王（陷阱）：连射（0）→ 尾刺下砸（1）→ 直线弹幕（2）→ 地刺陷阱阵（3）
        if (mode === 0) {
          this.shootT = (0.8 * cdMult);
          const a = Math.atan2(py - this.y, px - this.x);
          for (const off of [-0.09, 0.09]) game.bullets.get(this.x, this.y + 45, Math.cos(a + off) * 235, Math.sin(a + off) * 235, 6, (9 + (game.chapter || 1) * 2));
        } else if (mode === 1) {
          this.shootT = (2.0 * cdMult);
          game.bullets.get(this.x + Math.sin(this.t) * 70, this.y + 70, 0, 290, 12, (16 + (game.chapter || 1) * 2));
          game.bullets.get(this.x - Math.sin(this.t) * 70, this.y + 70, 0, 260, 10, (14 + (game.chapter || 1) * 2));
        } else if (mode === 2) {
          this.shootT = (1.1 * cdMult);
          const a = Math.atan2(py - this.y, px - this.x);
          game.bullets.get(this.x, this.y + 40, Math.cos(a) * 260, Math.sin(a) * 260, 7, (10 + (game.chapter || 1) * 2));
        } else {
          // 专属：预判玩家走位放 3 连地刺（封走位）
          this.shootT = (2.6 * cdMult);
          const leadX = px + game.player.vx * 0.25;
          game.zones.get(leadX, py, "spike", game);
          game.zones.get(leadX + 90, py + 40, "spike", game);
          game.zones.get(leadX - 90, py - 30, "spike", game);
          this.say && this.say("地刺陷阱！");
        }
      } else if (this.bossKind === "frost") {
        // 冰霜巨人（控场）：宽扇形（0）→ 冰柱直线（1）→ 横扫（2）→ 冰域减速阵（3）
        if (mode === 0) {
          this.shootT = (1.6 * cdMult);
          for (let i = -3; i <= 3; i++) {
            const a = Math.atan2(py - this.y, px - this.x) + i * 0.18;
            game.bullets.get(this.x, this.y + 35, Math.cos(a) * 150, Math.sin(a) * 150, 9, (9 + (game.chapter || 1) * 2));
          }
        } else if (mode === 1) {
          this.shootT = (1.3 * cdMult);
          const a = Math.atan2(py - this.y, px - this.x);
          game.bullets.get(this.x, this.y + 30, Math.cos(a) * 300, Math.sin(a) * 300, 11, (12 + (game.chapter || 1) * 2));
          game.bullets.get(this.x, this.y + 40, Math.cos(a) * 260, Math.sin(a) * 260, 9, (10 + (game.chapter || 1) * 2));
        } else if (mode === 2) {
          this.shootT = (1.4 * cdMult);
          const a = Math.atan2(py - this.y, px - this.x) + Math.PI / 2;
          for (let i = 0; i < 6; i++) {
            const ang = a + i * 0.5 - 1.25;
            game.bullets.get(this.x, this.y + 35, Math.cos(ang) * 165, Math.sin(ang) * 165, 8, (9 + (game.chapter || 1) * 2));
          }
        } else {
          // 专属：玩家区域铺冰域（强减速+伤害）
          this.shootT = (2.8 * cdMult);
          game.zones.get(px, py, "frost", game);
          game.zones.get(px + 120, py + 60, "frost", game);
          game.zones.get(px - 120, py - 40, "frost", game);
          this.say && this.say("冰封领域！");
        }
      } else if (this.bossKind === "demon") {
        // 炎魔领主（火海）：密扇形（0）→ 召唤坦克（1）→ 火球连发（2）→ 火海封路（3）
        if (mode === 0) {
          this.shootT = (1.8 * cdMult);
          for (let i = -3; i <= 3; i++) {
            const a = Math.atan2(py - this.y, px - this.x) + i * 0.17;
            game.bullets.get(this.x, this.y + 35, Math.cos(a) * 195, Math.sin(a) * 195, 10, (13 + (game.chapter || 1) * 2));
          }
        } else if (mode === 1) {
          this.shootT = (2.2 * cdMult);
          const stk = game.enemies.get("tank", this.x + Util.rand(-50, 50), this.y + 80, game.wave);
          const stk2 = game.enemies.get("tank", this.x + Util.rand(-60, 60), this.y + 105, game.wave);
          stk.isElite = false; stk.eliteAffix = null; stk._noSplit = true; // Boss 召唤物非精英
          stk2.isElite = false; stk2.eliteAffix = null; stk2._noSplit = true;
        } else if (mode === 2) {
          this.shootT = (0.7 * cdMult);
          const a = Math.atan2(py - this.y, px - this.x);
          game.bullets.get(this.x, this.y + 35, Math.cos(a) * 250, Math.sin(a) * 250, 9, (12 + (game.chapter || 1) * 2));
        } else {
          // 专属：火海横排封住玩家撤退路线
          this.shootT = (2.5 * cdMult);
          for (let i = -1; i <= 1; i++) {
            game.zones.get(px + i * 95, py + 30, "fire", game);
          }
          this.say && this.say("地狱火海！");
        }
      } else {
        // 暗影魔王（刺客）：双发瞄准（0）→ 暗影波（1）→ 闪现突袭（2）→ 暗影波地毯（3）
        if (mode === 0) {
          this.shootT = (1.0 * cdMult);
          const a = Math.atan2(py - this.y, px - this.x);
          for (const off of [-0.12, 0.12]) game.bullets.get(this.x, this.y + 35, Math.cos(a + off) * 225, Math.sin(a + off) * 225, 7, (10 + (game.chapter || 1) * 2));
        } else if (mode === 1) {
          this.shootT = (1.5 * cdMult);
          const a = Math.atan2(py - this.y, px - this.x);
          game.bullets.get(this.x, this.y + 35, Math.cos(a) * 320, Math.sin(a) * 320, 13, (15 + (game.chapter || 1) * 2));
        } else if (mode === 2) {
          // 闪现：瞬移到玩家上方突袭
          this.shootT = (1.4 * cdMult);
          this.x = Util.clamp(px + Util.rand(-60, 60), 80, CONFIG.W - 80);
          this.y = Util.clamp(py - 160, 100, CONFIG.H * 0.6);
          for (let i = -1; i <= 1; i++) {
            const a = Math.PI / 2 + i * 0.22;
            game.bullets.get(this.x, this.y + 35, Math.cos(a) * 190, Math.sin(a) * 190, 8, (11 + (game.chapter || 1) * 2));
          }
          for (let i = 0; i < 12; i++) game.particles.get(this.x, this.y, Util.rand(-60, 60), Util.rand(-60, 60), 0.5, "#a865ff", Util.rand(3, 7));
        } else {
          // 专属：脚下暗影波 + 逃跑方向补一个
          this.shootT = (2.2 * cdMult);
          game.zones.get(px, py, "shadow", game);
          const away = px + (px - this.x) * 0.8;
          game.zones.get(Util.clamp(away, 80, CONFIG.W - 80), py + 50, "shadow", game);
          this.say && this.say("暗影吞噬！");
        }
      }
    }
  }
  render(g) {
    const s = Util.worldScale(this.y);
    drawShadow(g, this.x, this.y + this.r * 0.55, this.r * 1.25 * s, this.r * 0.42 * s, this.isBoss ? 0.42 : 0.28);
    if (this.type !== "flyer") drawStonePlatform(g, this.x, this.y + this.r * 0.72, this.r * 1.35 * s);
    g.save();
    g.translate(this.x, this.y);
    g.scale(s, s);
    if (this.iceT > 0) {
      g.shadowBlur = 20;
      g.shadowColor = CONFIG.COLORS.blue;
    } else if (this.fireT > 0) {
      g.shadowBlur = 18;
      g.shadowColor = CONFIG.COLORS.red;
    } else if (this.isBoss && this.hp < this.maxHp * 0.35) {
      // 狂暴持续特效：红色发光 + 呼吸脉冲（v3.44 新增，狂暴体感明显）
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.012);
      g.shadowBlur = 26 + 14 * pulse;
      g.shadowColor = "#ff3b30";
      // 拖尾火星
      if (Math.random() < 0.5) {
        game.particles.get(this.x + Util.rand(-this.r, this.r), this.y + Util.rand(-this.r, this.r), Util.rand(-30, 30), Util.rand(-60, 20), 0.4, "#ff5a4d", Util.rand(2, 4));
      }
    }
    if (this.isBoss) drawBoss(g, this);
    else if (this.type === "tank") drawTank(g);
    else if (this.type === "archer") drawArcher(g);
    else if (this.type === "flyer") drawFlyer(g, this.t);
    else drawMinion(g);
    // 抗性标识：装甲=银框+盾标，灵体=蓝框+灵标
    if (this.armored) {
      g.strokeStyle = "#c9d4e0";
      g.lineWidth = 3;
      g.setLineDash([7, 5]);
      g.beginPath();
      g.arc(0, 0, this.r * 1.1, 0, TAU);
      g.stroke();
      g.setLineDash([]);
      g.fillStyle = "#c9d4e0";
      g.font = "bold 14px Microsoft YaHei, sans-serif";
      g.textAlign = "center";
      g.fillText("甲", 0, -this.r * 1.1 - 6);
    } else if (this.ethereal) {
      g.globalAlpha = 0.35;
      g.fillStyle = "#9fe8ff";
      g.beginPath();
      g.arc(0, 0, this.r * 0.9, 0, TAU);
      g.fill();
      g.globalAlpha = 1;
      g.strokeStyle = "#9fe8ff";
      g.lineWidth = 3;
      g.beginPath();
      g.arc(0, 0, this.r * 1.1, 0, TAU);
      g.stroke();
      g.fillStyle = "#9fe8ff";
      g.font = "bold 14px Microsoft YaHei, sans-serif";
      g.textAlign = "center";
      g.fillText("灵", 0, -this.r * 1.1 - 6);
    }
    // 精英怪：金色描边 + 词缀标记
    if (this.isElite) {
      g.strokeStyle = "#f7c948";
      g.lineWidth = 3.5;
      g.shadowBlur = 14;
      g.shadowColor = "#f7c948";
      g.beginPath();
      g.arc(0, 0, this.r * 1.15, 0, TAU);
      g.stroke();
      g.shadowBlur = 0;
      const affixLabel = { swift: "速", huge: "巨", armored: "甲", splitter: "裂" }[this.eliteAffix] || "精";
      g.fillStyle = "#f7c948";
      g.font = "bold 15px Microsoft YaHei, sans-serif";
      g.textAlign = "center";
      g.fillText(affixLabel, 0, -this.r * 1.15 - 6);
    }
    // 受击白闪叠加
    if (this.hitFlash > 0) {
      g.globalAlpha = Util.clamp(this.hitFlash / 0.08, 0, 1) * 0.85;
      g.fillStyle = "#ffffff";
      g.beginPath();
      g.arc(0, 0, this.r * 1.1, 0, TAU);
      g.fill();
      g.globalAlpha = 1;
    }
    g.restore();
    if (!this.isBoss) {
      drawSmallHp(g, this.x, this.y - this.r * s - 16, 48, this.hp / this.maxHp);
    }
    // 状态可视化：燃烧火苗 / 冰冻寒气（从敌人身上冒出的粒子）
    if (this.fireT > 0 && Math.random() < 0.5) {
      game.particles.get(this.x + Util.rand(-14, 14), this.y - this.r * s, Util.rand(-8, 8), -60, 0.4, Util.pick(["#ff7b3d", "#ffb15b"]), Util.rand(2.5, 5));
    }
    if (this.iceT > 0 && Math.random() < 0.5) {
      game.particles.get(this.x + Util.rand(-14, 14), this.y - this.r * s, Util.rand(-6, 6), -30, 0.45, Util.pick(["#9fe8ff", "#d6f5ff"]), Util.rand(2, 4));
    }
  }
}

class Sword {
  constructor(index, game) {
    this.index = index;
    this.angle = index * TAU / 3;
    this.cooldown = Util.rand(0, 0.4);
    this.target = null;
    this.slashT = 0;
    this.x = game.player.x;
    this.y = game.player.y;
  }
  update(dt, game) {
    const n = Math.max(1, game.player.swords.length);
    // 御剑：平时环绕玩家，锁定目标后飞出斩击，命中才结算伤害
    if (this.target) {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const d = Math.hypot(dx, dy);
      if (!this.target.active || this.target.dead) {
        this.target = null;
        return;
      }
      if (d < 16) {
        // 飞到目标：命中结算
        const dmg = 15 * (game.player.summonBoost || 1);
        this.target.takeDamage(game.player.spirit ? dmg * 2 : dmg, false, game, false, false);
        // 弹射剑：命中后弹射至附近其他敌人
        if (game.player.ricochet > 0) {
          let next = null, nd = 1e9;
          for (const e of game.enemies.active()) {
            if (e === this.target || e.dead) continue;
            const dd = Math.hypot(e.x - this.target.x, e.y - this.target.y);
            if (dd < 260 && dd < nd) { next = e; nd = dd; }
          }
          if (next) {
            this.target = next;
            game.player.ricochet--;
            return;
          }
        }
        this.target = null;
        this.slashT = 0.12;
        audio.sword();
        for (let i = 0; i < 10; i++) game.particles.get(this.x, this.y, Util.rand(-50, 50), Util.rand(-70, 20), 0.4, "#d9f7ff", Util.rand(2, 5));
        return;
      }
      const sp = 640 * (1 + (game.player.flyBonus || 0)); // 骑剑加速卡提升御剑飞行速度
      this.x += dx / d * sp * dt;
      this.y += dy / d * sp * dt;
      this.angle += 12 * dt; // 飞行旋转
      if (Math.random() < 0.6) game.particles.get(this.x, this.y, Util.rand(-10, 10), Util.rand(-10, 10), 0.22, "#d9f7ff", Util.rand(2, 4));
      return;
    }
    this.angle += 3.2 * dt;
    const orbit = 42;
    this.x = game.player.x + Math.cos(this.angle + this.index * TAU / n) * orbit;
    this.y = game.player.y + Math.sin(this.angle + this.index * TAU / n) * orbit * 0.45;
    this.cooldown -= dt;
    if (this.cooldown <= 0) {
      // 索敌：以玩家为中心的全屏索敌（御剑应该主动找怪打）
      const px = game.player.x, py = game.player.y;
      const detect = 560 * (game.player.spirit ? 1.5 : 1);
      let best = null;
      let bestD = 999999;
      for (const e of game.enemies.active()) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - px, e.y - py);
        // 优先索敌玩家上方的敌人（屏幕内）
        if (d < bestD && d < detect && e.y > py - 560) { best = e; bestD = d; }
      }
      if (best) {
        this.target = best;
        this.cooldown = 0.9 * (game.player.swordCd || 1); // 御剑极速卡降低攻击间隔
      } else {
        this.cooldown = 0.35 * (game.player.swordCd || 1);
      }
    }
    if (this.slashT > 0) this.slashT -= dt;
  }
  render(g) {
    g.save();
    g.shadowBlur = 15;
    g.shadowColor = "#d9f7ff";
    g.translate(this.x, this.y);
    g.rotate(this.angle + Math.PI / 2);
    g.fillStyle = "#d9f7ff";
    g.fillRect(-3, -17, 6, 28);
    g.fillStyle = "#88d8ff";
    g.beginPath();
    g.moveTo(0, -25);
    g.lineTo(-7, -13);
    g.lineTo(7, -13);
    g.closePath();
    g.fill();
    g.fillStyle = "#ffe08a";
    g.fillRect(-8, 8, 16, 4);
    g.restore();
    if (this.slashT > 0 && this.target) {
      g.save();
      g.globalAlpha = this.slashT / 0.12;
      g.strokeStyle = "#d9f7ff";
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(this.x, this.y);
      g.lineTo(this.target.x, this.target.y);
      g.stroke();
      g.restore();
    }
  }
}

class Player {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = CONFIG.W / 2;
    this.y = CONFIG.PLAYER_Y;
    this.r = CONFIG.PLAYER_R;
    this.hp = 50;
    this.maxHp = 50; // v3.44: 40→50，前期容错（第1章碰撞15可挨3下）
    this.moveSpeed = CONFIG.BASE_MOVE_SPEED;
    this.damage = CONFIG.BASE_ARROW_DAMAGE;
    this.fireRate = CONFIG.BASE_FIRE_RATE;
    this.roomDmg = 0;   // 本房间伤害增益（穿门重置）
    this.roomRate = 1;  // 本房间射速倍率（穿门重置）
    this.range = CONFIG.BASE_RANGE;
    this.arrowCount = 1;
    this.pierce = 0;
    this.crit = 0;
    this.fire = false;
    this.ice = false;
    this.split = false;
    this.volt = 0;
    this.frostfire = false;
    this.regen = 0;
    this.shield = 0;
    this.elemBoost = 1;
    this.summonBoost = 1;
    this.swordCd = 1;      // 御剑攻击间隔倍率（1=0.9s，御剑极速卡降低）
    this.spirit = false;
    this.lifesteal = 0;
    this.orb = 0;
    this.homing = false;
    this.pierceAll = false;
    this.bounce = 0;        // 弹射墙（箭撞墙反弹）
    this.poison = false;    // 毒箭（DOT）
    this.critDmg = 2;       // 暴击伤害倍数
    this.dodge = 0;         // 闪避率
    this.thorns = 0;        // 荆棘反伤
    this.berserk = 0;       // 狂暴（低血加伤）
    this.swift = 0;         // 迅捷（箭速）
    this.ricochet = 0;      // 弹射敌人数
    this.frostZoneT = 0;    // 冰域减速计时
    this.fireDotT = 0;      // 灼烧 DOT（属性弹）
    this.poisonDotT = 0;    // 中毒 DOT（属性弹）
    this.iceSlowT = 0;      // 减速（属性弹）
    // 法杖专属卡
    this.stavePower = 0;    // 法力强化（能量球 +20% 伤害/级）
    this.staveSplit = false; // 法球分裂
    this.staveNova = false;  // 元素新星（命中爆炸）
    this.stavePierce = 0;    // 奥术穿透（能量球穿透 +1/级）
    this.staveDrain = 0;     // 灵魂汲取（命中回血/级）
    this.weaponCatOverride = undefined; // 局内武器转换（undefined=用局外配置）
    this.weaponSkinOverride = undefined; // 局内武器装备（undefined=用局外免费武器）
    this.swords = [];
    this.inv = 0;
    this.pickedUpgrades = [];
    this.fireT = 0;
    this.lastX = this.x;
    this.lastY = this.y;
    this.knockX = 0;
    this.knockY = 0;
  }
  canBeHit() { return this.inv <= 0; }
  hurt(dmg, game, kx, ky) {
    if (!this.canBeHit()) return;
    // 闪避：概率完全躲开（闪避天赋）
    if (this.dodge > 0 && Math.random() < this.dodge) {
      for (let i = 0; i < 6; i++) game.particles.get(this.x, this.y, Util.rand(-30, 30), Util.rand(-40, 20), 0.4, "#8affc1", Util.rand(2, 4));
      return;
    }
    // 护盾抵挡
    if (this.shield > 0) {
      this.shield -= 1;
      for (let i = 0; i < 10; i++) game.particles.get(this.x, this.y, Util.rand(-70, 70), Util.rand(-90, 20), 0.5, "#9fe8ff", Util.rand(3, 6));
      return;
    }
    this.hp -= dmg;
    // 荆棘反伤（受击反弹伤害给所有近身敌人）
    if (this.thorns > 0) {
      for (const e of game.enemies.active()) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - this.x, e.y - this.y);
        if (d < 90) {
          e.takeDamage(this.thorns * 6, false, game, false, false);
          game.particles.get(e.x, e.y - e.r, 0, -40, 0.4, "#8aff5c", 4);
        }
      }
    }
    game.totalTank = (game.totalTank || 0) + Math.max(0, Math.round(dmg || 0));
    this.inv = CONFIG.INVINCIBLE_TIME;
    this.knockX += kx;
    this.knockY += ky;
    for (let i = 0; i < 12; i++) game.particles.get(this.x, this.y, Util.rand(-90, 90), Util.rand(-120, 30), 0.55, "#ff7043", Util.rand(3, 7));
    if (this.hp <= 0) game.gameOver();
  }
  update(dt, game) {
    let targetX = this.x;
    let targetY = this.y;
    if (game.input.touching || game.input.hover) {
      targetX = game.input.touching ? game.input.touchX : game.input.hoverX;
      targetY = game.input.touching ? game.input.touchY : game.input.hoverY;
    } else {
      targetX += (game.input.right - game.input.left) * this.moveSpeed * dt;
      targetY += (game.input.down - game.input.up) * this.moveSpeed * 0.75 * dt;
    }
    this.frostZoneT = Math.max(0, (this.frostZoneT || 0) - dt);
    // 属性弹 DOT/减速结算（火=灼烧 4/秒，毒=中毒 3/秒，冰=减速 45%）
    if (this.fireDotT > 0) {
      this.fireDotT -= dt;
      this.hp -= 4 * dt;
      if (Math.random() < 0.5) game.particles.get(this.x, this.y - 20, Util.rand(-15, 15), Util.rand(-25, 5), 0.4, "#ff7b3d", Util.rand(2, 4));
    }
    if (this.poisonDotT > 0) {
      this.poisonDotT -= dt;
      this.hp -= 3 * dt;
      if (Math.random() < 0.4) game.particles.get(this.x, this.y - 16, Util.rand(-12, 12), Util.rand(-20, 5), 0.4, "#8aff5c", Util.rand(2, 4));
    }
    this.iceSlowT = Math.max(0, (this.iceSlowT || 0) - dt);
    if (this.hp <= 0) game.gameOver();
    const zoneSlow = this.frostZoneT > 0 ? 0.4 : 1;
    const slowMul = this.iceSlowT > 0 ? 0.55 : 1;
    // 移动：触摸/鼠标跟随受移速限制（防瞬移——甩鼠标不能瞬移，移速卡有意义）
    // 之前 Math.min(1, dt*14) 指数插值：鼠标甩对角玩家飞过去（瞬移感）+ 移速卡失效
    if (game.input.touching || game.input.hover) {
      const dx = targetX - this.x, dy = targetY - this.y;
      const dist = Math.hypot(dx, dy);
      const step = this.moveSpeed * zoneSlow * slowMul * dt; // 冰弹减速生效
      if (dist > step) {
        this.x += dx / dist * step;
        this.y += dy / dist * step;
      } else {
        this.x = targetX;
        this.y = targetY;
      }
    } else {
      this.x += (targetX - this.x) * zoneSlow;
      this.y += (targetY - this.y) * zoneSlow;
    }
    // 记录速度（供敌人预判弹道）
    this.vx = (this.x - (this.lastX || this.x)) / Math.max(0.001, dt);
    this.vy = (this.y - (this.lastY || this.y)) / Math.max(0.001, dt);
    this.lastX = this.x;
    this.lastY = this.y;
    this.x += this.knockX * dt;
    this.y += this.knockY * dt;
    this.knockX *= Math.pow(0.05, dt);
    this.knockY *= Math.pow(0.05, dt);
    this.x = Util.clamp(this.x, 40, CONFIG.W - 40);
    this.y = Util.clamp(this.y, 120, CONFIG.H - 60);
    // 移动拖尾：横移时留下紫色尾迹
    const moveSpeed = Math.abs(this.x - (this.lastX || this.x)) / Math.max(0.001, dt);
    if (moveSpeed > 120 && Math.random() < 0.5) {
      game.particles.get(this.x, this.y + 8, Util.rand(-12, 12), Util.rand(-30, 30), 0.35, "rgba(168,101,255,0.5)", Util.rand(2, 4));
    }
    this.lastX = this.x;
    if (this.inv > 0) this.inv -= dt;
    if (this.regen > 0) this.hp = Math.min(this.maxHp, this.hp + this.regen * dt);
    this.fireT -= dt;
    if (this.fireT <= 0) {
      this.fireT += 1 / this.fireRate;
      game.fireArrows();
    }
    for (const sword of this.swords) sword.update(dt, game);
    // 环绕火球：绕玩家旋转，触碰敌人灼烧
    if (this.orb > 0) {
      this.orbAngle = (this.orbAngle || 0) + dt * 4;
      for (let k = 0; k < this.orb; k++) {
        const ang = this.orbAngle + k * TAU / Math.max(1, this.orb);
        const ox = this.x + Math.cos(ang) * 52;
        const oy = this.y + Math.sin(ang) * 52 * 0.5;
        for (const e of game.enemies.active()) {
          if (e.dead) continue;
          if (Math.hypot(e.x - ox, e.y - oy) < e.r + 12) {
            e.takeDamage(4 * dt * 60 * 0.1, false, game, true, false);
          }
        }
      }
    }
  }
  render(g) {
    const flash = this.inv > 0 && Math.floor(this.inv * 16) % 2 === 0;
    drawShadow(g, this.x, this.y + 18, 28, 10, 0.4);
    if (flash) return;
    g.save();
    // 强度光环：箭数越多光环越大（成长可视化）
    const haloR = 26 + this.arrowCount * 3 + this.swords.length * 4;
    const haloA = 0.25 + Math.sin(performance.now() * 0.004) * 0.08;
    g.strokeStyle = `rgba(168,101,255,${haloA})`;
    g.lineWidth = 2.5;
    g.beginPath();
    g.arc(this.x, this.y, haloR, 0, TAU);
    g.stroke();
    // ── 人形主角 ──
    const t = performance.now() * 0.006;
    const moving = Math.abs(this.x - (this.lastX || this.x)) > 1 || Math.abs(this.lastY || 0) > 0;
    const legSwing = moving ? Math.sin(t * 10) * 4 : Math.sin(t * 3) * 1.5; // 走路/待机呼吸摆动
    const lean = Util.clamp((this.x - (this.lastX || this.x)) * 0.15, -6, 6); // 移动倾斜
    const skin = getWeaponSkin();
    const stave = getWeaponStave();
    // 武器配色：皮肤色 + 元素色叠加
    const bowColor = this.fire ? "#ff7b3d" : this.ice ? "#7ad0ff" : this.volt > 0 ? "#f7c948" : (isStaveMode() ? stave.color : skin.color);
    const weaponColor = isStaveMode() ? stave.color : bowColor;
    g.translate(this.x + lean, this.y);
    // 披风（紫色，飘动）
    g.fillStyle = "rgba(124,58,180,0.85)";
    g.beginPath();
    g.moveTo(-6, -14);
    g.quadraticCurveTo(-14 - Math.sin(t * 5) * 3, 2, -9 + Math.sin(t * 5) * 2, 16);
    g.lineTo(-2, 12);
    g.quadraticCurveTo(-1, 0, -2, -14);
    g.closePath();
    g.fill();
    // 身体（深紫铠甲）
    g.fillStyle = "#3d2b5e";
    g.beginPath();
    g.moveTo(-9, -6);
    g.quadraticCurveTo(0, -16, 9, -6);
    g.lineTo(11, 10);
    g.quadraticCurveTo(0, 14, -11, 10);
    g.closePath();
    g.fill();
    g.fillStyle = "#6b4aa8";
    g.fillRect(-7, -8, 14, 3);
    // 双腿（摆动）
    g.strokeStyle = "#2a1c42";
    g.lineWidth = 4;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(-4, 11);
    g.lineTo(-4 + legSwing * 0.7, 18);
    g.moveTo(4, 11);
    g.lineTo(4 - legSwing * 0.7, 18);
    g.stroke();
    // 头（皮肤色 + 头发）
    g.fillStyle = "#e8b98a";
    g.beginPath();
    g.arc(0, -17, 8, 0, TAU);
    g.fill();
    g.fillStyle = "#4a2a5a";
    g.beginPath();
    g.arc(0, -19, 8, Math.PI, 0);
    g.fill();
    if (isStaveMode()) {
      // 法杖（木/火/冰/雷：长杖 + 顶部宝石 + 元素光晕）
      g.strokeStyle = weaponColor;
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(22, 10);
      g.lineTo(28, -24);
      g.stroke();
      g.shadowBlur = 14;
      g.shadowColor = weaponColor;
      g.fillStyle = this.fire ? "#ff7b3d" : this.ice ? "#7ad0ff" : this.volt > 0 ? "#f7c948" : "#c77dff";
      g.beginPath();
      g.arc(28, -28, 5, 0, TAU);
      g.fill();
      g.fillStyle = "rgba(255,255,255,0.7)";
      g.beginPath();
      g.arc(27, -29, 1.8, 0, TAU);
      g.fill();
      g.shadowBlur = 0;
      // 法杖元素特效：火=火星 / 冰=冰晶 / 雷=电弧
      if (this.fire || (isStaveMode() && stave.bonus.elem === "fire")) {
        g.fillStyle = "rgba(255,140,60,0.9)";
        g.beginPath();
        g.arc(28 + Math.sin(t * 9) * 3, -30 + Math.cos(t * 7) * 3, 2, 0, TAU);
        g.fill();
      } else if (this.ice || (isStaveMode() && stave.bonus.elem === "ice")) {
        g.fillStyle = "rgba(150,220,255,0.9)";
        g.beginPath();
        g.arc(28 + Math.sin(t * 8) * 3, -29 + Math.cos(t * 6) * 3, 1.8, 0, TAU);
        g.fill();
      } else if (this.volt > 0 || (isStaveMode() && stave.bonus.elem === "volt")) {
        g.strokeStyle = "rgba(247,201,72,0.8)";
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(28, -34 + Math.sin(t * 12) * 4);
        g.lineTo(33, -30 + Math.cos(t * 10) * 4);
        g.stroke();
      }
    } else {
      // 弓（皮肤样式：木弓弯弓 / 火焰弓红 + 火星 / 冰霜弓蓝 + 冰晶 / 雷神弓金 + 电弧）
      g.strokeStyle = bowColor;
      g.lineWidth = 3.5;
      g.shadowBlur = 12;
      g.shadowColor = bowColor;
      g.beginPath();
      g.arc(16, -4, 13, -Math.PI / 2.4, Math.PI / 2.4);
      g.stroke();
      g.shadowBlur = 0;
      // 弓弦
      g.strokeStyle = "rgba(255,255,255,0.5)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(16 + Math.cos(-Math.PI / 2.4) * 13, -4 + Math.sin(-Math.PI / 2.4) * 13);
      g.lineTo(16 + Math.cos(Math.PI / 2.4) * 13, -4 + Math.sin(Math.PI / 2.4) * 13);
      g.stroke();
      // 皮肤特效：火焰弓火星 / 冰霜弓冰晶 / 雷神弓电弧
      if (this.fire || skin.id === 1) {
        g.fillStyle = "rgba(255,140,60,0.9)";
        g.beginPath();
        g.arc(20 + Math.sin(t * 9) * 3, -10 + Math.cos(t * 7) * 3, 2, 0, TAU);
        g.fill();
      } else if (this.ice || skin.id === 2) {
        g.fillStyle = "rgba(150,220,255,0.9)";
        g.beginPath();
        g.arc(20 + Math.sin(t * 8) * 3, -9 + Math.cos(t * 6) * 3, 1.8, 0, TAU);
        g.fill();
      } else if (skin.id === 3) {
        g.strokeStyle = "rgba(247,201,72,0.8)";
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(26, -10 + Math.sin(t * 12) * 4);
        g.lineTo(31, -6 + Math.cos(t * 10) * 4);
        g.stroke();
      }
    }
    g.restore();
    for (const sword of this.swords) sword.render(g);
    // 环绕火球渲染
    if (this.orb > 0) {
      for (let k = 0; k < this.orb; k++) {
        const ang = (this.orbAngle || 0) + k * TAU / Math.max(1, this.orb);
        const ox = this.x + Math.cos(ang) * 52;
        const oy = this.y + Math.sin(ang) * 52 * 0.5;
        g.save();
        g.shadowBlur = 14;
        g.shadowColor = "#ff7b3d";
        const og = g.createRadialGradient(ox - 2, oy - 2, 1, ox, oy, 10);
        og.addColorStop(0, "#ffe3c2");
        og.addColorStop(0.5, "#ff7b3d");
        og.addColorStop(1, "#e54d3c");
        g.fillStyle = og;
        g.beginPath();
        g.arc(ox, oy, 10, 0, TAU);
        g.fill();
        g.restore();
      }
    }
  }
}

// 三选一：按稀有度权重抽取 3 个不重复升级，且保证流派多样性
// 武器分流：卡片带 weapon 字段（bow=弓专属 / stave=法杖专属 / 无=通用）
// 法杖模式只出 stave+通用卡；弓模式只出 bow+通用卡 —— 两职业卡池截然不同
function rollChoices() {
  const curWeapon = isStaveMode() ? "stave" : "bow";
  const avail = UPGRADES.filter(u => !u.has(game) && (!u.weapon || u.weapon === curWeapon));
  const picks = [];
  const usedIds = new Set();
  const usedFactions = new Set();
  const attempt = (avoidFaction) => {
    const pool = avail.filter(u => !usedIds.has(u.id) && (!avoidFaction || u.faction !== avoidFaction));
    if (pool.length === 0) return null;
    // 流派热度惩罚：该流派已选次数越多，权重越低（鼓励均衡发展）
    let total = 0;
    const weights = [];
    // 幸运天赋：稀有度权重提升
    const luck = game.player.heroLuck || 0;
    for (const u of pool) {
      const picked = game.factionCount[u.faction] || 0;
      let w = RARITY[u.rarity].weight / (1 + picked * 0.6);
      if (u.rarity === "epic") w *= 1 + luck * 2;
      if (u.rarity === "legendary") w *= 1 + luck * 3;
      weights.push(w);
      total += w;
    }
    let roll = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      roll -= weights[i];
      if (roll <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  };
  // 前两张：允许同流派；第三张：强制不同流派（保证构筑多样）
  const a = attempt(null);
  if (a) { picks.push(a); usedIds.add(a.id); usedFactions.add(a.faction); }
  const b = attempt(null);
  if (b) { picks.push(b); usedIds.add(b.id); usedFactions.add(b.faction); }
  const avoid = picks.length === 2 && picks[0].faction === picks[1].faction ? picks[0].faction : null;
  const c = attempt(avoid);
  if (c) picks.push(c);
  // 兜底：绝不出现"已满/无效"的废卡（优先选 avail 中未用过的卡）
  while (picks.length < 3) {
    const fallback = avail.find(u => !usedIds.has(u.id)) || UPGRADES.find(u => !u.has(game)) || UPGRADES[0];
    picks.push(fallback);
    usedIds.add(fallback.id);
  }
  return picks;
}

// 升级所需经验曲线
// 升级经验曲线：前期快后期慢（天赋点获取随等级递减，局外成长线拉长）
// Lv.N 升 N+1 需 80 + N×45 + max(0, N-5)×40 —— 5 级后明显变慢，防止过早点满 20 级天赋
function heroExpNeed(level) {
  return Math.round(80 + level * 45 + Math.max(0, level - 5) * 40);
}
// 结算经验：击杀+关卡推进
function gainHeroExp(game, kills, chapter, roomIndex) {
  const base = kills * 4 + (chapter - 1) * 60 + roomIndex * 10;
  SaveSystem.data.heroExp += base;
  let leveled = 0;
  while (SaveSystem.data.heroExp >= heroExpNeed(SaveSystem.data.heroLevel)) {
    SaveSystem.data.heroExp -= heroExpNeed(SaveSystem.data.heroLevel);
    SaveSystem.data.heroLevel++;
    SaveSystem.data.heroPoints++;
    leveled++;
  }
  SaveSystem.save();
  return leveled;
}

function codexUnlock(cat, id) {
  if (!id) return;
  const arr = SaveSystem.data.codex[cat];
  if (!Array.isArray(arr)) return;
