<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>箭雨 v2.0</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101812;
      color: #f4ead6;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      touch-action: none;
      user-select: none;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: min(100vw, 56.25vh);
      height: min(177.777vw, 100vh);
      background: #101812;
    }
    #landscapeBlocker {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      background: #101812;
      color: #f4ead6;
      text-align: center;
      font-size: 22px;
      line-height: 1.6;
      letter-spacing: 1px;
      padding: 28px;
    }
    @media (orientation: landscape) and (hover: none) {
      #landscapeBlocker { display: grid; }
    }
    /* PC 桌面：鼠标悬停时显示手型 */
    @media (hover: hover) and (pointer: fine) {
      canvas { cursor: crosshair; }
    }
  </style>
</head>
<body>
  <canvas id="game" width="540" height="960" aria-label="箭雨 v2.0 游戏画布"></canvas>
  <div id="landscapeBlocker">请旋转设备为竖屏<br>箭雨 v2.0 仅支持竖屏飞行</div>
<script>
"use strict";

const CONFIG = {
  W: 540,
  H: 960,
  FIXED_DT: 1 / 60,
  PLAYER_Y: 960 * 0.82,
  PLAYER_R: 18,
  BASE_FLY_SPEED: 140,
  BASE_MOVE_SPEED: 320,
  BASE_FIRE_RATE: 2,
  BASE_ARROW_SPEED: 720,
  BASE_ARROW_DAMAGE: 10,
  BASE_RANGE: 900,
  WAVE_LEN: 300,
  GATE_EVERY: 240,
  ROAD_TOP_W: 205,
  ROAD_BOTTOM_W: 430,
  MAX_HP: 200,
  ENEMY_SCORE: 10,
  BOSS_SCORE: 160,
  INVINCIBLE_TIME: 0.8,
  COLORS: {
    bg: "#101812",
    grassFar: "#294126",
    grassNear: "#4d7b37",
    roadFar: "#504a42",
    roadNear: "#8b765c",
    roadEdge: "#b9aa89",
    purple: "#a865ff",
    purpleHot: "#eadcff",
    orange: "#ff9b35",
    red: "#e54d3c",
    blue: "#5fc6ff",
    gold: "#f7c948",
    wood: "#8b5a2b",
    ui: "#f5ecd9"
  }
};

const TAU = Math.PI * 2;

// ── 主题场景系统：按 Boss 波次切换，闯关感 ──
// 每 5 波一个场景（与 Boss 同步）：森林 → 沙漠 → 雪原 → 岩浆 → 暗域 → 循环
const THEMES = [
  {
    name: "翠影森林",
    grassFar: "#294126", grassNear: "#4d7b37",
    roadFar: "#504a42", roadNear: "#8b765c", roadEdge: "#b9aa89",
    bg: "#101812", leaf: "rgba(205,151,61,0.38)",
    decor: ["tree", "tree", "rock", "fence"],
    light: ["#ffe9c9", "#c9b8ff"],
    particle: ["#d99a48", "#f7c948"]
  },
  {
    name: "黄沙戈壁",
    grassFar: "#8a7a3a", grassNear: "#c9b45e",
    roadFar: "#6b5a35", roadNear: "#a8905c", roadEdge: "#d8c68e",
    bg: "#1a170e", leaf: "rgba(214,180,94,0.4)",
    decor: ["rock", "rock", "cactus", "fence"],
    light: ["#ffe9b0", "#ffd56a"],
    particle: ["#e0b86a", "#c9a04a"]
  },
  {
    name: "霜寒雪原",
    grassFar: "#3a4a5c", grassNear: "#7a93ab",
    roadFar: "#5a6a7a", roadNear: "#9ab0c4", roadEdge: "#d5e5f5",
    bg: "#0e141c", leaf: "rgba(220,235,255,0.5)",
    decor: ["pine", "pine", "rock", "snowrock"],
    light: ["#e8f4ff", "#b8d8ff"],
    particle: ["#cfe4ff", "#9fc8ff"]
  },
  {
    name: "熔岩深渊",
    grassFar: "#3a1a14", grassNear: "#6b2a1a",
    roadFar: "#4a2418", roadNear: "#8a4a30", roadEdge: "#d88a50",
    bg: "#180a08", leaf: "rgba(255,140,60,0.4)",
    decor: ["magrock", "magrock", "fence", "cactus"],
    light: ["#ffb060", "#ff7b3d"],
    particle: ["#ff8a4a", "#e54d3c"]
  },
  {
    name: "幽暗秘境",
    grassFar: "#1a1626", grassNear: "#3a3350",
    roadFar: "#2a2638", roadNear: "#5a5470", roadEdge: "#9088b0",
    bg: "#0a0812", leaf: "rgba(190,140,255,0.4)",
    decor: ["shadetree", "shadetree", "rock", "crystal"],
    light: ["#c9a8ff", "#8a6aff"],
    particle: ["#c9a8ff", "#a865ff"]
  }
];
let themeIndex = 0;
let themeTrans = 0; // 0=无过渡, 1=切换中
function getTheme() { return THEMES[themeIndex]; }
const ROOM_SEQUENCE = ["battle", "battle", "shop", "battle", "elite", "boss"];
const ROOM_LABEL = {
  battle: "战斗房",
  shop: "神秘商人",
  elite: "精英房",
  boss: "BOSS房"
};
const BOSS_DATA = [
  { kind: "treant", name: "树精王", title: "BOSS · 树精王", body: "#365a2c", arm: "#4e7a35", eye: "#c9ff72", crown: "#89c85f" },
  { kind: "scorpion", name: "沙蝎王", title: "BOSS · 沙蝎王", body: "#8a5a24", arm: "#c27a2c", eye: "#ffe08a", crown: "#d9a441" },
  { kind: "frost", name: "冰霜巨人", title: "BOSS · 冰霜巨人", body: "#d8f4ff", arm: "#7fcfff", eye: "#2458ff", crown: "#f5fbff" },
  { kind: "demon", name: "炎魔领主", title: "BOSS · 炎魔领主", body: "#6e1d18", arm: "#d94b2d", eye: "#ffd35a", crown: "#ff8a3d" },
  { kind: "shadow", name: "暗影魔王", title: "BOSS · 暗影魔王", body: "#241736", arm: "#5d3a82", eye: "#6ff0ff", crown: "#a865ff" }
];
function themeForChapter(chapter) { return (Math.max(1, chapter) - 1) % THEMES.length; }
function bossForChapter(chapter) { return BOSS_DATA[themeForChapter(chapter)]; }
function rebuildThemeDecor(game) {
  game.decor.length = 0;
  for (let i = 0; i < 38; i++) game.decor.push(game.makeDecor(Util.rand(0, CONFIG.H), Util.pick(getTheme().decor)));
}
// 场景切换：只绑定章节，进新章时调用
function checkThemeSwitch(game) {
  const want = themeForChapter(game.chapter || 1);
  if (want !== themeIndex) {
    themeIndex = want;
    themeTrans = 1;
    game.flashMessage(`第 ${game.chapter} 章 · ${THEMES[want].name}`);
    audio.upgrade();
    rebuildThemeDecor(game);
  }
}
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const Util = {
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  rand(a, b) { return a + Math.random() * (b - a); },
  randi(a, b) { return Math.floor(Util.rand(a, b + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  dist2(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return dx * dx + dy * dy;
  },
  circleHit(a, b) {
    const r = a.r + b.r;
    return Util.dist2(a, b) <= r * r;
  },
  worldScale(y) {
    return Util.clamp(0.42 + y / CONFIG.H * 0.92, 0.42, 1.34);
  },
  roadWidth(y) {
    const t = Util.clamp(y / CONFIG.H, 0, 1);
    return CONFIG.ROAD_TOP_W + (CONFIG.ROAD_BOTTOM_W - CONFIG.ROAD_TOP_W) * t;
  },
  onRoadX(x, y, margin = 0) {
    return Math.abs(x - CONFIG.W / 2) <= Util.roadWidth(y) / 2 - margin;
  }
};

class AudioSystem {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = localStorage.getItem("arrowStormMuted") === "1";
  }
  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.16;
    this.master.connect(this.ctx.destination);
  }
  toggle() {
    this.ensure();
    this.muted = !this.muted;
    localStorage.setItem("arrowStormMuted", this.muted ? "1" : "0");
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.16, this.ctx.currentTime, 0.02);
  }
  tone(freq, dur, type = "sine", gain = 0.5, slide = 1) {
    this.ensure();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  shoot() { this.tone(520, 0.06, "triangle", 0.18, 1.8); }
  hit() { this.tone(180, 0.08, "square", 0.12, 0.65); }
  upgrade() { this.tone(660, 0.12, "sine", 0.22, 1.7); setTimeout(() => this.tone(920, 0.1, "sine", 0.18, 1.35), 55); }
  chest() { this.tone(480, 0.12, "triangle", 0.25, 1.5); setTimeout(() => this.tone(880, 0.16, "triangle", 0.22, 1.7), 90); }
  boss() { this.tone(110, 0.45, "sawtooth", 0.3, 0.55); }
  death() { this.tone(220, 0.5, "sawtooth", 0.25, 0.25); }
  sword() { this.tone(760, 0.08, "triangle", 0.12, 1.25); }
  coin() { this.tone(1320, 0.05, "sine", 0.07, 1.9); }
}

const audio = new AudioSystem();

class Pool {
  constructor(Type) {
    this.Type = Type;
    this.items = [];
  }
  get(...args) {
    let item = this.items.find(e => !e.active);
    if (!item) {
      item = new this.Type();
      this.items.push(item);
    }
    item.init(...args);
    return item;
  }
  active() {
    return this.items.filter(e => e.active);
  }
}

class Particle {
  constructor() { this.active = false; }
  init(x, y, vx, vy, life, color, size, text, crit) {
    this.active = true;
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
    this.text = text || "";
    this.crit = !!crit;
  }
  update(dt) {
    this.life -= dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += (this.text ? 20 : 95) * dt;
    if (this.life <= 0) this.active = false;
  }
  render(g) {
    const a = Util.clamp(this.life / this.maxLife, 0, 1);
    g.save();
    g.globalAlpha = a;
    if (this.text) {
      // 伤害数字：弹出缩放 + 上浮
      const popScale = this.crit ? 1.6 : 1.35;
      const sc = popScale - (popScale - 1) * Util.clamp(1 - a, 0, 1);
      g.translate(this.x, this.y);
      g.scale(sc, sc);
      g.font = `${this.crit ? 30 : 21}px Microsoft YaHei, sans-serif`;
      g.textAlign = "center";
      g.lineWidth = this.crit ? 5 : 3;
      g.strokeStyle = "rgba(61,30,7,0.85)";
      g.fillStyle = this.crit ? "#ffd56a" : this.color;
      g.strokeText(this.text, 0, 0);
      g.fillText(this.text, 0, 0);
    } else {
      g.fillStyle = this.color;
      g.beginPath();
      g.arc(this.x, this.y, this.size * (0.5 + a), 0, TAU);
      g.fill();
    }
    g.restore();
  }
}

class Arrow {
  constructor() { this.active = false; }
  init(x, y, angle, damage, range, pierce, critChance, fire, ice) {
    this.active = true;
    this.x = x; this.y = y;
    this.lastX = x; this.lastY = y;
    this.angle = angle;
    this.vx = Math.sin(angle) * CONFIG.BASE_ARROW_SPEED;
    this.vy = -Math.cos(angle) * CONFIG.BASE_ARROW_SPEED;
    this.damage = damage;
    this.range = range;
    this.travel = 0;
    this.r = 7;
    this.pierce = pierce;
    this.critChance = critChance;
    this.fire = fire;
    this.ice = ice;
    this.split = false;
    this.volt = 0;
    this.frostfire = false;
    this.hitIds = new Set();
  }
  update(dt, game) {
    this.lastX = this.x; this.lastY = this.y;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.travel += Math.hypot(this.vx * dt, this.vy * dt);
    // 属性箭拖尾：火=火星，冰=冰晶
    if (this.fire && Math.random() < 0.5) {
      game.particles.get(this.x, this.y, Util.rand(-14, 14), Util.rand(-14, 14), 0.3, Util.pick(["#ff7b3d", "#ffb15b", "#ff4f3d"]), Util.rand(2, 4));
    } else if (this.ice && Math.random() < 0.45) {
      game.particles.get(this.x, this.y, Util.rand(-12, 12), Util.rand(-12, 12), 0.35, Util.pick(["#9fe8ff", "#5fc6ff", "#d6f5ff"]), Util.rand(2, 3.5));
    }
    if (this.y < -80 || this.travel > this.range) this.active = false;
    for (const e of game.enemies.active()) {
      if (!this.active || e.dead || this.hitIds.has(e.id)) continue;
      if (Util.circleHit(this, e)) {
        this.hitIds.add(e.id);
        // 命中顿帧：每次命中微停 30ms，营造打击重量
        game.hitStop = Math.max(game.hitStop || 0, 0.03);
        const crit = Math.random() < this.critChance;
        const dmg = this.damage * (crit ? 2 : 1);
        e.takeDamage(dmg, crit, game, this.fire, this.ice);
        // 吸血：命中回复生命
        if (this.lifesteal > 0) {
          game.player.hp = Math.min(game.player.maxHp, game.player.hp + this.lifesteal);
          if (Math.random() < 0.3) game.particles.get(game.player.x, game.player.y - 20, Util.rand(-10, 10), Util.rand(-40, -10), 0.4, "#ff6b81", Util.rand(2, 4));
        }
        // 乘区联动 1：分裂箭 —— 命中生成 2 支小箭（30% 伤害）
        if (this.split) {
          for (const da of [-0.22, 0.22]) {
            game.arrows.get(this.x, this.y, this.angle + da, this.damage * 0.3, this.range * 0.6, 0, this.critChance, this.fire, this.ice);
          }
        }
        // 乘区联动 2：雷电箭 —— 弹射至最近其他敌人（50% 伤害）
        if (this.volt > 0) {
          let best = null, bestD = 999999;
          for (const e2 of game.enemies.active()) {
            if (e2 === e || e2.dead || this.hitIds.has(e2.id)) continue;
            const d = Util.dist2(e, e2);
            if (d < bestD && d < 300 * 300) { best = e2; bestD = d; }
          }
          if (best) {
            best.takeDamage(this.damage * 0.5, false, game, this.fire, this.ice);
            for (let i = 0; i < 6; i++) game.particles.get(best.x, best.y, Util.rand(-40, 40), Util.rand(-60, 10), 0.3, "#d9f7ff", Util.rand(2, 5));
          }
        }
        // 乘区联动 3：冰火共鸣 —— 冰冻敌人受火伤时爆炸
        if (this.frostfire && this.fire && e.iceT > 0) {
          e.takeDamage(this.damage * 0.8, false, game, false, false);
          for (const e2 of game.enemies.active()) {
            if (e2 === e || e2.dead) continue;
            if (Util.dist2(e, e2) <= 110 * 110) e2.takeDamage(this.damage * 0.4, false, game, false, false);
          }
          for (let i = 0; i < 20; i++) game.particles.get(e.x, e.y, Util.rand(-120, 120), Util.rand(-140, 40), 0.5, Util.pick(["#ff7b3d", "#5fc6ff"]), Util.rand(3, 7));
        }
        this.pierce -= 1;
        if (this.pierce < 0) this.active = false;
      }
    }
  }
  render(g) {
    g.save();
    // 属性箭配色：普通紫 / 火橙红 / 冰蓝
    let body, glow, hot, trail;
    if (this.fire) { body = "#ff7b3d"; glow = "#ff4f3d"; hot = "#ffe3c2"; trail = "rgba(255,121,61,0.75)"; }
    else if (this.ice) { body = "#5fc6ff"; glow = "#3fa9ff"; hot = "#e6f9ff"; trail = "rgba(95,198,255,0.75)"; }
    else { body = CONFIG.COLORS.purple; glow = CONFIG.COLORS.purple; hot = CONFIG.COLORS.purpleHot; trail = "rgba(255,255,255,0.78)"; }
    g.strokeStyle = trail;
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(this.lastX, this.lastY + 10);
    g.lineTo(this.x, this.y + 26);
    g.stroke();
    g.shadowBlur = 18;
    g.shadowColor = glow;
    g.strokeStyle = hot;
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(this.x, this.y + 12);
    g.lineTo(this.x, this.y - 18);
    g.stroke();
    g.fillStyle = body;
    g.beginPath();
    g.moveTo(this.x, this.y - 24);
    g.lineTo(this.x - 7, this.y - 9);
    g.lineTo(this.x + 7, this.y - 9);
    g.closePath();
    g.fill();
    g.restore();
  }
}

class Bullet {
  constructor() { this.active = false; }
  init(x, y, vx, vy, r = 7, damage = 10) {
    this.active = true;
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.r = r; this.damage = damage;
  }
  update(dt, game) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -40 || this.x > CONFIG.W + 40 || this.y < -60 || this.y > CONFIG.H + 80) this.active = false;
    if (this.active && game.player.canBeHit() && Util.circleHit(this, game.player)) {
      this.active = false;
      game.player.hurt(this.damage, game, 0, 36);
    }
  }
  render(g) {
    g.save();
    g.shadowBlur = 13;
    g.shadowColor = "#ff7043";
    g.fillStyle = "#ffb15b";
    g.beginPath();
    g.arc(this.x, this.y, this.r, 0, TAU);
    g.fill();
    g.restore();
  }
}

// 金币实体：掉落物，靠近玩家自动磁吸（弓箭传说式捡钱爽感）
class Coin {
  constructor() { this.active = false; }
  init(x, y, value, vx, vy) {
    this.active = true;
    this.x = x; this.y = y;
    this.value = value;
    this.vx = vx !== undefined ? vx : Util.rand(-40, 40);
    this.vy = vy !== undefined ? vy : Util.rand(-90, -30);
    this.t = Util.rand(0, TAU);
    this.phase = Util.rand(0, TAU);
  }
  update(dt, game) {
    // 掉落抛物线 + 轻微漂浮
    this.vy += 160 * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.t += dt * 4;
    // 磁吸：靠近玩家自动飞过去
    const p = game.player;
    const dx = p.x - this.x, dy = p.y - this.y;
    const d = Math.hypot(dx, dy);
    if (d < 130) {
      const pull = (1 - d / 130) * 520;
      this.x += dx / d * pull * dt;
      this.y += dy / d * pull * dt;
      if (d < 24) {
        this.active = false;
        game.runGold = (game.runGold || 0) + this.value;
        game.particles.get(this.x, this.y, Util.rand(-20, 20), Util.rand(-40, 10), 0.3, "#f7c948", Util.rand(2, 4));
        audio.coin();
      }
    }
    // 掉落物滑出屏幕消失
    if (this.y > CONFIG.H + 60 || this.y < -120) this.active = false;
  }
  render(g) {
    g.save();
    const bob = Math.sin(this.t) * 3;
    g.translate(this.x, this.y + bob);
    g.shadowBlur = 10;
    g.shadowColor = "#f7c948";
    g.fillStyle = "#f7c948";
    g.beginPath();
    g.arc(0, 0, 5.5, 0, TAU);
    g.fill();
    g.fillStyle = "#fff1a8";
    g.beginPath();
    g.arc(0, 0, 3, 0, TAU);
    g.fill();
    g.restore();
  }
}

let enemyId = 1;
class Enemy {
  constructor() { this.active = false; }
  init(type, x, y, wave) {
    this.active = true;
    this.id = enemyId++;
    this.type = type;
    this.x = x; this.y = y;
    this.wave = wave;
    this.dead = false;
    this.t = Math.random() * 10;
    this.shootT = Util.rand(0.4, 1.8);
    this.fireT = 0;
    this.iceT = 0;
    this.drift = Util.rand(-1, 1);
    this.isBoss = type === "boss";
    this.hitFlash = 0;
    // 抗性系统（流派反制）：装甲=物理减伤（克制纯伤害流），灵体=元素免疫（克制元素流）
    // 随波次出现：3波后装甲怪，5波后灵体怪
    this.armored = false;
    this.ethereal = false;
    if (!this.isBoss && wave >= 3 && Math.random() < 0.16) this.armored = true;
    if (!this.isBoss && wave >= 5 && Math.random() < 0.12) this.ethereal = true;
    // 首次遇到抗性怪：教育提示（防玩家困惑）
    if (this.armored && !game._armoredHint) { game._armoredHint = true; setTimeout(() => game.flashMessage("装甲怪：物理减伤 50%，元素箭克制"), 1200); }
    if (this.ethereal && !game._etherealHint) { game._etherealHint = true; setTimeout(() => game.flashMessage("灵体怪：免疫元素，物理箭克制"), 1200); }
    // 精英怪：非 Boss 波 18% 概率，金色边框 + 词缀 + 5倍金币
    this.isElite = !this.isBoss && Math.random() < 0.18 && wave >= 2;
    this.eliteAffix = this.isElite ? Util.pick(["swift", "huge", "armored", "splitter"]) : null;
    // 难度曲线：敌人 HP 随波次持续增长（每波 +8%），章节额外加成
    const chapBonus = 1 + Math.floor((SaveSystem.data.bestWave || 0) / 10) * 0.15;
    const waveBonus = 1 + (wave - 1) * 0.08;
    let hp = { minion: 26, archer: 38, tank: 95, flyer: 30, boss: 700 + wave * 280 }[type] * chapBonus * waveBonus;
    // 精英词缀加成
    if (this.isElite) {
      hp *= this.eliteAffix === "huge" ? 3.2 : this.eliteAffix === "armored" ? 2.4 : 1.7;
      if (this.eliteAffix === "swift") this.drift = Util.rand(1.5, 2.5);
    }
    this.hp = Math.round(hp);
    this.maxHp = this.hp;
    this.r = this.isBoss ? 72 : type === "tank" ? 28 : 21;
    if (this.isElite && this.eliteAffix === "huge") this.r *= 1.5;
    this.baseSpeed = type === "tank" ? 18 : type === "flyer" ? 22 : 0;
    if (this.isElite && this.eliteAffix === "swift") this.baseSpeed = (this.baseSpeed || 26) + 40;
    this.bossRush = 0;
    // Boss 按章节绑定，不再按波次轮换。
    this.bossKind = this.isBoss ? bossForChapter((game && game.chapter) || 1).kind : null;
    if (this.isBoss) {
      const chapterScale = 1 + Math.floor((((game && game.chapter) || 1) - 1) / 5) * 0.18;
      if (this.bossKind === "demon") this.hp = Math.round(this.hp * 1.35);
      if (this.bossKind === "frost") this.hp = Math.round(this.hp * 1.18);
      this.hp = Math.round(this.hp * chapterScale);
      this.maxHp = this.hp;
    }
  }
  takeDamage(amount, crit, game, fire, ice) {
    // 抗性结算：装甲=物理减伤50%（元素伤害全额），灵体=元素免疫（物理全额）
    if (this.armored && !fire && !ice) amount *= 0.5;
    if (this.ethereal && (fire || ice)) amount = 0;
    if (amount <= 0) {
      // 免疫提示
      if (Math.random() < 0.4) game.particles.get(this.x, this.y - this.r - 10, Util.rand(-10, 10), -40, 0.5, this.ethereal ? "#9fe8ff" : "#cfd4dc", 1, "免疫", false);
      return;
    }
    this.hp -= amount;
    this.hitFlash = 0.08; // 受击白闪
    if (fire) this.fireT = 3;
    if (ice) this.iceT = 2.5;
    game.damageNumber(this.x, this.y - this.r - 12, Math.round(amount), crit);
    audio.hit();
    // 属性命中特效：火=橙色爆燃，冰=蓝白冰晶
    if (fire) for (let i = 0; i < 8; i++) game.particles.get(this.x, this.y, Util.rand(-70, 70), Util.rand(-100, 20), Util.rand(0.3, 0.6), Util.pick(["#ff7b3d", "#ff4f3d", "#ffb15b"]), Util.rand(3, 7));
    if (ice) for (let i = 0; i < 8; i++) game.particles.get(this.x, this.y, Util.rand(-70, 70), Util.rand(-100, 20), Util.rand(0.3, 0.6), Util.pick(["#9fe8ff", "#5fc6ff", "#e6f9ff"]), Util.rand(3, 6));
    for (let i = 0; i < 4; i++) game.particles.get(this.x, this.y, Util.rand(-55, 55), Util.rand(-90, -20), 0.35, crit ? "#ffd56a" : "#fb8840", Util.rand(3, 7));
    if (this.hp <= 0) this.kill(game);
  }
  kill(game) {
    if (this.dead) return;
    this.dead = true;
    this.active = false;
    game.kills += 1;
    game.score += this.isBoss ? CONFIG.BOSS_SCORE : CONFIG.ENEMY_SCORE;
    // Boss 击杀：慢镜 + 重震屏
    if (this.isBoss) {
      game.slowMo = 0.6;
      game.shake = Math.max(game.shake || 0, 18);
    } else {
      game.shake = Math.max(game.shake || 0, 3.5);
    }
    // 金币掉落：生成金币实体（磁吸拾取），精英怪 5 倍
    const base = this.isBoss ? 40 : { minion: 2, archer: 3, tank: 5, flyer: 3 }[this.type] || 2;
    const total = Math.round(base * (1 + game.wave * 0.03) * (this.isElite ? 5 : 1));
    // 拆成 1-3 枚金币掉落（更有捡钱感）
    const nCoins = this.isBoss ? 5 : this.isElite ? 3 : Util.randi(1, 2);
    for (let i = 0; i < nCoins; i++) {
      game.coins.get(this.x + Util.rand(-14, 14), this.y + Util.rand(-10, 10), Math.max(1, Math.round(total / nCoins)), Util.rand(-60, 60), Util.rand(-140, -40));
    }
    for (let i = 0; i < (this.isBoss ? 34 : this.isElite ? 22 : 12); i++) {
      game.particles.get(this.x, this.y, Util.rand(-130, 130), Util.rand(-180, 60), Util.rand(0.35, 0.9), this.isBoss || this.isElite ? "#f7c948" : "#d99a48", Util.rand(3, 10));
    }
    if (this.isBoss) {
      game.boss = null;
      game.spawnChest();
    }
    // 分裂词缀：精英死亡分裂成 2 个小兵
    if (this.isElite && this.eliteAffix === "splitter") {
      for (let i = 0; i < 2; i++) {
        game.enemies.get("minion", this.x + (i ? 50 : -50), this.y + 20, game.wave);
      }
    }
  }
  update(dt, game) {
    this.t += dt;
    if (this.hitFlash > 0) this.hitFlash -= dt;
    const scroll = 0;
    this.y += scroll;
    if (this.fireT > 0) {
      this.fireT -= dt;
      this.takeDot(8 * (game.player.elemBoost || 1) * (game.player.burnMult || 1) * dt, game, "#e54d3c");
    }
    if (this.iceT > 0) this.iceT -= dt;
    const slow = this.iceT > 0 ? 0.5 / (game.player.slowMult || 1) : 1;
    // 逼近压力：所有敌人随波次缓慢下压（随飞行滚动），波次越高压得越快
    // 基础下压速度：随波次递增（5波后开始明显，防站桩）
    const press = Math.min(46, Math.max(0, (game.wave - 3) * 5)) * slow;
    // 冲向玩家（minion/精英 swift）：进入 320px 后加速冲脸
    if ((this.type === "minion" || (this.isElite && this.eliteAffix === "swift")) && !this.isBoss) {
      const dx = game.player.x - this.x;
      const dy = game.player.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 340 && this.y < game.player.y + 60) {
        const sp = this.isElite ? 190 : 120;
        this.x += dx / d * sp * slow * dt;
        this.y += dy / d * sp * slow * dt;
      }
    }
    if (this.type === "tank") this.y += (this.baseSpeed + press * 0.5) * slow * dt;
    else if (this.type === "flyer") {
      this.x += Math.sin(this.t * 2.4 + this.drift) * 55 * dt;
      this.y += (Math.cos(this.t * 1.8) * 12 + press * 0.7) * slow * dt;
    } else if (!this.isBoss && this.type !== "minion") {
      // archer 等也缓慢下压逼近
      this.y += press * slow * dt;
    }
    if (this.type === "archer") {
      this.shootT -= dt;
      if (this.shootT <= 0) {
        this.shootT = Util.rand(2.0, 3.0);
        this.shootAtPlayer(game, 150);
      }
    }
    if (this.isBoss) this.updateBoss(dt, game, slow);
    if (this.y > CONFIG.H + this.r + 80) this.active = false;
    if (!this.dead && game.player.canBeHit() && Util.circleHit(this, game.player)) {
      game.player.hurt(15, game, Math.sign(game.player.x - this.x) * 90, 50);
    }
  }
  takeDot(amount, game, color) {
    this.hp -= amount;
    if (Math.random() < 0.06) game.particles.get(this.x, this.y - this.r, Util.rand(-15, 15), -45, 0.35, color, 4);
    if (this.hp <= 0) this.kill(game);
  }
  shootAtPlayer(game, speed) {
    const dx = game.player.x - this.x;
    const dy = game.player.y - this.y;
    const len = Math.max(1, Math.hypot(dx, dy));
    game.bullets.get(this.x, this.y + this.r * 0.4, dx / len * speed, dy / len * speed);
  }
  updateBoss(dt, game, slow) {
    this.x = CONFIG.W / 2 + Math.sin(this.t * 0.7) * 90;
    this.y = Math.min(this.y + 18 * slow * dt, 190);
    this.shootT -= dt;
    if (this.shootT <= 0) {
      if (this.bossKind === "treant") {
        this.shootT = 1.7;
        for (let i = -2; i <= 2; i++) {
          const a = Math.PI / 2 + i * 0.22 + Math.sin(this.t) * 0.08;
          game.bullets.get(this.x, this.y + 35, Math.cos(a) * 175, Math.sin(a) * 175, 8, 10);
        }
        if (Math.random() < 0.38) game.enemies.get("minion", Util.rand(CONFIG.W / 2 - 130, CONFIG.W / 2 + 130), this.y + 85, game.wave);
      } else if (this.bossKind === "scorpion") {
        this.shootT = 0.95;
        const dx = game.player.x - this.x;
        const dy = game.player.y - this.y;
        const base = Math.atan2(dy, dx);
        for (const off of [-0.08, 0.08]) game.bullets.get(this.x, this.y + 45, Math.cos(base + off) * 230, Math.sin(base + off) * 230, 6, 9);
        if (Math.random() < 0.28) game.bullets.get(this.x + Math.sin(this.t) * 70, this.y + 70, 0, 260, 10, 14);
      } else if (this.bossKind === "frost") {
        this.shootT = 1.55;
        for (let i = -3; i <= 3; i++) {
          const a = Math.PI / 2 + i * 0.17 + Math.sin(this.t * 0.8) * 0.08;
          game.bullets.get(this.x, this.y + 35, Math.cos(a) * 145, Math.sin(a) * 145, 9, 9);
        }
      } else if (this.bossKind === "demon") {
        this.shootT = 1.95;
        for (let i = -3; i <= 3; i++) {
          const a = Math.PI / 2 + i * 0.16 + Math.sin(this.t) * 0.1;
          game.bullets.get(this.x, this.y + 35, Math.cos(a) * 190, Math.sin(a) * 190, 10, 13);
        }
        if (Math.random() < 0.5) game.enemies.get("tank", Util.rand(CONFIG.W / 2 - 110, CONFIG.W / 2 + 110), this.y + 85, game.wave);
      } else {
        this.shootT = 1.1;
        for (let k = 0; k < 2; k++) {
          const ox = k ? 60 : -60;
          for (let i = -1; i <= 1; i++) {
            const a = Math.PI / 2 + i * 0.24 + Math.sin(this.t * 1.3 + k) * 0.15;
            game.bullets.get(this.x + ox, this.y + 35, Math.cos(a) * 200, Math.sin(a) * 200, 6, 8);
          }
        }
        if (Math.random() < 0.36) this.x = Util.rand(130, CONFIG.W - 130);
      }
      if (Math.random() < 0.18) this.bossRush = 0.45;
    }
    if (this.bossRush > 0) {
      this.bossRush -= dt;
      this.y += 160 * dt;
      if (this.y > 320) this.y = 185;
    }
  }
  render(g) {
    const s = Util.worldScale(this.y);
    drawShadow(g, this.x, this.y + this.r * 0.55, this.r * 1.25 * s, this.r * 0.42 * s, this.isBoss ? 0.42 : 0.28);
    if (this.type !== "flyer") drawStonePlatform(g, this.x, this.y + this.r * 0.72, this.r * 1.35 * s);
    g.save();
    g.translate(this.x, this.y);
    g.scale(s, s);
    if (this.iceT > 0) {
      g.shadowBlur = 20;
      g.shadowColor = CONFIG.COLORS.blue;
    } else if (this.fireT > 0) {
      g.shadowBlur = 18;
      g.shadowColor = CONFIG.COLORS.red;
    }
    if (this.isBoss) drawBoss(g, this);
    else if (this.type === "tank") drawTank(g);
    else if (this.type === "archer") drawArcher(g);
    else if (this.type === "flyer") drawFlyer(g, this.t);
    else drawMinion(g);
    // 抗性标识：装甲=银框+盾标，灵体=蓝框+灵标
    if (this.armored) {
      g.strokeStyle = "#c9d4e0";
      g.lineWidth = 3;
      g.setLineDash([7, 5]);
      g.beginPath();
      g.arc(0, 0, this.r * 1.1, 0, TAU);
      g.stroke();
      g.setLineDash([]);
      g.fillStyle = "#c9d4e0";
      g.font = "bold 14px Microsoft YaHei, sans-serif";
      g.textAlign = "center";
      g.fillText("甲", 0, -this.r * 1.1 - 6);
    } else if (this.ethereal) {
      g.globalAlpha = 0.35;
      g.fillStyle = "#9fe8ff";
      g.beginPath();
      g.arc(0, 0, this.r * 0.9, 0, TAU);
      g.fill();
      g.globalAlpha = 1;
      g.strokeStyle = "#9fe8ff";
      g.lineWidth = 3;
      g.beginPath();
      g.arc(0, 0, this.r * 1.1, 0, TAU);
      g.stroke();
      g.fillStyle = "#9fe8ff";
      g.font = "bold 14px Microsoft YaHei, sans-serif";
      g.textAlign = "center";
      g.fillText("灵", 0, -this.r * 1.1 - 6);
    }
    // 精英怪：金色描边 + 词缀标记
    if (this.isElite) {
      g.strokeStyle = "#f7c948";
      g.lineWidth = 3.5;
      g.shadowBlur = 14;
      g.shadowColor = "#f7c948";
      g.beginPath();
      g.arc(0, 0, this.r * 1.15, 0, TAU);
      g.stroke();
      g.shadowBlur = 0;
      const affixLabel = { swift: "速", huge: "巨", armored: "甲", splitter: "裂" }[this.eliteAffix] || "精";
      g.fillStyle = "#f7c948";
      g.font = "bold 15px Microsoft YaHei, sans-serif";
      g.textAlign = "center";
      g.fillText(affixLabel, 0, -this.r * 1.15 - 6);
    }
    // 受击白闪叠加
    if (this.hitFlash > 0) {
      g.globalAlpha = Util.clamp(this.hitFlash / 0.08, 0, 1) * 0.85;
      g.fillStyle = "#ffffff";
      g.beginPath();
      g.arc(0, 0, this.r * 1.1, 0, TAU);
      g.fill();
      g.globalAlpha = 1;
    }
    g.restore();
    if (!this.isBoss) {
      drawSmallHp(g, this.x, this.y - this.r * s - 16, 48, this.hp / this.maxHp);
    }
    // 状态可视化：燃烧火苗 / 冰冻寒气（从敌人身上冒出的粒子）
    if (this.fireT > 0 && Math.random() < 0.5) {
      game.particles.get(this.x + Util.rand(-14, 14), this.y - this.r * s, Util.rand(-8, 8), -60, 0.4, Util.pick(["#ff7b3d", "#ffb15b"]), Util.rand(2.5, 5));
    }
    if (this.iceT > 0 && Math.random() < 0.5) {
      game.particles.get(this.x + Util.rand(-14, 14), this.y - this.r * s, Util.rand(-6, 6), -30, 0.45, Util.pick(["#9fe8ff", "#d6f5ff"]), Util.rand(2, 4));
    }
  }
}

class Sword {
  constructor(index, game) {
    this.index = index;
    this.angle = index * TAU / 3;
    this.cooldown = Util.rand(0, 0.4);
    this.target = null;
    this.slashT = 0;
    this.x = game.player.x;
    this.y = game.player.y;
  }
  update(dt, game) {
    const n = Math.max(1, game.player.swords.length);
    // 御剑：平时环绕玩家，锁定目标后飞出斩击，命中才结算伤害
    if (this.target) {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const d = Math.hypot(dx, dy);
      if (!this.target.active || this.target.dead) {
        this.target = null;
        return;
      }
      if (d < 16) {
        // 飞到目标：命中结算
        const dmg = 15 * (game.player.summonBoost || 1);
        this.target.takeDamage(game.player.spirit ? dmg * 2 : dmg, false, game, false, false);
        this.target = null;
        this.slashT = 0.12;
        audio.sword();
        for (let i = 0; i < 10; i++) game.particles.get(this.x, this.y, Util.rand(-50, 50), Util.rand(-70, 20), 0.4, "#d9f7ff", Util.rand(2, 5));
        return;
      }
      const sp = 640;
      this.x += dx / d * sp * dt;
      this.y += dy / d * sp * dt;
      this.angle += 12 * dt; // 飞行旋转
      if (Math.random() < 0.6) game.particles.get(this.x, this.y, Util.rand(-10, 10), Util.rand(-10, 10), 0.22, "#d9f7ff", Util.rand(2, 4));
      return;
    }
    this.angle += 3.2 * dt;
    const orbit = 42;
    this.x = game.player.x + Math.cos(this.angle + this.index * TAU / n) * orbit;
    this.y = game.player.y + Math.sin(this.angle + this.index * TAU / n) * orbit * 0.45;
    this.cooldown -= dt;
    if (this.cooldown <= 0) {
      // 索敌：以玩家为中心的全屏索敌（御剑应该主动找怪打）
      const px = game.player.x, py = game.player.y;
      const detect = 560 * (game.player.spirit ? 1.5 : 1);
      let best = null;
      let bestD = 999999;
      for (const e of game.enemies.active()) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - px, e.y - py);
        // 优先索敌玩家上方的敌人（屏幕内）
        if (d < bestD && d < detect && e.y > py - 560) { best = e; bestD = d; }
      }
      if (best) {
        this.target = best;
        this.cooldown = 0.9;
      } else {
        this.cooldown = 0.35;
      }
    }
    if (this.slashT > 0) this.slashT -= dt;
  }
  render(g) {
    g.save();
    g.shadowBlur = 15;
    g.shadowColor = "#d9f7ff";
    g.translate(this.x, this.y);
    g.rotate(this.angle + Math.PI / 2);
    g.fillStyle = "#d9f7ff";
    g.fillRect(-3, -17, 6, 28);
    g.fillStyle = "#88d8ff";
    g.beginPath();
    g.moveTo(0, -25);
    g.lineTo(-7, -13);
    g.lineTo(7, -13);
    g.closePath();
    g.fill();
    g.fillStyle = "#ffe08a";
    g.fillRect(-8, 8, 16, 4);
    g.restore();
    if (this.slashT > 0 && this.target) {
      g.save();
      g.globalAlpha = this.slashT / 0.12;
      g.strokeStyle = "#d9f7ff";
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(this.x, this.y);
      g.lineTo(this.target.x, this.target.y);
      g.stroke();
      g.restore();
    }
  }
}

class Player {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = CONFIG.W / 2;
    this.y = CONFIG.PLAYER_Y;
    this.r = CONFIG.PLAYER_R;
    this.hp = 100;
    this.maxHp = 100;
    this.moveSpeed = CONFIG.BASE_MOVE_SPEED;
    this.damage = CONFIG.BASE_ARROW_DAMAGE;
    this.fireRate = CONFIG.BASE_FIRE_RATE;
    this.range = CONFIG.BASE_RANGE;
    this.arrowCount = 1;
    this.pierce = 0;
    this.crit = 0;
    this.fire = false;
    this.ice = false;
    this.split = false;
    this.volt = 0;
    this.frostfire = false;
    this.regen = 0;
    this.shield = 0;
    this.elemBoost = 1;
    this.summonBoost = 1;
    this.spirit = false;
    this.lifesteal = 0;
    this.orb = 0;
    this.swords = [];
    this.inv = 0;
    this.fireT = 0;
    this.lastX = this.x;
    this.lastY = this.y;
    this.knockX = 0;
    this.knockY = 0;
  }
  canBeHit() { return this.inv <= 0; }
  hurt(dmg, game, kx, ky) {
    if (!this.canBeHit()) return;
    // 护盾抵挡
    if (this.shield > 0) {
      this.shield -= 1;
      for (let i = 0; i < 10; i++) game.particles.get(this.x, this.y, Util.rand(-70, 70), Util.rand(-90, 20), 0.5, "#9fe8ff", Util.rand(3, 6));
      return;
    }
    this.hp -= dmg;
    this.inv = CONFIG.INVINCIBLE_TIME;
    this.knockX += kx;
    this.knockY += ky;
    for (let i = 0; i < 12; i++) game.particles.get(this.x, this.y, Util.rand(-90, 90), Util.rand(-120, 30), 0.55, "#ff7043", Util.rand(3, 7));
    if (this.hp <= 0) game.gameOver();
  }
  update(dt, game) {
    let targetX = this.x;
    if (game.input.touching) targetX = game.input.touchX;
    else if (game.input.hover) targetX = game.input.hoverX;
    else targetX += (game.input.right - game.input.left) * this.moveSpeed * dt;
    this.x += (targetX - this.x) * (game.input.touching || game.input.hover ? Math.min(1, dt * 14) : 1);
    this.lastX = this.x;
    this.lastY = this.y;
    this.x += this.knockX * dt;
    this.y += this.knockY * dt;
    this.knockX *= Math.pow(0.05, dt);
    this.knockY *= Math.pow(0.05, dt);
    this.x = Util.clamp(this.x, 60, CONFIG.W - 60);
    this.y = Util.clamp(this.y, CONFIG.H * 0.73, CONFIG.H * 0.88);
    // 移动拖尾：横移时留下紫色尾迹
    const moveSpeed = Math.abs(this.x - (this.lastX || this.x)) / Math.max(0.001, dt);
    if (moveSpeed > 120 && Math.random() < 0.5) {
      game.particles.get(this.x, this.y + 8, Util.rand(-12, 12), Util.rand(-30, 30), 0.35, "rgba(168,101,255,0.5)", Util.rand(2, 4));
    }
    this.lastX = this.x;
    if (this.inv > 0) this.inv -= dt;
    if (this.regen > 0) this.hp = Math.min(this.maxHp, this.hp + this.regen * dt);
    this.fireT -= dt;
    if (this.fireT <= 0) {
      this.fireT += 1 / this.fireRate;
      game.fireArrows();
    }
    for (const sword of this.swords) sword.update(dt, game);
    // 环绕火球：绕玩家旋转，触碰敌人灼烧
    if (this.orb > 0) {
      this.orbAngle = (this.orbAngle || 0) + dt * 4;
      for (let k = 0; k < this.orb; k++) {
        const ang = this.orbAngle + k * TAU / Math.max(1, this.orb);
        const ox = this.x + Math.cos(ang) * 52;
        const oy = this.y + Math.sin(ang) * 52 * 0.5;
        for (const e of game.enemies.active()) {
          if (e.dead) continue;
          if (Math.hypot(e.x - ox, e.y - oy) < e.r + 12) {
            e.takeDamage(4 * dt * 60 * 0.1, false, game, true, false);
          }
        }
      }
    }
  }
  render(g) {
    const flash = this.inv > 0 && Math.floor(this.inv * 16) % 2 === 0;
    drawShadow(g, this.x, this.y + 18, 28, 10, 0.4);
    if (flash) return;
    g.save();
    // 强度光环：箭数越多光环越大（成长可视化）
    const haloR = 26 + this.arrowCount * 3 + this.swords.length * 4;
    const haloA = 0.25 + Math.sin(performance.now() * 0.004) * 0.08;
    g.strokeStyle = `rgba(168,101,255,${haloA})`;
    g.lineWidth = 2.5;
    g.beginPath();
    g.arc(this.x, this.y, haloR, 0, TAU);
    g.stroke();
    // ── 人形主角 ──
    const t = performance.now() * 0.006;
    const moving = Math.abs(this.x - (this.lastX || this.x)) > 1 || Math.abs(this.lastY || 0) > 0;
    const legSwing = moving ? Math.sin(t * 10) * 4 : Math.sin(t * 3) * 1.5; // 走路/待机呼吸摆动
    const lean = Util.clamp((this.x - (this.lastX || this.x)) * 0.15, -6, 6); // 移动倾斜
    const skin = getWeaponSkin();
    // 武器配色：皮肤色 + 元素色叠加
    const bowColor = this.fire ? "#ff7b3d" : this.ice ? "#7ad0ff" : this.volt > 0 ? "#f7c948" : skin.color;
    g.translate(this.x + lean, this.y);
    // 披风（紫色，飘动）
    g.fillStyle = "rgba(124,58,180,0.85)";
    g.beginPath();
    g.moveTo(-6, -14);
    g.quadraticCurveTo(-14 - Math.sin(t * 5) * 3, 2, -9 + Math.sin(t * 5) * 2, 16);
    g.lineTo(-2, 12);
    g.quadraticCurveTo(-1, 0, -2, -14);
    g.closePath();
    g.fill();
    // 身体（深紫铠甲）
    g.fillStyle = "#3d2b5e";
    g.beginPath();
    g.moveTo(-9, -6);
    g.quadraticCurveTo(0, -16, 9, -6);
    g.lineTo(11, 10);
    g.quadraticCurveTo(0, 14, -11, 10);
    g.closePath();
    g.fill();
    g.fillStyle = "#6b4aa8";
    g.fillRect(-7, -8, 14, 3);
    // 双腿（摆动）
    g.strokeStyle = "#2a1c42";
    g.lineWidth = 4;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(-4, 11);
    g.lineTo(-4 + legSwing * 0.7, 18);
    g.moveTo(4, 11);
    g.lineTo(4 - legSwing * 0.7, 18);
    g.stroke();
    // 头（皮肤色 + 头发）
    g.fillStyle = "#e8b98a";
    g.beginPath();
    g.arc(0, -17, 8, 0, TAU);
    g.fill();
    g.fillStyle = "#4a2a5a";
    g.beginPath();
    g.arc(0, -19, 8, Math.PI, 0);
    g.fill();
    // 弓（皮肤样式：木弓弯弓 / 火焰弓红 + 火星 / 冰霜弓蓝 + 冰晶 / 雷神弓金 + 电弧）
    g.strokeStyle = bowColor;
    g.lineWidth = 3.5;
    g.shadowBlur = 12;
    g.shadowColor = bowColor;
    g.beginPath();
    g.arc(16, -4, 13, -Math.PI / 2.4, Math.PI / 2.4);
    g.stroke();
    g.shadowBlur = 0;
    // 弓弦
    g.strokeStyle = "rgba(255,255,255,0.5)";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(16 + Math.cos(-Math.PI / 2.4) * 13, -4 + Math.sin(-Math.PI / 2.4) * 13);
    g.lineTo(16 + Math.cos(Math.PI / 2.4) * 13, -4 + Math.sin(Math.PI / 2.4) * 13);
    g.stroke();
    // 皮肤特效：火焰弓火星 / 冰霜弓冰晶 / 雷神弓电弧
    if (this.fire || skin.id === 1) {
      g.fillStyle = "rgba(255,140,60,0.9)";
      g.beginPath();
      g.arc(20 + Math.sin(t * 9) * 3, -10 + Math.cos(t * 7) * 3, 2, 0, TAU);
      g.fill();
    } else if (this.ice || skin.id === 2) {
      g.fillStyle = "rgba(150,220,255,0.9)";
      g.beginPath();
      g.arc(20 + Math.sin(t * 8) * 3, -9 + Math.cos(t * 6) * 3, 1.8, 0, TAU);
      g.fill();
    } else if (skin.id === 3) {
      g.strokeStyle = "rgba(247,201,72,0.8)";
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(26, -10 + Math.sin(t * 12) * 4);
      g.lineTo(31, -6 + Math.cos(t * 10) * 4);
      g.stroke();
    }
    g.restore();
    for (const sword of this.swords) sword.render(g);
    // 环绕火球渲染
    if (this.orb > 0) {
      for (let k = 0; k < this.orb; k++) {
        const ang = (this.orbAngle || 0) + k * TAU / Math.max(1, this.orb);
        const ox = this.x + Math.cos(ang) * 52;
        const oy = this.y + Math.sin(ang) * 52 * 0.5;
        g.save();
        g.shadowBlur = 14;
        g.shadowColor = "#ff7b3d";
        const og = g.createRadialGradient(ox - 2, oy - 2, 1, ox, oy, 10);
        og.addColorStop(0, "#ffe3c2");
        og.addColorStop(0.5, "#ff7b3d");
        og.addColorStop(1, "#e54d3c");
        g.fillStyle = og;
        g.beginPath();
        g.arc(ox, oy, 10, 0, TAU);
        g.fill();
        g.restore();
      }
    }
  }
}

// 三选一：按稀有度权重抽取 3 个不重复升级，且保证流派多样性
function rollChoices() {
  const avail = UPGRADES.filter(u => !u.has(game));
  const picks = [];
  const usedIds = new Set();
  const usedFactions = new Set();
  const attempt = (avoidFaction) => {
    const pool = avail.filter(u => !usedIds.has(u.id) && (!avoidFaction || u.faction !== avoidFaction));
    if (pool.length === 0) return null;
    // 流派热度惩罚：该流派已选次数越多，权重越低（鼓励均衡发展）
    let total = 0;
    const weights = [];
    for (const u of pool) {
      const picked = game.factionCount[u.faction] || 0;
      const w = RARITY[u.rarity].weight / (1 + picked * 0.6);
      weights.push(w);
      total += w;
    }
    let roll = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      roll -= weights[i];
      if (roll <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  };
  // 前两张：允许同流派；第三张：强制不同流派（保证构筑多样）
  const a = attempt(null);
  if (a) { picks.push(a); usedIds.add(a.id); usedFactions.add(a.faction); }
  const b = attempt(null);
  if (b) { picks.push(b); usedIds.add(b.id); usedFactions.add(b.faction); }
  const avoid = picks.length === 2 && picks[0].faction === picks[1].faction ? picks[0].faction : null;
  const c = attempt(avoid);
  if (c) picks.push(c);
  // 兜底
  while (picks.length < 3) {
    const fallback = avail.find(u => !usedIds.has(u.id) && u.id === "hp") || UPGRADES.find(u => u.id === "hp") || UPGRADES[0];
    picks.push(fallback);
    usedIds.add(fallback.id);
  }
  return picks;
}

// ── 局外成长存档系统（方案A：localStorage 自动存档）──
const SAVE_KEY = "arrowStormSave";
const SAVE_VERSION = 1;

const DEFAULTS = {
  gold: 0,
  equip: { bow: 0, charm: 0, sigil: 0 },   // 0-3 级
  talents: { dmg: 0, hp: 0, arrow: 0 },    // 0-3 级
  weaponSkin: 0,                           // 0=木弓 1=火焰弓 2=冰霜弓 3=雷神弓
  chapter: 1,
  bestWave: 0
};

// 武器皮肤：不同样式 + 不同加成（换武器动力）
const WEAPON_SKINS = [
  { id: 0, name: "木弓", icon: "弓", price: 0, color: "#8b5a2b", desc: "初始武器，无加成", bonus: {} },
  { id: 1, name: "火焰弓", icon: "🔥", price: 120, color: "#e54d3c", desc: "伤害 +8%，灼烧伤害 +50%", bonus: { dmg: 1.08, burn: 1.5 } },
  { id: 2, name: "冰霜弓", icon: "❄", price: 150, color: "#5fc6ff", desc: "减速效果 +40%，射速 +6%", bonus: { slow: 1.4, rate: 1.06 } },
  { id: 3, name: "雷神弓", icon: "⚡", price: 200, color: "#f7c948", desc: "暴击率 +12%，箭速 +15%", bonus: { crit: 0.12, arrowSpeed: 1.15 } }
];
function getWeaponSkin() { return WEAPON_SKINS[SaveSystem.data.weaponSkin] || WEAPON_SKINS[0]; }
function applyWeaponSkin(player) {
  const skin = getWeaponSkin();
  if (skin.bonus.dmg) player.damage *= skin.bonus.dmg;
  if (skin.bonus.rate) player.fireRate *= skin.bonus.rate;
  if (skin.bonus.crit) player.crit = Math.min(0.6, player.crit + skin.bonus.crit);
  if (skin.bonus.arrowSpeed) player.arrowSpeed = CONFIG.BASE_ARROW_SPEED * skin.bonus.arrowSpeed;
  if (skin.bonus.burn) player.burnMult = skin.bonus.burn;
  if (skin.bonus.slow) player.slowMult = skin.bonus.slow;
}

const SaveSystem = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) { this.data = { ...DEFAULTS, equip: { ...DEFAULTS.equip }, talents: { ...DEFAULTS.talents } }; return this.data; }
      const parsed = JSON.parse(raw);
      // 版本/字段迁移：缺字段用默认值补齐
      this.data = {
        gold: parsed.gold || 0,
        equip: { ...DEFAULTS.equip, ...(parsed.equip || {}) },
        talents: { ...DEFAULTS.talents, ...(parsed.talents || {}) },
        weaponSkin: parsed.weaponSkin || 0,
        chapter: parsed.chapter || 1,
        bestWave: parsed.bestWave || 0
      };
      return this.data;
    } catch (e) {
      this.data = { ...DEFAULTS, equip: { ...DEFAULTS.equip }, talents: { ...DEFAULTS.talents } };
      return this.data;
    }
  },
  save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* 无痕模式静默失败 */ }
  },
  addGold(n) { this.data.gold = Math.max(0, Math.floor(this.data.gold + n)); this.save(); },
  // 装备/天赋价格：随等级递增
  equipPrice(slot) { const lv = this.data.equip[slot]; return [60, 150, 320][lv] || 0; },
  talentPrice(slot) { const lv = this.data.talents[slot]; return [80, 180, 380][lv] || 0; },
  canBuyEquip(slot) { return this.data.equip[slot] < 3 && this.data.gold >= this.equipPrice(slot); },
  canBuyTalent(slot) { return this.data.talents[slot] < 3 && this.data.gold >= this.talentPrice(slot); },
  buyEquip(slot) {
    if (!this.canBuyEquip(slot)) return false;
    this.data.gold -= this.equipPrice(slot);
    this.data.equip[slot]++;
    this.save();
    return true;
  },
  buyTalent(slot) {
    if (!this.canBuyTalent(slot)) return false;
    this.data.gold -= this.talentPrice(slot);
    this.data.talents[slot]++;
    this.save();
    return true;
  }
};
SaveSystem.load();

// 局外成长 → 玩家初始属性加成
function applyMetaProgression(p) {
  const s = SaveSystem.data;
  // 装备：弓 = 伤害/射速
  const bow = s.equip.bow;
  p.damage = CONFIG.BASE_ARROW_DAMAGE * (1 + bow * 0.18);
  p.fireRate = CONFIG.BASE_FIRE_RATE * (1 + bow * 0.1);
  // 护符 = 暴击
  p.crit = Math.min(0.6, s.equip.charm * 0.08);
  // 法阵 = 元素强度
  p.elemBoost = 1 + s.equip.sigil * 0.25;
  // 天赋：伤害 / 生命 / 初始箭数
  p.damage *= 1 + s.talents.dmg * 0.12;
  p.maxHp = 100 + s.talents.hp * 15;
  p.hp = p.maxHp;
  p.arrowCount = Math.min(5, 1 + s.talents.arrow);
  // 武器皮肤加成
  applyWeaponSkin(p);
}

class Game {
  constructor() {
    this.player = new Player();
    this.arrows = new Pool(Arrow);
    this.enemies = new Pool(Enemy);
    this.bullets = new Pool(Bullet);
    this.coins = new Pool(Coin);
    this.particles = new Pool(Particle);
    this.input = { left: 0, right: 0, touching: false, touchX: CONFIG.W / 2, hover: false, hoverX: CONFIG.W / 2 };
    this.state = "MENU";
    this.highScore = Number(localStorage.getItem("arrowStormHighScore") || "0");
    this.decor = [];
    this.leaves = [];
    this.gate = null;
    this.chest = null;
    this.message = "";
    this.messageT = 0;
    this.resetWorld();
  }
  resetWorld() {
    this.distance = 0;
    this.score = 0;
    this.kills = 0;
    this.chapter = 1;
    this.roomIndex = 0;
    this.roomType = ROOM_SEQUENCE[0];
    this.roomCleared = false;
    this.roomStarted = false;
    this.roomTransition = 0;
    this.settlementBonus = 0;
    this.settlementBanked = false;
    this.wave = 1;
    this.spawnedWave = 0;
    this.flyBonus = 0;
    this.flySpeed = 0;
    this.boss = null;
    this.gate = null;
    this.chest = null;
    this.inRunShop = null;
    this.ring = null;
    this.shake = 0;
    this.choices = null;
    this.factionCount = {};
    this.factionAwakened = {};
    this.awakenMsg = "";
    this.awakenT = 0;
    this.hitStop = 0;
    this.slowMo = 0;
    this.hpGhost = 100;
    this.bossIntro = 0;
    this._armoredHint = false;
    this._etherealHint = false;
    this.decor.length = 0;
    this.leaves.length = 0;
    rebuildThemeDecor(this);
    for (let i = 0; i < 22; i++) this.leaves.push({ x: Util.rand(0, CONFIG.W), y: Util.rand(0, CONFIG.H), s: Util.rand(0.4, 1.3), a: Util.rand(0, TAU) });
  }
  start() {
    audio.ensure();
    this.state = "PLAY";
    this.player.reset();
    applyMetaProgression(this.player); // 局外成长 → 初始属性
    this.runGold = 0; // 本局获得金币（死亡结算入账）
    themeIndex = 0; // 每局从森林开始
    themeTrans = 0;
    this.arrows.items.length = 0;
    this.enemies.items.length = 0;
    this.bullets.items.length = 0;
    this.coins.items.length = 0;
    this.particles.items.length = 0;
    this.resetWorld();
    this.enterRoom(1, 0);
  }
  openShop() { audio.ensure(); this.state = "SHOP"; this.shopTab = 0; }
  closeShop() { this.state = "MENU"; }
  gameOver() {
    if (this.state !== "PLAY") return;
    this.state = "GAME_OVER";
    audio.death();
    this.bankRunGold();
    this.highScore = Math.max(this.highScore, Math.floor(this.distance));
    localStorage.setItem("arrowStormHighScore", String(this.highScore));
    SaveSystem.data.bestWave = Math.max(SaveSystem.data.bestWave || 0, this.wave);
    SaveSystem.data.chapter = Math.max(SaveSystem.data.chapter || 1, this.chapter);
    SaveSystem.save();
  }
  getFlySpeed() {
    return 0;
  }
  bankRunGold() {
    if (this.settlementBanked) return;
    this.settlementBanked = true;
    SaveSystem.addGold((this.runGold || 0) + (this.settlementBonus || 0));
  }
  update(dt) {
    // 时间缩放：命中顿帧 / 击杀慢镜
    if (this.hitStop > 0) {
      this.hitStop -= dt;
      dt *= this.hitStop > 0.02 ? 0.06 : 0.4;
    }
    if (this.slowMo > 0) {
      this.slowMo -= dt;
      dt *= 0.35;
    }
    if (this.state !== "PLAY") {
      this.updateBackdrop(dt);
      for (const p of this.particles.active()) p.update(dt);
      if (this.chooseT > 0) this.chooseT -= dt;
      if (this.awakenT > 0) this.awakenT -= dt;
      if (this.bossIntro > 0) this.bossIntro -= dt;
      if (this.roomTransition > 0) this.roomTransition -= dt;
      if (themeTrans > 0) themeTrans -= dt * 0.8;
      return;
    }
    this.flySpeed = 0;
    this.distance = (this.chapter - 1) * 600 + this.roomIndex * 100;
    this.updateBackdrop(dt);
    this.updateInRunShop(dt);
    this.player.update(dt, this);
    for (const a of this.arrows.active()) a.update(dt, this);
    for (const e of this.enemies.active()) e.update(dt, this);
    for (const b of this.bullets.active()) b.update(dt, this);
    for (const c of this.coins.active()) c.update(dt, this);
    for (const p of this.particles.active()) p.update(dt);
    this.updateGate(dt);
    this.updateChest(dt);
    this.checkRoomClear();
    if (this.ring) {
      this.ring.r += (this.ring.maxR - this.ring.r) * Math.min(1, dt * 9);
      this.ring.life -= dt;
      if (this.ring.life <= 0) this.ring = null;
    }
    if (this.bossIntro > 0) this.bossIntro -= dt;
    if (this.roomTransition > 0) this.roomTransition -= dt;
    if (themeTrans > 0) themeTrans -= dt * 0.8;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 26);
    if (this.messageT > 0) this.messageT -= dt;
  }
  updateBackdrop(dt) {
    const scroll = 0;
    for (const d of this.decor) {
      d.rot += Math.sin(performance.now() * 0.001 + d.x) * 0.0003;
    }
    for (const l of this.leaves) {
      l.y += l.s * 12 * dt;
      l.x += Math.sin(l.a + performance.now() * 0.001) * 12 * dt;
      l.a += dt;
      if (l.y > CONFIG.H + 20) { l.y = -20; l.x = Util.rand(0, CONFIG.W); }
    }
  }
  makeDecor(y, type) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const road = Util.roadWidth(y);
    return {
      type,
      y,
      x: CONFIG.W / 2 + side * (road / 2 + Util.rand(22, 105)),
      layer: Util.rand(0.75, 1.08),
      rot: Util.rand(-0.25, 0.25),
      tone: Math.random()
    };
  }
  enterRoom(chapter, roomIndex) {
    this.chapter = chapter;
    this.roomIndex = roomIndex;
    this.roomType = ROOM_SEQUENCE[this.roomIndex];
    this.wave = (chapter - 1) * ROOM_SEQUENCE.length + roomIndex + 1;
    this.spawnedWave = this.wave;
    this.roomCleared = false;
    this.roomStarted = true;
    this.roomTransition = 1.2;
    this.gate = null;
    this.chest = null;
    this.boss = null;
    this.inRunShop = null;
    this.arrows.items.length = 0;
    this.bullets.items.length = 0;
    this.enemies.items.length = 0;
    this.coins.items.length = 0;
    this.player.x = CONFIG.W / 2;
    this.player.y = CONFIG.PLAYER_Y;
    checkThemeSwitch(this);
    this.spawnRoom();
    this.flashMessage(`第 ${this.chapter} 章 · 房间 ${this.roomIndex + 1}/6`);
  }
  spawnWave() {
    this.spawnRoom();
  }
  spawnRoom() {
    this.spawnedWave = this.wave;
    const difficulty = this.wave;
    if (this.roomType === "shop") {
      this.spawnShopRoom();
      this.spawnGate();
      return;
    }
    if (this.roomType === "boss") {
      this.boss = this.enemies.get("boss", CONFIG.W / 2, 135, difficulty);
      audio.boss();
      this.flashMessage(bossForChapter(this.chapter).title);
      // Boss 出场演出：暗幕 + 震屏 + 顶部红光
      this.bossIntro = 1.2;
      this.shake = Math.max(this.shake || 0, 10);
      return;
    }
    const baseCount = this.roomType === "elite" ? Util.randi(2, 3) : this.roomIndex === 4 ? Util.randi(3, 5) : Util.randi(2, 4 + Math.min(1, Math.floor(this.chapter / 3)));
    const types = [];
    types.push("minion");
    if (difficulty >= 2) types.push("flyer");
    if (difficulty >= 3) types.push("archer");
    if (difficulty >= 4) types.push("tank");
    if (difficulty >= 8) types.push("flyer", "tank", "archer");
    for (let i = 0; i < baseCount; i++) {
      const y = Util.rand(145, 455) + (i % 2) * 26;
      const roadW = Util.roadWidth(y);
      const x = CONFIG.W / 2 + Util.rand(-roadW * 0.36, roadW * 0.36);
      const e = this.enemies.get(Util.pick(types), x, y, difficulty);
      if (this.roomType === "elite") {
        e.isElite = true;
        e.eliteAffix = e.eliteAffix || Util.pick(["swift", "huge", "armored", "splitter"]);
        e.hp = Math.round(e.hp * 1.8);
        e.maxHp = e.hp;
        e.r *= e.eliteAffix === "huge" ? 1.25 : 1;
      }
    }
  }
  spawnShopRoom() {
    this.inRunShop = { items: getInRunShopItems(), pulse: 0 };
    this.flashMessage("神秘商人：局内金币可购买临时强化");
  }
  spawnGate() {
    this.gate = { x: CONFIG.W / 2, y: CONFIG.H * 0.73, r: 48, pulse: 0 };
    audio.upgrade();
  }
  chooseUpgrade(idx) {
    const up = this.choices && this.choices[idx];
    if (!up) return;
    this.applyUpgrade(up);
    this.choices = null;
    this.state = "PLAY";
    this.spawnGate();
  }
  updateGate(dt) {
    if (!this.gate) return;
    this.gate.pulse += dt;
    const dx = this.gate.x - this.player.x;
    const dy = this.gate.y - this.player.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    if (d < 150) {
      const pull = (1 - d / 150) * 190;
      this.player.x += dx / d * pull * dt;
      this.player.y += dy / d * pull * dt;
    }
    if (d < this.gate.r + this.player.r) this.advanceRoom();
  }
  checkRoomClear() {
    if (this.roomCleared || this.gate || this.choices || this.roomType === "shop") return;
    if (this.chest || this.boss) return;
    const alive = this.enemies.active().some(e => !e.dead);
    if (alive) return;
    this.roomCleared = true;
    if (this.roomType === "battle" || this.roomType === "elite") {
      this.choices = rollChoices();
      this.state = "CHOOSE";
      this.chooseT = 0.35;
      audio.upgrade();
    } else if (this.roomType === "boss") {
      this.spawnGate();
    }
  }
  advanceRoom() {
    if (!this.gate) return;
    this.gate = null;
    this.inRunShop = null;
    this.arrows.items.length = 0;
    this.bullets.items.length = 0;
    if (this.roomIndex >= ROOM_SEQUENCE.length - 1) {
      this.settlementBonus += 50;
      const nextChapter = this.chapter + 1;
      SaveSystem.data.chapter = Math.max(SaveSystem.data.chapter || 1, nextChapter);
      SaveSystem.save();
      this.enterRoom(nextChapter, 0);
    } else {
      this.enterRoom(this.chapter, this.roomIndex + 1);
    }
  }
  updateInRunShop(dt) {
    if (this.inRunShop) this.inRunShop.pulse += dt;
  }
  buyInRunShop(idx) {
    if (!this.inRunShop) return false;
    const item = this.inRunShop.items[idx];
    if (!item || item.sold || (this.runGold || 0) < item.price) return false;
    this.runGold -= item.price;
    item.sold = true;
    item.apply(this);
    this.flashMessage(`${item.name}：购买成功`);
    audio.upgrade();
    return true;
  }
  applyUpgrade(up) {
    up.apply(this);
    // 流派计数 + 觉醒检测（每选 3 个同系触发）
    this.factionCount[up.faction] = (this.factionCount[up.faction] || 0) + 1;
    if (this.factionCount[up.faction] % 3 === 0 && !this.factionAwakened[up.faction]) {
      this.factionAwakened[up.faction] = true;
      const aw = FACTION_AWAKEN[up.faction];
      if (aw) {
        aw.apply(this);
        this.awakenMsg = `${aw.name}！${aw.desc}`;
        this.awakenT = 2.6;
        audio.boss();
        this.shake = Math.max(this.shake || 0, 12);
        this.ring = { x: this.player.x, y: this.player.y, r: 10, maxR: 260, life: 0.8 };
        for (let i = 0; i < 60; i++) this.particles.get(this.player.x, this.player.y, Util.rand(-220, 220), Util.rand(-260, 80), 1.0, Util.pick(["#f7c948", "#c77dff", "#5fc6ff"]), Util.rand(4, 11));
      }
    }
    // 升级演出：金色大字 + 扩散光圈 + 冲击粒子 + 屏幕微震
    this.flashMessage(`${up.name}：${up.desc}`);
    this.particles.get(this.player.x, this.player.y, 0, 0, 0.9, "#f7c948", 10, up.name, false); // 大字
    this.particles.get(this.player.x, this.player.y, 0, 0, 0.9, "#f7c948", 8, up.desc, false);
    this.ring = { x: this.player.x, y: this.player.y, r: 10, maxR: 190, life: 0.55 };
    this.shake = Math.max(this.shake || 0, 7);
    audio.upgrade();
    for (let i = 0; i < 34; i++) this.particles.get(this.player.x, this.player.y, Util.rand(-160, 160), Util.rand(-200, 60), 0.75, Util.pick(["#f7c948", "#a865ff", "#fff1a5"]), Util.rand(3, 9));
  }
  spawnChest() {
    this.chest = { x: CONFIG.W / 2, y: CONFIG.H * 0.73, r: 34 };
  }
  updateChest(dt) {
    if (!this.chest) return;
    this.chest.y += this.flySpeed * dt;
    if (Util.circleHit(this.player, this.chest)) {
      const reward = Util.randi(0, 2);
      if (reward === 0) {
        this.player.damage *= 1.08;
        this.player.fireRate = Math.min(6, this.player.fireRate * 1.06);
        this.player.moveSpeed = Math.min(700, this.player.moveSpeed * 1.06);
        this.flashMessage("宝箱：全属性提升");
      } else if (reward === 1) {
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.player.maxHp * 0.4);
        this.flashMessage("宝箱：回复 40%");
      } else {
        this.score += 300;
        // 宝箱金币：洒出 6 枚金币实体
        for (let i = 0; i < 6; i++) {
          this.coins.get(this.chest.x + Util.rand(-30, 30), this.chest.y + Util.rand(-20, 20), 10, Util.rand(-90, 90), Util.rand(-180, -60));
        }
        this.flashMessage("宝箱：金币 +60");
      }
      audio.chest();
      for (let i = 0; i < 35; i++) this.particles.get(this.chest.x, this.chest.y, Util.rand(-150, 150), Util.rand(-190, 40), 0.9, "#f7c948", Util.rand(4, 10));
      this.chest = null;
    } else if (this.chest.y > CONFIG.H + 80) this.chest = null;
  }
  fireArrows() {
    const n = this.player.arrowCount;
    const spread = n === 1 ? 0 : 0.34;
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0 : (i / (n - 1) - 0.5) * spread;
      const a = this.arrows.get(this.player.x, this.player.y - 36, t, this.player.damage, this.player.range, this.player.pierce, this.player.crit, this.player.fire, this.player.ice);
      a.split = this.player.split;
      a.volt = this.player.volt;
      a.frostfire = this.player.frostfire;
      a.lifesteal = this.player.lifesteal;
    }
    // 射击后座：玩家轻微下压 + 弓口火光粒子
    this.player.knockY += 26;
    for (let i = 0; i < 3; i++) {
      this.particles.get(this.player.x + Util.rand(-6, 6), this.player.y - 40, Util.rand(-20, 20), Util.rand(-60, -20), 0.2, Util.pick(["#eadcff", "#a865ff"]), Util.rand(2, 4));
    }
    audio.shoot();
  }
  damageNumber(x, y, amount, crit) {
    this.particles.get(x, y, Util.rand(-18, 18), -78, 0.72, CONFIG.COLORS.orange, 1, String(amount), crit);
  }
  flashMessage(text) {
    this.message = text;
    this.messageT = 1.8;
  }
  render(g) {
    g.save();
    // 屏幕震动
    if (this.shake > 0.2) {
      g.translate(Util.rand(-this.shake, this.shake) * 0.5, Util.rand(-this.shake, this.shake) * 0.5);
    }
    drawWorld(g, this);
    if (this.gate) drawGate(g, this.gate);
    if (this.chest) drawChest(g, this.chest);
    const renderables = [];
    for (const e of this.enemies.active()) renderables.push(e);
    renderables.sort((a, b) => a.y - b.y);
    for (const e of renderables) e.render(g);
    for (const a of this.arrows.active()) a.render(g);
    for (const b of this.bullets.active()) b.render(g);
    for (const c of this.coins.active()) c.render(g);
    this.player.render(g);
    // 升级光圈（画在粒子下层）
    if (this.ring) {
      const a = Util.clamp(this.ring.life / 0.55, 0, 1);
      g.strokeStyle = `rgba(247,201,72,${0.75 * a})`;
      g.lineWidth = 5 * a;
      g.beginPath();
      g.arc(this.ring.x, this.ring.y, this.ring.r, 0, TAU);
      g.stroke();
    }
    for (const p of this.particles.active()) p.render(g);
    drawUI(g, this);
    if (this.inRunShop) drawInRunShop(g, this);
    // 三选一卡牌界面（画在最上层）
    if (this.state === "CHOOSE" && this.choices) {
      drawChoiceCards(g, this);
    }
    // Boss 出场演出：红色暗幕 + 顶部血光
    if (this.bossIntro > 0) {
      const a = Util.clamp(this.bossIntro / 1.2, 0, 1);
      const grad = g.createLinearGradient(0, 0, 0, CONFIG.H * 0.5);
      grad.addColorStop(0, `rgba(200,30,40,${0.4 * a})`);
      grad.addColorStop(1, "rgba(200,30,40,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, CONFIG.W, CONFIG.H * 0.5);
      g.fillStyle = `rgba(0,0,0,${0.35 * a})`;
      g.fillRect(0, 0, CONFIG.W, CONFIG.H);
    }
    // 商店界面
    if (this.state === "SHOP") {
      drawShop(g, this);
    }
    // 觉醒大字
    if (this.awakenT > 0 && this.awakenMsg) {
      g.save();
      g.globalAlpha = Math.min(1, this.awakenT);
      g.textAlign = "center";
      g.shadowBlur = 26;
      g.shadowColor = "#f7c948";
      g.font = "bold 46px Microsoft YaHei, sans-serif";
      g.fillStyle = "#ffd56a";
      g.fillText(this.awakenMsg.split("！")[0] + "！", CONFIG.W / 2, CONFIG.H * 0.38);
      g.shadowBlur = 0;
      g.font = "bold 22px Microsoft YaHei, sans-serif";
      g.fillStyle = "#fff0c4";
      g.fillText(this.awakenMsg.split("！").slice(1).join("！"), CONFIG.W / 2, CONFIG.H * 0.38 + 44);
      g.restore();
    }
    g.restore();
  }
}

const game = new Game();

// ── AI 演示模式（?demo=1）：游戏自己会玩，屏幕显示决策日志 ──
const DEMO = new URLSearchParams(location.search).has("demo");
const DemoAI = {
  log: [],
  lastLog: 0,
  say(text) {
    const now = performance.now();
    if (now - this.lastLog < 600) return; // 限频
    this.lastLog = now;
    this.log.push({ t: now, text });
    if (this.log.length > 5) this.log.shift();
  },
  think(dt) {
    if (!DEMO) return;
    if (game.state === "MENU" && !game._demoStarted) {
      game._demoStarted = true;
      game.start();
      this.say("AI 演示模式启动，开始第一局");
      return;
    }
    if (game.state === "CHOOSE" && game.choices) {
      // 选卡策略：优先稀有度高，同稀有度随机
      let best = 0;
      for (let i = 1; i < game.choices.length; i++) {
        if (RARITY[game.choices[i].rarity].weight < RARITY[game.choices[best].rarity].weight) best = i;
      }
      const picked = game.choices[best];
      this.say(`选择：${picked.name}（${RARITY[picked.rarity].label}）`);
      game.chooseUpgrade(best);
      return;
    }
    if (game.state === "GAME_OVER") {
      this.say(`本局结束：${Math.round(game.distance)}m，重启下一局`);
      game.start();
      return;
    }
    if (game.state !== "PLAY") return;
    const px = game.player.x, py = game.player.y;
    const setTarget = x => { game.input.hover = true; game.input.hoverX = Util.clamp(x, 62, CONFIG.W - 62); };

    // 1. 宝箱优先：主动去吃
    if (game.chest) {
      setTarget(game.chest.x);
      if (Math.abs(game.chest.x - px) < 12 && Math.random() < 0.02) this.say("发现宝箱，冲！");
      return;
    }
    if (game.inRunShop) {
      const buyable = game.inRunShop.items.findIndex(item => !item.sold && (game.runGold || 0) >= item.price);
      if (buyable >= 0 && Math.random() < 0.08) {
        game.buyInRunShop(buyable);
        this.say("局内商店购买临时强化");
      }
      if (game.gate) setTarget(game.gate.x);
      return;
    }
    if (game.gate) {
      setTarget(game.gate.x);
      if (Math.abs(game.gate.x - px) < 18 && Math.random() < 0.02) this.say("清房完成，进入下一房");
      return;
    }

    // 2. 危险检测：弹幕优先（致命），敌人次之
    let danger = null, dangerD = 1e9;
    for (const b of game.bullets.active()) {
      const d = Math.hypot(b.x - px, b.y - py);
      if (d < dangerD && b.y > py - 340 && d < 300) { dangerD = d; danger = { x: b.x, y: b.y }; }
    }
    if (!danger) {
      for (const e of game.enemies.active()) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - px, e.y - py);
        if (d < dangerD && e.y > py - 460) { dangerD = d; danger = { x: e.x, y: e.y, enemy: true }; }
      }
    }

    // 3. 目标计算
    let targetX = CONFIG.W / 2;
    if (danger) {
      if (dangerD < 230) {
        // 急躲：远离威胁；贴边时拉回中心，绝不卡边
        const away = px + (px - danger.x) * 1.4;
        targetX = away < 100 || away > CONFIG.W - 100 ? CONFIG.W / 2 : away;
        if (dangerD < 120) targetX = CONFIG.W / 2;
        if (Math.random() < 0.01) this.say(danger.x > px ? "弹幕来了，左闪" : "弹幕来了，右闪");
      } else {
        // 中距离：横向错开半个身位，保持输出
        targetX = px + (px - danger.x) * 0.35;
        targetX = Util.clamp(targetX, 90, CONFIG.W - 90);
      }
    } else {
      // 4. 无危险：主动索敌对齐射击（打怪意识）
      let bestE = null, bestD = 1e9;
      for (const e of game.enemies.active()) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - px, e.y - py);
        if (d < bestD && e.y > py - 520) { bestD = d; bestE = e; }
      }
      if (bestE) {
        // 轻微追向敌人正下方，让箭直射命中
        targetX = bestE.x + (bestE.x - px) * 0.12;
        if (Math.abs(bestE.x - px) > 140 && Math.random() < 0.008) this.say("锁定目标，对齐射击");
      } else {
        // 无敌人：回中心巡航
        targetX = CONFIG.W / 2 + Math.sin(performance.now() * 0.0004) * 60;
      }
    }
    setTarget(targetX);
    return;
  },
  render(g) {
    if (!DEMO) return;
    // 屏幕顶部 AI 决策日志
    g.save();
    g.fillStyle = "rgba(7,12,8,0.66)";
    roundRect(g, 330, 118, 196, 118, 8); g.fill();
    g.fillStyle = "#7cf8a8";
    g.font = "bold 13px Microsoft YaHei, sans-serif";
    g.textAlign = "left";
    g.fillText("🤖 AI 演示", 342, 140);
    g.font = "12px Microsoft YaHei, sans-serif";
    const now = performance.now();
    const rows = this.log.slice(-4);
    rows.forEach((l, i) => {
      const age = (now - l.t) / 1000;
      g.globalAlpha = Math.max(0.25, 1 - age / 6);
      g.fillStyle = "#d8e6f5";
      g.fillText(l.text, 342, 162 + i * 18);
    });
    g.globalAlpha = 1;
    g.restore();
  }
};

function drawWorld(g, state) {
  const th = getTheme();
  const grad = g.createLinearGradient(0, 0, 0, CONFIG.H);
  grad.addColorStop(0, th.grassFar);
  grad.addColorStop(1, th.grassNear);
  g.fillStyle = grad;
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.save();
  g.globalAlpha = 0.5;
  for (let i = 0; i < 50; i++) {
    const y = i * 42 - 42;
    g.strokeStyle = i % 2 ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.05)";
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(CONFIG.W, y + 18);
    g.stroke();
  }
  g.restore();
  g.fillStyle = th.roadFar;
  g.beginPath();
  g.moveTo(CONFIG.W / 2 - CONFIG.ROAD_TOP_W / 2, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_TOP_W / 2, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_BOTTOM_W / 2, CONFIG.H);
  g.lineTo(CONFIG.W / 2 - CONFIG.ROAD_BOTTOM_W / 2, CONFIG.H);
  g.closePath();
  g.fill();
  const roadGrad = g.createLinearGradient(0, 0, 0, CONFIG.H);
  roadGrad.addColorStop(0, th.roadFar);
  roadGrad.addColorStop(1, th.roadNear);
  g.fillStyle = roadGrad;
  g.beginPath();
  g.moveTo(CONFIG.W / 2 - CONFIG.ROAD_TOP_W / 2 + 12, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_TOP_W / 2 - 12, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_BOTTOM_W / 2 - 20, CONFIG.H);
  g.lineTo(CONFIG.W / 2 - CONFIG.ROAD_BOTTOM_W / 2 + 20, CONFIG.H);
  g.closePath();
  g.fill();
  g.strokeStyle = th.roadEdge;
  g.lineWidth = 5;
  g.beginPath();
  g.moveTo(CONFIG.W / 2 - CONFIG.ROAD_TOP_W / 2, 0);
  g.lineTo(CONFIG.W / 2 - CONFIG.ROAD_BOTTOM_W / 2, CONFIG.H);
  g.moveTo(CONFIG.W / 2 + CONFIG.ROAD_TOP_W / 2, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_BOTTOM_W / 2, CONFIG.H);
  g.stroke();
  // 道路动态光斑：随飞行流动的光影（主题配色）
  g.save();
  g.globalAlpha = 0.08;
  for (let i = 0; i < 6; i++) {
    const ly = i * 170 - 60 + Math.sin(performance.now() * 0.0008 + i) * 18;
    const lw = Util.roadWidth(ly) * 0.55;
    const lx = CONFIG.W / 2 + Math.sin(i * 2.4 + performance.now() * 0.0005) * 40;
    g.fillStyle = th.light[i % 2];
    g.beginPath();
    g.ellipse(lx, ly, lw * 0.32, 16 + ly / CONFIG.H * 14, 0, 0, TAU);
    g.fill();
  }
  g.restore();
  for (const d of [...state.decor].sort((a, b) => a.y - b.y)) drawDecor(g, d);
  drawLeaves(g, state.leaves, th.leaf);
  // 场景过渡横幅（淡入淡出）
  if (themeTrans > 0) {
    const a = Math.min(1, themeTrans * 2);
    g.save();
    g.globalAlpha = a;
    g.fillStyle = "rgba(0,0,0,0.5)";
    g.fillRect(0, CONFIG.H * 0.42 - 50, CONFIG.W, 100);
    g.fillStyle = "#f5ecd9";
    g.font = "bold 26px Microsoft YaHei, sans-serif";
    g.textAlign = "center";
    g.fillText(`— ${th.name} —`, CONFIG.W / 2, CONFIG.H * 0.42 + 6);
    g.restore();
  }
  if (state.roomTransition > 0) {
    const a = Util.clamp(state.roomTransition / 1.2, 0, 1);
    g.save();
    g.globalAlpha = a;
    g.fillStyle = "rgba(0,0,0,0.42)";
    g.fillRect(0, CONFIG.H * 0.33 - 46, CONFIG.W, 92);
    g.fillStyle = "#fff0c4";
    g.font = "bold 24px Microsoft YaHei, sans-serif";
    g.textAlign = "center";
    g.fillText(`第 ${state.chapter} 章 · 房间 ${state.roomIndex + 1}/6 · ${ROOM_LABEL[state.roomType]}`, CONFIG.W / 2, CONFIG.H * 0.33 + 8);
    g.restore();
  }
}

function drawDecor(g, d) {
  const s = Util.worldScale(d.y) * (d.type === "tree" || d.type === "pine" || d.type === "shadetree" ? 1 : 0.75);
  g.save();
  g.translate(d.x, d.y);
  g.rotate(d.rot);
  drawShadow(g, 0, 16 * s, 18 * s, 7 * s, 0.25);
  if (d.type === "tree") {
    g.fillStyle = "#5c3b26";
    g.fillRect(-5 * s, -2 * s, 10 * s, 28 * s);
    g.fillStyle = d.tone > 0.5 ? "#2f6b35" : "#3f813b";
    g.beginPath();
    g.moveTo(0, -42 * s);
    g.lineTo(-28 * s, 8 * s);
    g.lineTo(24 * s, 12 * s);
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(255,255,255,0.12)";
    g.beginPath();
    g.moveTo(-4 * s, -34 * s);
    g.lineTo(-18 * s, -2 * s);
    g.lineTo(3 * s, -8 * s);
    g.closePath();
    g.fill();
  } else if (d.type === "pine") {
    // 雪原松树
    g.fillStyle = "#4a3a28";
    g.fillRect(-4 * s, -2 * s, 8 * s, 24 * s);
    for (let k = 0; k < 3; k++) {
      const y = -10 - k * 14;
      g.fillStyle = k === 2 ? "#2e5c4a" : "#3a6e58";
      g.beginPath();
      g.moveTo(0, (y - 18) * s);
      g.lineTo(-22 * s, y * s + 8 * s);
      g.lineTo(22 * s, y * s + 8 * s);
      g.closePath();
      g.fill();
    }
    g.fillStyle = "rgba(255,255,255,0.35)";
    g.beginPath();
    g.moveTo(-8 * s, -30 * s);
    g.lineTo(-4 * s, -40 * s);
    g.lineTo(0, -34 * s);
    g.closePath();
    g.fill();
  } else if (d.type === "shadetree") {
    // 暗域树：深紫+发光
    g.fillStyle = "#2a1a3a";
    g.fillRect(-5 * s, -2 * s, 10 * s, 26 * s);
    g.fillStyle = d.tone > 0.5 ? "#4a2a6a" : "#3a2058";
    g.beginPath();
    g.arc(0, -20 * s, 22 * s, 0, TAU);
    g.fill();
    g.fillStyle = "rgba(190,140,255,0.25)";
    g.beginPath();
    g.arc(-6 * s, -24 * s, 8 * s, 0, TAU);
    g.fill();
  } else if (d.type === "cactus") {
    // 沙漠仙人掌
    g.fillStyle = "#3a6a3a";
    g.fillRect(-4 * s, -4 * s, 8 * s, 30 * s);
    g.fillRect(-14 * s, -2 * s, 8 * s, 14 * s);
    g.fillRect(6 * s, 4 * s, 8 * s, 12 * s);
    g.fillStyle = "rgba(255,255,255,0.15)";
    g.fillRect(-3 * s, -4 * s, 3 * s, 14 * s);
  } else if (d.type === "magrock") {
    // 岩浆岩石：暗红+裂纹发光
    g.fillStyle = "#3a1a14";
    g.beginPath();
    g.moveTo(-20 * s, 5 * s);
    g.lineTo(-8 * s, -16 * s);
    g.lineTo(15 * s, -11 * s);
    g.lineTo(24 * s, 7 * s);
    g.lineTo(7 * s, 17 * s);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(255,120,60,0.6)";
    g.lineWidth = 2.5 * s;
    g.beginPath();
    g.moveTo(-6 * s, -8 * s);
    g.lineTo(8 * s, -2 * s);
    g.stroke();
  } else if (d.type === "snowrock") {
    g.fillStyle = "#7a93ab";
    g.beginPath();
    g.moveTo(-20 * s, 5 * s);
    g.lineTo(-8 * s, -16 * s);
    g.lineTo(15 * s, -11 * s);
    g.lineTo(24 * s, 7 * s);
    g.lineTo(7 * s, 17 * s);
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(255,255,255,0.5)";
    g.beginPath();
    g.moveTo(-8 * s, -16 * s);
    g.lineTo(0, -6 * s);
    g.lineTo(-12 * s, 0);
    g.closePath();
    g.fill();
  } else if (d.type === "crystal") {
    // 暗域水晶
    g.fillStyle = "#8a6aff";
    g.beginPath();
    g.moveTo(0, -26 * s);
    g.lineTo(9 * s, -4 * s);
    g.lineTo(4 * s, 10 * s);
    g.lineTo(-4 * s, 10 * s);
    g.lineTo(-9 * s, -4 * s);
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(220,200,255,0.6)";
    g.beginPath();
    g.moveTo(0, -26 * s);
    g.lineTo(4 * s, -8 * s);
    g.lineTo(-2 * s, 4 * s);
    g.closePath();
    g.fill();
  } else if (d.type === "rock") {
    g.fillStyle = d.tone > 0.5 ? "#7a8178" : "#646b66";
    g.beginPath();
    g.moveTo(-20 * s, 5 * s);
    g.lineTo(-8 * s, -16 * s);
    g.lineTo(15 * s, -11 * s);
    g.lineTo(24 * s, 7 * s);
    g.lineTo(7 * s, 17 * s);
    g.closePath();
    g.fill();
  } else {
    g.strokeStyle = "#7b5632";
    g.lineWidth = 6 * s;
    g.beginPath();
    g.moveTo(-28 * s, -8 * s);
    g.lineTo(28 * s, 8 * s);
    g.moveTo(-20 * s, -18 * s);
    g.lineTo(-20 * s, 14 * s);
    g.moveTo(14 * s, -8 * s);
    g.lineTo(14 * s, 24 * s);
    g.stroke();
  }
  g.restore();
}

function drawLeaves(g, leaves, color) {
  g.save();
  for (const l of leaves) {
    g.translate(l.x, l.y);
    g.rotate(l.a);
    g.fillStyle = color || "rgba(205,151,61,0.38)";
    g.beginPath();
    g.ellipse(0, 0, 5 * l.s, 2.5 * l.s, 0, 0, TAU);
    g.fill();
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
  g.restore();
}

function drawShadow(g, x, y, rx, ry, alpha) {
  g.save();
  g.fillStyle = `rgba(0,0,0,${alpha})`;
  g.beginPath();
  g.ellipse(x, y, rx, ry, 0, 0, TAU);
  g.fill();
  g.restore();
}

function drawStonePlatform(g, x, y, r) {
  g.save();
  g.fillStyle = "#656760";
  g.beginPath();
  g.ellipse(x, y, r, r * 0.34, 0, 0, TAU);
  g.fill();
  g.fillStyle = "rgba(255,255,255,0.12)";
  g.beginPath();
  g.ellipse(x - r * 0.16, y - r * 0.05, r * 0.52, r * 0.12, 0, 0, TAU);
  g.fill();
  g.restore();
}

    g.strokeStyle = "rgba(255,150,60,0.75)"; g.lineWidth = 5; g.beginPath(); g.arc(0, 4, 84, 0.2, TAU - 0.2); g.stroke();
  } else {
    g.fillStyle = "rgba(36,23,54,0.88)";
    g.beginPath(); g.ellipse(0, 8, 66, 84, 0, 0, TAU); g.fill();
    g.fillStyle = "rgba(93,58,130,0.7)";
    g.beginPath(); g.moveTo(-40,-30); g.quadraticCurveTo(-104,0,-82,78); g.lineTo(-22,46); g.closePath(); g.moveTo(40,-30); g.quadraticCurveTo(104,0,82,78); g.lineTo(22,46); g.closePath(); g.fill();
    g.fillStyle = "#120d20"; g.beginPath(); g.arc(0, 8, 50, 0, TAU); g.fill();
  }
  g.fillStyle = pal.eye;
  g.shadowBlur = 14;

function drawGate(g, gate) {
  const pulse = 0.5 + Math.sin((gate.pulse || 0) * 5) * 0.5;
  const r = gate.r + pulse * 8;
  drawShadow(g, gate.x, gate.y + 38, 74, 18, 0.32);
  g.save();
  g.translate(gate.x, gate.y);
  g.shadowBlur = 28;
  g.shadowColor = "#f7c948";
  const grad = g.createRadialGradient(0, 0, 8, 0, 0, r);
  grad.addColorStop(0, "rgba(255,255,220,0.96)");
  grad.addColorStop(0.45, "rgba(247,201,72,0.65)");
  grad.addColorStop(1, "rgba(168,101,255,0.05)");
  g.fillStyle = grad;
  g.beginPath();
  g.ellipse(0, 0, r * 0.72, r, 0, 0, TAU);
  g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = "#fff1a8";
  g.lineWidth = 5;
  g.beginPath();
  g.ellipse(0, 0, r * 0.72, r, 0, 0, TAU);
  g.stroke();
  g.fillStyle = "#fff0c4";
  g.font = "bold 16px Microsoft YaHei, sans-serif";
  g.textAlign = "center";
  g.fillText("传送门", 0, r + 24);
  g.restore();
}

function drawChoiceCards(g, state) {
  const cards = state.choices;
  const fade = Util.clamp(1 - state.chooseT / 0.35, 0, 1);
  const pop = 1 + Math.max(0, state.chooseT - 0.25) * 2.2;
  const cardW = 146, cardH = 224, gap = 18;
  const total = cardW * 3 + gap * 2;
  const startX = (CONFIG.W - total) / 2;
  const y = CONFIG.H * 0.42 - cardH / 2;
  const FACTION_LABEL = { shot: "弹道", elem: "元素", summon: "召唤", surv: "生存" };

  // 背景遮罩
  g.save();
  g.globalAlpha = 0.72 * fade;
  g.fillStyle = "#05070a";
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.globalAlpha = fade;
  g.textAlign = "center";
  g.fillStyle = "#f5ecd9";
  g.font = "bold 30px Microsoft YaHei, sans-serif";
  g.fillText("选择一项强化", CONFIG.W / 2, y - 44);

  for (let i = 0; i < cards.length; i++) {
    const up = cards[i];
    const rar = RARITY[up.rarity];
    const cx = startX + i * (cardW + gap) + cardW / 2;
    // 弹出动画
    const cy = y + Math.sin((i + 0.5) * 0.9) * (1 - fade) * 40;
    g.save();
    g.translate(cx, cy);
    g.scale(pop, pop);
    // 稀有度外框发光
    g.shadowBlur = 22;
    g.shadowColor = rar.color;
    // 卡片主体
    g.fillStyle = "#1a2029";
    roundRect(g, -cardW / 2, 0, cardW, cardH, 12);
    g.fill();
    g.shadowBlur = 0;
    g.lineWidth = 3;
    g.strokeStyle = rar.color;
    roundRect(g, -cardW / 2, 0, cardW, cardH, 12);
    g.stroke();
    // 稀有度顶部色条
    g.fillStyle = rar.color;
    g.globalAlpha = 0.22;
    roundRect(g, -cardW / 2, 0, cardW, 46, 12);
    g.fill();
    g.globalAlpha = fade;
    // 图标圆底
    g.fillStyle = "rgba(0,0,0,0.35)";
    g.beginPath();
    g.arc(0, 74, 30, 0, TAU);
    g.fill();
    g.fillStyle = rar.color;
    g.font = "bold 32px Microsoft YaHei, sans-serif";
    g.fillText(up.icon, 0, 86);
    // 传说卡：金色粒子环绕（视觉稀缺性）
    if (up.rarity === "legendary") {
      const t = performance.now() * 0.004;
      for (let k = 0; k < 6; k++) {
        const ang = t + k * TAU / 6;
        g.fillStyle = "rgba(247,201,72,0.8)";
        g.beginPath();
        g.arc(Math.cos(ang) * 52, 74 + Math.sin(ang) * 52 * 0.35, 2.5, 0, TAU);
        g.fill();
      }
    }
    // 名称
    g.fillStyle = rar.color;
    g.font = "bold 22px Microsoft YaHei, sans-serif";
    g.fillText(up.name, 0, 132);
    // 稀有度标签
    g.fillStyle = rar.color;
    g.globalAlpha = 0.9;
    g.font = "12px Microsoft YaHei, sans-serif";
    g.fillText(rar.label, 0, 152);
    g.globalAlpha = fade;
    // 描述（两行）
    g.fillStyle = "#d8dde6";
    g.font = "14px Microsoft YaHei, sans-serif";
    wrapText(g, up.desc, 0, 180, cardW - 24, 20);
    // 流派标签
    g.fillStyle = "rgba(255,255,255,0.14)";
    roundRect(g, -34, 196, 68, 20, 10);
    g.fill();
    g.fillStyle = "#b9c2d0";
    g.font = "12px Microsoft YaHei, sans-serif";
    g.fillText(FACTION_LABEL[up.faction] || up.faction, 0, 210);
    g.restore();
  }
  // 底部提示
  g.fillStyle = "#8a94a3";
  g.font = "14px Microsoft YaHei, sans-serif";
  g.fillText("点击卡片选择 · 键盘 1/2/3", CONFIG.W / 2, y + cardH + 40);
  g.restore();
}
