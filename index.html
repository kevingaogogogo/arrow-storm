<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>箭雨 v2.0</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101812;
      color: #f4ead6;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      touch-action: none;
      user-select: none;
    }
    body {
      display: grid;
      place-items: center;
    }
    canvas {
      display: block;
      width: min(100vw, 56.25vh);
      height: min(177.777vw, 100vh);
      background: #101812;
    }
    #landscapeBlocker {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      background: #101812;
      color: #f4ead6;
      text-align: center;
      font-size: 22px;
      line-height: 1.6;
      letter-spacing: 1px;
      padding: 28px;
    }
    @media (orientation: landscape) {
      #landscapeBlocker { display: grid; }
    }
  </style>
</head>
<body>
  <canvas id="game" width="540" height="960" aria-label="箭雨 v2.0 游戏画布"></canvas>
  <div id="landscapeBlocker">请旋转设备为竖屏<br>箭雨 v2.0 仅支持竖屏飞行</div>
<script>
"use strict";

const CONFIG = {
  W: 540,
  H: 960,
  FIXED_DT: 1 / 60,
  PLAYER_Y: 960 * 0.82,
  PLAYER_R: 18,
  BASE_FLY_SPEED: 140,
  BASE_MOVE_SPEED: 320,
  BASE_FIRE_RATE: 2,
  BASE_ARROW_SPEED: 720,
  BASE_ARROW_DAMAGE: 10,
  BASE_RANGE: 900,
  WAVE_LEN: 250,
  GATE_EVERY: 250,
  ROAD_TOP_W: 205,
  ROAD_BOTTOM_W: 430,
  MAX_HP: 200,
  ENEMY_SCORE: 10,
  BOSS_SCORE: 160,
  INVINCIBLE_TIME: 0.8,
  COLORS: {
    bg: "#101812",
    grassFar: "#294126",
    grassNear: "#4d7b37",
    roadFar: "#504a42",
    roadNear: "#8b765c",
    roadEdge: "#b9aa89",
    purple: "#a865ff",
    purpleHot: "#eadcff",
    orange: "#ff9b35",
    red: "#e54d3c",
    blue: "#5fc6ff",
    gold: "#f7c948",
    wood: "#8b5a2b",
    ui: "#f5ecd9"
  }
};

const TAU = Math.PI * 2;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const Util = {
  clamp(v, a, b) { return Math.max(a, Math.min(b, v)); },
  rand(a, b) { return a + Math.random() * (b - a); },
  randi(a, b) { return Math.floor(Util.rand(a, b + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  dist2(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return dx * dx + dy * dy;
  },
  circleHit(a, b) {
    const r = a.r + b.r;
    return Util.dist2(a, b) <= r * r;
  },
  worldScale(y) {
    return Util.clamp(0.42 + y / CONFIG.H * 0.92, 0.42, 1.34);
  },
  roadWidth(y) {
    const t = Util.clamp(y / CONFIG.H, 0, 1);
    return CONFIG.ROAD_TOP_W + (CONFIG.ROAD_BOTTOM_W - CONFIG.ROAD_TOP_W) * t;
  },
  onRoadX(x, y, margin = 0) {
    return Math.abs(x - CONFIG.W / 2) <= Util.roadWidth(y) / 2 - margin;
  }
};

class AudioSystem {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = localStorage.getItem("arrowStormMuted") === "1";
  }
  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.16;
    this.master.connect(this.ctx.destination);
  }
  toggle() {
    this.ensure();
    this.muted = !this.muted;
    localStorage.setItem("arrowStormMuted", this.muted ? "1" : "0");
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.16, this.ctx.currentTime, 0.02);
  }
  tone(freq, dur, type = "sine", gain = 0.5, slide = 1) {
    this.ensure();
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  shoot() { this.tone(520, 0.06, "triangle", 0.18, 1.8); }
  hit() { this.tone(180, 0.08, "square", 0.12, 0.65); }
  upgrade() { this.tone(660, 0.12, "sine", 0.22, 1.7); setTimeout(() => this.tone(920, 0.1, "sine", 0.18, 1.35), 55); }
  chest() { this.tone(480, 0.12, "triangle", 0.25, 1.5); setTimeout(() => this.tone(880, 0.16, "triangle", 0.22, 1.7), 90); }
  boss() { this.tone(110, 0.45, "sawtooth", 0.3, 0.55); }
  death() { this.tone(220, 0.5, "sawtooth", 0.25, 0.25); }
  sword() { this.tone(760, 0.08, "triangle", 0.12, 1.25); }
}

const audio = new AudioSystem();

class Pool {
  constructor(Type) {
    this.Type = Type;
    this.items = [];
  }
  get(...args) {
    let item = this.items.find(e => !e.active);
    if (!item) {
      item = new this.Type();
      this.items.push(item);
    }
    item.init(...args);
    return item;
  }
  active() {
    return this.items.filter(e => e.active);
  }
}

class Particle {
  constructor() { this.active = false; }
  init(x, y, vx, vy, life, color, size, text, crit) {
    this.active = true;
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
    this.text = text || "";
    this.crit = !!crit;
  }
  update(dt) {
    this.life -= dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += (this.text ? 20 : 95) * dt;
    if (this.life <= 0) this.active = false;
  }
  render(g) {
    const a = Util.clamp(this.life / this.maxLife, 0, 1);
    g.save();
    g.globalAlpha = a;
    if (this.text) {
      g.font = `${this.crit ? 30 : 21}px Microsoft YaHei, sans-serif`;
      g.textAlign = "center";
      g.lineWidth = this.crit ? 5 : 3;
      g.strokeStyle = "rgba(61,30,7,0.85)";
      g.fillStyle = this.crit ? "#ffd56a" : this.color;
      g.strokeText(this.text, this.x, this.y);
      g.fillText(this.text, this.x, this.y);
    } else {
      g.fillStyle = this.color;
      g.beginPath();
      g.arc(this.x, this.y, this.size * (0.5 + a), 0, TAU);
      g.fill();
    }
    g.restore();
  }
}

class Arrow {
  constructor() { this.active = false; }
  init(x, y, angle, damage, range, pierce, critChance, fire, ice) {
    this.active = true;
    this.x = x; this.y = y;
    this.lastX = x; this.lastY = y;
    this.vx = Math.sin(angle) * CONFIG.BASE_ARROW_SPEED;
    this.vy = -Math.cos(angle) * CONFIG.BASE_ARROW_SPEED;
    this.damage = damage;
    this.range = range;
    this.travel = 0;
    this.r = 7;
    this.pierce = pierce;
    this.critChance = critChance;
    this.fire = fire;
    this.ice = ice;
    this.hitIds = new Set();
  }
  update(dt, game) {
    this.lastX = this.x; this.lastY = this.y;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.travel += Math.hypot(this.vx * dt, this.vy * dt);
    if (this.y < -80 || this.travel > this.range) this.active = false;
    for (const e of game.enemies.active()) {
      if (!this.active || e.dead || this.hitIds.has(e.id)) continue;
      if (Util.circleHit(this, e)) {
        this.hitIds.add(e.id);
        const crit = Math.random() < this.critChance;
        const dmg = this.damage * (crit ? 2 : 1);
        e.takeDamage(dmg, crit, game, this.fire, this.ice);
        this.pierce -= 1;
        if (this.pierce < 0) this.active = false;
      }
    }
  }
  render(g) {
    g.save();
    g.strokeStyle = "rgba(255,255,255,0.78)";
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(this.lastX, this.lastY + 10);
    g.lineTo(this.x, this.y + 26);
    g.stroke();
    g.shadowBlur = 18;
    g.shadowColor = CONFIG.COLORS.purple;
    g.strokeStyle = CONFIG.COLORS.purpleHot;
    g.lineWidth = 5;
    g.beginPath();
    g.moveTo(this.x, this.y + 12);
    g.lineTo(this.x, this.y - 18);
    g.stroke();
    g.fillStyle = CONFIG.COLORS.purple;
    g.beginPath();
    g.moveTo(this.x, this.y - 24);
    g.lineTo(this.x - 7, this.y - 9);
    g.lineTo(this.x + 7, this.y - 9);
    g.closePath();
    g.fill();
    g.restore();
  }
}

class Bullet {
  constructor() { this.active = false; }
  init(x, y, vx, vy, r = 7, damage = 10) {
    this.active = true;
    this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.r = r; this.damage = damage;
  }
  update(dt, game) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.x < -40 || this.x > CONFIG.W + 40 || this.y < -60 || this.y > CONFIG.H + 80) this.active = false;
    if (this.active && game.player.canBeHit() && Util.circleHit(this, game.player)) {
      this.active = false;
      game.player.hurt(this.damage, game, 0, 36);
    }
  }
  render(g) {
    g.save();
    g.shadowBlur = 13;
    g.shadowColor = "#ff7043";
    g.fillStyle = "#ffb15b";
    g.beginPath();
    g.arc(this.x, this.y, this.r, 0, TAU);
    g.fill();
    g.restore();
  }
}

let enemyId = 1;
class Enemy {
  constructor() { this.active = false; }
  init(type, x, y, wave) {
    this.active = true;
    this.id = enemyId++;
    this.type = type;
    this.x = x; this.y = y;
    this.wave = wave;
    this.dead = false;
    this.t = Math.random() * 10;
    this.shootT = Util.rand(0.4, 1.8);
    this.fireT = 0;
    this.iceT = 0;
    this.drift = Util.rand(-1, 1);
    this.isBoss = type === "boss";
    const hp = { minion: 20, archer: 30, tank: 80, flyer: 25, boss: 600 + wave * 250 }[type];
    this.hp = hp;
    this.maxHp = hp;
    this.r = this.isBoss ? 72 : type === "tank" ? 28 : 21;
    this.baseSpeed = type === "tank" ? 18 : type === "flyer" ? 22 : 0;
    this.bossRush = 0;
  }
  takeDamage(amount, crit, game, fire, ice) {
    this.hp -= amount;
    if (fire) this.fireT = 2;
    if (ice) this.iceT = 2;
    game.damageNumber(this.x, this.y - this.r - 12, Math.round(amount), crit);
    audio.hit();
    for (let i = 0; i < 4; i++) game.particles.get(this.x, this.y, Util.rand(-55, 55), Util.rand(-90, -20), 0.35, crit ? "#ffd56a" : "#fb8840", Util.rand(3, 7));
    if (this.hp <= 0) this.kill(game);
  }
  kill(game) {
    if (this.dead) return;
    this.dead = true;
    this.active = false;
    game.kills += 1;
    game.score += this.isBoss ? CONFIG.BOSS_SCORE : CONFIG.ENEMY_SCORE;
    for (let i = 0; i < (this.isBoss ? 34 : 12); i++) {
      game.particles.get(this.x, this.y, Util.rand(-130, 130), Util.rand(-180, 60), Util.rand(0.35, 0.9), this.isBoss ? "#f7c948" : "#d99a48", Util.rand(3, 10));
    }
    if (this.isBoss) {
      game.boss = null;
      game.spawnChest();
    }
  }
  update(dt, game) {
    this.t += dt;
    const scroll = game.flySpeed * dt;
    this.y += scroll;
    if (this.fireT > 0) {
      this.fireT -= dt;
      this.takeDot(5 * dt, game, "#e54d3c");
    }
    if (this.iceT > 0) this.iceT -= dt;
    const slow = this.iceT > 0 ? 0.6 : 1;
    if (this.type === "tank") this.y += this.baseSpeed * slow * dt;
    if (this.type === "flyer") {
      this.x += Math.sin(this.t * 2.4 + this.drift) * 55 * dt;
      this.y += Math.cos(this.t * 1.8) * 12 * dt;
    }
    if (this.type === "archer") {
      this.shootT -= dt;
      if (this.shootT <= 0) {
        this.shootT = Util.rand(1.35, 2.25);
        this.shootAtPlayer(game, 160);
      }
    }
    if (this.isBoss) this.updateBoss(dt, game, slow);
    if (this.y > CONFIG.H + this.r + 80) this.active = false;
    if (!this.dead && game.player.canBeHit() && Util.circleHit(this, game.player)) {
      game.player.hurt(15, game, Math.sign(game.player.x - this.x) * 90, 50);
    }
  }
  takeDot(amount, game, color) {
    this.hp -= amount;
    if (Math.random() < 0.06) game.particles.get(this.x, this.y - this.r, Util.rand(-15, 15), -45, 0.35, color, 4);
    if (this.hp <= 0) this.kill(game);
  }
  shootAtPlayer(game, speed) {
    const dx = game.player.x - this.x;
    const dy = game.player.y - this.y;
    const len = Math.max(1, Math.hypot(dx, dy));
    game.bullets.get(this.x, this.y + this.r * 0.4, dx / len * speed, dy / len * speed);
  }
  updateBoss(dt, game, slow) {
    this.x = CONFIG.W / 2 + Math.sin(this.t * 0.7) * 90;
    this.y = Math.min(this.y + 18 * slow * dt, 190);
    this.shootT -= dt;
    if (this.shootT <= 0) {
      this.shootT = 1.15;
      for (let i = -3; i <= 3; i++) {
        const a = Math.PI / 2 + i * 0.19 + Math.sin(this.t) * 0.1;
        game.bullets.get(this.x, this.y + 35, Math.cos(a) * 185, Math.sin(a) * 185, 8, 10);
      }
      if (Math.random() < 0.45) {
        const sx = Util.rand(CONFIG.W / 2 - 130, CONFIG.W / 2 + 130);
        game.enemies.get("minion", sx, this.y + 85, game.wave);
      }
      if (Math.random() < 0.22) this.bossRush = 0.45;
    }
    if (this.bossRush > 0) {
      this.bossRush -= dt;
      this.y += 160 * dt;
      if (this.y > 320) this.y = 185;
    }
  }
  render(g) {
    const s = Util.worldScale(this.y);
    drawShadow(g, this.x, this.y + this.r * 0.55, this.r * 1.25 * s, this.r * 0.42 * s, this.isBoss ? 0.42 : 0.28);
    if (this.type !== "flyer") drawStonePlatform(g, this.x, this.y + this.r * 0.72, this.r * 1.35 * s);
    g.save();
    g.translate(this.x, this.y);
    g.scale(s, s);
    if (this.iceT > 0) {
      g.shadowBlur = 20;
      g.shadowColor = CONFIG.COLORS.blue;
    } else if (this.fireT > 0) {
      g.shadowBlur = 18;
      g.shadowColor = CONFIG.COLORS.red;
    }
    if (this.isBoss) drawBoss(g, this);
    else if (this.type === "tank") drawTank(g);
    else if (this.type === "archer") drawArcher(g);
    else if (this.type === "flyer") drawFlyer(g, this.t);
    else drawMinion(g);
    g.restore();
    if (!this.isBoss) {
      drawSmallHp(g, this.x, this.y - this.r * s - 16, 48, this.hp / this.maxHp);
    }
  }
}

class Sword {
  constructor(index, game) {
    this.index = index;
    this.angle = index * TAU / 3;
    this.cooldown = Util.rand(0, 0.4);
    this.target = null;
    this.slashT = 0;
    this.x = game.player.x;
    this.y = game.player.y;
  }
  update(dt, game) {
    const n = Math.max(1, game.player.swords.length);
    this.angle += 3.2 * dt;
    const orbit = 42;
    this.x = game.player.x + Math.cos(this.angle + this.index * TAU / n) * orbit;
    this.y = game.player.y + Math.sin(this.angle + this.index * TAU / n) * orbit * 0.45;
    this.cooldown -= dt;
    if (this.cooldown <= 0) {
      let best = null;
      let bestD = 999999;
      for (const e of game.enemies.active()) {
        if (e.dead) continue;
        const d = Util.dist2(this, e);
        if (d < bestD && d < 260 * 260) { best = e; bestD = d; }
      }
      if (best) {
        best.takeDamage(15, false, game, false, false);
        this.target = { x: best.x, y: best.y };
        this.slashT = 0.12;
        audio.sword();
      }
      this.cooldown = 0.8;
    }
    if (this.slashT > 0) this.slashT -= dt;
  }
  render(g) {
    g.save();
    g.shadowBlur = 15;
    g.shadowColor = "#d9f7ff";
    g.translate(this.x, this.y);
    g.rotate(this.angle + Math.PI / 2);
    g.fillStyle = "#d9f7ff";
    g.fillRect(-3, -17, 6, 28);
    g.fillStyle = "#88d8ff";
    g.beginPath();
    g.moveTo(0, -25);
    g.lineTo(-7, -13);
    g.lineTo(7, -13);
    g.closePath();
    g.fill();
    g.fillStyle = "#ffe08a";
    g.fillRect(-8, 8, 16, 4);
    g.restore();
    if (this.slashT > 0 && this.target) {
      g.save();
      g.globalAlpha = this.slashT / 0.12;
      g.strokeStyle = "#d9f7ff";
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(this.x, this.y);
      g.lineTo(this.target.x, this.target.y);
      g.stroke();
      g.restore();
    }
  }
}

class Player {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = CONFIG.W / 2;
    this.y = CONFIG.PLAYER_Y;
    this.r = CONFIG.PLAYER_R;
    this.hp = 100;
    this.maxHp = 100;
    this.moveSpeed = CONFIG.BASE_MOVE_SPEED;
    this.damage = CONFIG.BASE_ARROW_DAMAGE;
    this.fireRate = CONFIG.BASE_FIRE_RATE;
    this.range = CONFIG.BASE_RANGE;
    this.arrowCount = 1;
    this.pierce = 0;
    this.crit = 0;
    this.fire = false;
    this.ice = false;
    this.swords = [];
    this.inv = 0;
    this.fireT = 0;
    this.knockX = 0;
    this.knockY = 0;
  }
  canBeHit() { return this.inv <= 0; }
  hurt(dmg, game, kx, ky) {
    if (!this.canBeHit()) return;
    this.hp -= dmg;
    this.inv = CONFIG.INVINCIBLE_TIME;
    this.knockX += kx;
    this.knockY += ky;
    for (let i = 0; i < 12; i++) game.particles.get(this.x, this.y, Util.rand(-90, 90), Util.rand(-120, 30), 0.55, "#ff7043", Util.rand(3, 7));
    if (this.hp <= 0) game.gameOver();
  }
  update(dt, game) {
    let targetX = this.x;
    if (game.input.touching) targetX = game.input.touchX;
    else targetX += (game.input.right - game.input.left) * this.moveSpeed * dt;
    this.x += (targetX - this.x) * (game.input.touching ? Math.min(1, dt * 18) : 1);
    this.x += this.knockX * dt;
    this.y += this.knockY * dt;
    this.knockX *= Math.pow(0.05, dt);
    this.knockY *= Math.pow(0.05, dt);
    this.x = Util.clamp(this.x, 60, CONFIG.W - 60);
    this.y = Util.clamp(this.y, CONFIG.H * 0.73, CONFIG.H * 0.88);
    if (this.inv > 0) this.inv -= dt;
    this.fireT -= dt;
    if (this.fireT <= 0) {
      this.fireT += 1 / this.fireRate;
      game.fireArrows();
    }
    for (const sword of this.swords) sword.update(dt, game);
  }
  render(g) {
    const flash = this.inv > 0 && Math.floor(this.inv * 16) % 2 === 0;
    drawShadow(g, this.x, this.y + 18, 28, 10, 0.4);
    if (flash) return;
    g.save();
    g.shadowBlur = 28;
    g.shadowColor = CONFIG.COLORS.purple;
    const grad = g.createRadialGradient(this.x - 6, this.y - 8, 4, this.x, this.y, 26);
    grad.addColorStop(0, "#fff7ff");
    grad.addColorStop(0.35, "#b77cff");
    grad.addColorStop(1, "#5e34ba");
    g.fillStyle = grad;
    g.beginPath();
    g.arc(this.x, this.y, this.r, 0, TAU);
    g.fill();
    g.strokeStyle = "#eadcff";
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(this.x, this.y - 27);
    g.lineTo(this.x, this.y - 52);
    g.stroke();
    g.fillStyle = "#e8d8ff";
    g.beginPath();
    g.moveTo(this.x, this.y - 60);
    g.lineTo(this.x - 8, this.y - 43);
    g.lineTo(this.x + 8, this.y - 43);
    g.closePath();
    g.fill();
    g.restore();
    for (const sword of this.swords) sword.render(g);
  }
}

const UPGRADES = [
  { id: "damage", name: "强弓", desc: "弓箭伤害 +10%", apply: g => { g.player.damage *= 1.1; } },
  { id: "rate", name: "疾射", desc: "射击频率 +10%", apply: g => { g.player.fireRate = Math.min(6, g.player.fireRate * 1.1); } },
  { id: "range", name: "远射", desc: "射击距离 +10%", apply: g => { g.player.range = Math.min(1500, g.player.range * 1.1); } },
  { id: "speed", name: "横移", desc: "横移速度 +10%", apply: g => { g.player.moveSpeed = Math.min(700, g.player.moveSpeed * 1.1); } },
  { id: "hp", name: "生命", desc: "生命值 +24", apply: g => { g.player.maxHp = Math.min(200, g.player.maxHp + 24); g.player.hp = Math.min(g.player.maxHp, g.player.hp + 24); } },
  { id: "multi", name: "多重箭", desc: "箭矢数量 +1", apply: g => { g.player.arrowCount = Math.min(5, g.player.arrowCount + 1); } },
  { id: "pierce", name: "穿透", desc: "穿透 +1", apply: g => { g.player.pierce = Math.min(3, g.player.pierce + 1); } },
  { id: "crit", name: "会心", desc: "暴击率 +10%", apply: g => { g.player.crit = Math.min(0.6, g.player.crit + 0.1); } },
  { id: "fire", name: "火焰箭", desc: "灼烧 2 秒", apply: g => { g.player.fire = true; } },
  { id: "ice", name: "冰霜箭", desc: "减速 40%", apply: g => { g.player.ice = true; } },
  { id: "sword", name: "御剑", desc: "飞剑 +1", apply: g => { if (g.player.swords.length < 3) g.player.swords.push(new Sword(g.player.swords.length, g)); } },
  { id: "fly", name: "骑剑加速", desc: "飞行速度 +12%", apply: g => { g.flyBonus = Math.min(0.6, g.flyBonus + 0.12); } }
];

function rollGate() {
  const a = Util.pick(UPGRADES);
  let b = Util.pick(UPGRADES);
  while (b.id === a.id) b = Util.pick(UPGRADES);
  return [a, b];
}

class Game {
  constructor() {
    this.player = new Player();
    this.arrows = new Pool(Arrow);
    this.enemies = new Pool(Enemy);
    this.bullets = new Pool(Bullet);
    this.particles = new Pool(Particle);
    this.input = { left: 0, right: 0, touching: false, touchX: CONFIG.W / 2 };
    this.state = "MENU";
    this.highScore = Number(localStorage.getItem("arrowStormHighScore") || "0");
    this.decor = [];
    this.leaves = [];
    this.gate = null;
    this.chest = null;
    this.message = "";
    this.messageT = 0;
    this.resetWorld();
  }
  resetWorld() {
    this.distance = 0;
    this.score = 0;
    this.kills = 0;
    this.wave = 1;
    this.spawnedWave = 0;
    this.nextGateM = CONFIG.GATE_EVERY;
    this.flyBonus = 0;
    this.flySpeed = CONFIG.BASE_FLY_SPEED;
    this.boss = null;
    this.gate = null;
    this.chest = null;
    this.decor.length = 0;
    this.leaves.length = 0;
    for (let i = 0; i < 38; i++) this.decor.push(this.makeDecor(Util.rand(0, CONFIG.H), Math.random() < 0.58 ? "tree" : Math.random() < 0.78 ? "rock" : "fence"));
    for (let i = 0; i < 22; i++) this.leaves.push({ x: Util.rand(0, CONFIG.W), y: Util.rand(0, CONFIG.H), s: Util.rand(0.4, 1.3), a: Util.rand(0, TAU) });
  }
  start() {
    audio.ensure();
    this.state = "PLAY";
    this.player.reset();
    this.arrows.items.length = 0;
    this.enemies.items.length = 0;
    this.bullets.items.length = 0;
    this.particles.items.length = 0;
    this.resetWorld();
    this.spawnWave();
  }
  gameOver() {
    if (this.state !== "PLAY") return;
    this.state = "GAME_OVER";
    audio.death();
    this.highScore = Math.max(this.highScore, Math.floor(this.distance));
    localStorage.setItem("arrowStormHighScore", String(this.highScore));
  }
  getFlySpeed() {
    return CONFIG.BASE_FLY_SPEED * (1 + this.flyBonus);
  }
  update(dt) {
    if (this.state !== "PLAY") {
      this.updateBackdrop(dt);
      for (const p of this.particles.active()) p.update(dt);
      return;
    }
    this.flySpeed = this.getFlySpeed();
    this.distance += this.flySpeed * dt / 3;
    this.wave = Math.floor(this.distance / CONFIG.WAVE_LEN) + 1;
    if (this.wave > this.spawnedWave && !this.boss) this.spawnWave();
    if (this.distance >= this.nextGateM && !this.gate) this.spawnGate();
    this.updateBackdrop(dt);
    this.player.update(dt, this);
    for (const a of this.arrows.active()) a.update(dt, this);
    for (const e of this.enemies.active()) e.update(dt, this);
    for (const b of this.bullets.active()) b.update(dt, this);
    for (const p of this.particles.active()) p.update(dt);
    this.updateGate(dt);
    this.updateChest(dt);
    if (this.messageT > 0) this.messageT -= dt;
  }
  updateBackdrop(dt) {
    const scroll = this.getFlySpeed() * dt;
    for (const d of this.decor) {
      d.y += scroll * d.layer;
      if (d.y > CONFIG.H + 70) Object.assign(d, this.makeDecor(Util.rand(-130, -30), Math.random() < 0.56 ? "tree" : Math.random() < 0.76 ? "rock" : "fence"));
    }
    for (const l of this.leaves) {
      l.y += scroll * 0.35 + l.s * 12 * dt;
      l.x += Math.sin(l.a + performance.now() * 0.001) * 12 * dt;
      l.a += dt;
      if (l.y > CONFIG.H + 20) { l.y = -20; l.x = Util.rand(0, CONFIG.W); }
    }
  }
  makeDecor(y, type) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const road = Util.roadWidth(y);
    return {
      type,
      y,
      x: CONFIG.W / 2 + side * (road / 2 + Util.rand(22, 105)),
      layer: Util.rand(0.75, 1.08),
      rot: Util.rand(-0.25, 0.25),
      tone: Math.random()
    };
  }
  spawnWave() {
    this.spawnedWave = this.wave;
    if (this.wave % 5 === 0) {
      this.boss = this.enemies.get("boss", CONFIG.W / 2, -95, this.wave);
      audio.boss();
      this.flashMessage(`第 ${this.wave} 波 BOSS`);
      return;
    }
    const count = Util.randi(4, 8);
    const types = ["minion", "minion", "archer", "tank", "flyer"];
    for (let i = 0; i < count; i++) {
      const y = -80 - i * Util.rand(44, 74);
      const roadW = Util.roadWidth(Math.max(40, y + CONFIG.H * 0.45));
      const x = CONFIG.W / 2 + Util.rand(-roadW * 0.36, roadW * 0.36);
      this.enemies.get(Util.pick(types), x, y, this.wave);
    }
  }
  spawnGate() {
    const [left, right] = rollGate();
    this.gate = {
      y: -90,
      passed: false,
      left: { x: CONFIG.W / 2 - 105, up: left, r: 54 },
      right: { x: CONFIG.W / 2 + 105, up: right, r: 54 }
    };
    this.nextGateM += CONFIG.GATE_EVERY;
  }
  updateGate(dt) {
    if (!this.gate) return;
    this.gate.y += this.flySpeed * dt;
    const gy = this.gate.y;
    for (const side of [this.gate.left, this.gate.right]) {
      const c = { x: side.x, y: gy, r: side.r };
      if (!this.gate.passed && Util.circleHit(this.player, c)) {
        this.applyUpgrade(side.up);
        this.gate.passed = true;
        this.gate = null;
        return;
      }
    }
    if (gy > CONFIG.H + 90) this.gate = null;
  }
  applyUpgrade(up) {
    up.apply(this);
    this.flashMessage(`${up.name}：${up.desc}`);
    audio.upgrade();
    for (let i = 0; i < 22; i++) this.particles.get(this.player.x, this.player.y, Util.rand(-110, 110), Util.rand(-170, -30), 0.7, "#a865ff", Util.rand(3, 8));
  }
  spawnChest() {
    this.chest = { x: CONFIG.W / 2, y: -60, r: 34 };
  }
  updateChest(dt) {
    if (!this.chest) return;
    this.chest.y += this.flySpeed * dt;
    if (Util.circleHit(this.player, this.chest)) {
      const reward = Util.randi(0, 2);
      if (reward === 0) {
        this.player.damage *= 1.08;
        this.player.fireRate = Math.min(6, this.player.fireRate * 1.06);
        this.player.moveSpeed = Math.min(700, this.player.moveSpeed * 1.06);
        this.flashMessage("宝箱：全属性提升");
      } else if (reward === 1) {
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.player.maxHp * 0.4);
        this.flashMessage("宝箱：回复 40%");
      } else {
        this.score += 300;
        this.flashMessage("宝箱：金币 +300");
      }
      audio.chest();
      for (let i = 0; i < 35; i++) this.particles.get(this.chest.x, this.chest.y, Util.rand(-150, 150), Util.rand(-190, 40), 0.9, "#f7c948", Util.rand(4, 10));
      this.chest = null;
    } else if (this.chest.y > CONFIG.H + 80) this.chest = null;
  }
  fireArrows() {
    const n = this.player.arrowCount;
    const spread = n === 1 ? 0 : 0.34;
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0 : (i / (n - 1) - 0.5) * spread;
      this.arrows.get(this.player.x, this.player.y - 36, t, this.player.damage, this.player.range, this.player.pierce, this.player.crit, this.player.fire, this.player.ice);
    }
    audio.shoot();
  }
  damageNumber(x, y, amount, crit) {
    this.particles.get(x, y, Util.rand(-18, 18), -78, 0.72, CONFIG.COLORS.orange, 1, String(amount), crit);
  }
  flashMessage(text) {
    this.message = text;
    this.messageT = 1.8;
  }
  render(g) {
    drawWorld(g, this);
    if (this.gate) drawGate(g, this.gate);
    if (this.chest) drawChest(g, this.chest);
    const renderables = [];
    for (const e of this.enemies.active()) renderables.push(e);
    renderables.sort((a, b) => a.y - b.y);
    for (const e of renderables) e.render(g);
    for (const a of this.arrows.active()) a.render(g);
    for (const b of this.bullets.active()) b.render(g);
    this.player.render(g);
    for (const p of this.particles.active()) p.render(g);
    drawUI(g, this);
  }
}

const game = new Game();

function drawWorld(g, state) {
  const grad = g.createLinearGradient(0, 0, 0, CONFIG.H);
  grad.addColorStop(0, CONFIG.COLORS.grassFar);
  grad.addColorStop(1, CONFIG.COLORS.grassNear);
  g.fillStyle = grad;
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.save();
  g.globalAlpha = 0.5;
  for (let i = 0; i < 50; i++) {
    const y = (i * 42 + (state.distance * 2.2) % 42) - 42;
    g.strokeStyle = i % 2 ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.05)";
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(CONFIG.W, y + 18);
    g.stroke();
  }
  g.restore();
  g.fillStyle = CONFIG.COLORS.roadFar;
  g.beginPath();
  g.moveTo(CONFIG.W / 2 - CONFIG.ROAD_TOP_W / 2, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_TOP_W / 2, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_BOTTOM_W / 2, CONFIG.H);
  g.lineTo(CONFIG.W / 2 - CONFIG.ROAD_BOTTOM_W / 2, CONFIG.H);
  g.closePath();
  g.fill();
  const roadGrad = g.createLinearGradient(0, 0, 0, CONFIG.H);
  roadGrad.addColorStop(0, CONFIG.COLORS.roadFar);
  roadGrad.addColorStop(1, CONFIG.COLORS.roadNear);
  g.fillStyle = roadGrad;
  g.beginPath();
  g.moveTo(CONFIG.W / 2 - CONFIG.ROAD_TOP_W / 2 + 12, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_TOP_W / 2 - 12, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_BOTTOM_W / 2 - 20, CONFIG.H);
  g.lineTo(CONFIG.W / 2 - CONFIG.ROAD_BOTTOM_W / 2 + 20, CONFIG.H);
  g.closePath();
  g.fill();
  g.strokeStyle = CONFIG.COLORS.roadEdge;
  g.lineWidth = 5;
  g.beginPath();
  g.moveTo(CONFIG.W / 2 - CONFIG.ROAD_TOP_W / 2, 0);
  g.lineTo(CONFIG.W / 2 - CONFIG.ROAD_BOTTOM_W / 2, CONFIG.H);
  g.moveTo(CONFIG.W / 2 + CONFIG.ROAD_TOP_W / 2, 0);
  g.lineTo(CONFIG.W / 2 + CONFIG.ROAD_BOTTOM_W / 2, CONFIG.H);
  g.stroke();
  for (const d of [...state.decor].sort((a, b) => a.y - b.y)) drawDecor(g, d);
  drawLeaves(g, state.leaves);
}

function drawDecor(g, d) {
  const s = Util.worldScale(d.y) * (d.type === "tree" ? 1 : 0.75);
  g.save();
  g.translate(d.x, d.y);
  g.rotate(d.rot);
  drawShadow(g, 0, 16 * s, 18 * s, 7 * s, 0.25);
  if (d.type === "tree") {
    g.fillStyle = "#5c3b26";
    g.fillRect(-5 * s, -2 * s, 10 * s, 28 * s);
    g.fillStyle = d.tone > 0.5 ? "#2f6b35" : "#3f813b";
    g.beginPath();
    g.moveTo(0, -42 * s);
    g.lineTo(-28 * s, 8 * s);
    g.lineTo(24 * s, 12 * s);
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(255,255,255,0.12)";
    g.beginPath();
    g.moveTo(-4 * s, -34 * s);
    g.lineTo(-18 * s, -2 * s);
    g.lineTo(3 * s, -8 * s);
    g.closePath();
    g.fill();
  } else if (d.type === "rock") {
    g.fillStyle = d.tone > 0.5 ? "#7a8178" : "#646b66";
    g.beginPath();
    g.moveTo(-20 * s, 5 * s);
    g.lineTo(-8 * s, -16 * s);
    g.lineTo(15 * s, -11 * s);
    g.lineTo(24 * s, 7 * s);
    g.lineTo(7 * s, 17 * s);
    g.closePath();
    g.fill();
  } else {
    g.strokeStyle = "#7b5632";
    g.lineWidth = 6 * s;
    g.beginPath();
    g.moveTo(-28 * s, -8 * s);
    g.lineTo(28 * s, 8 * s);
    g.moveTo(-20 * s, -18 * s);
    g.lineTo(-20 * s, 14 * s);
    g.moveTo(14 * s, -8 * s);
    g.lineTo(14 * s, 24 * s);
    g.stroke();
  }
  g.restore();
}

function drawLeaves(g, leaves) {
  g.save();
  for (const l of leaves) {
    g.translate(l.x, l.y);
    g.rotate(l.a);
    g.fillStyle = "rgba(205,151,61,0.38)";
    g.beginPath();
    g.ellipse(0, 0, 5 * l.s, 2.5 * l.s, 0, 0, TAU);
    g.fill();
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
  g.restore();
}

function drawShadow(g, x, y, rx, ry, alpha) {
  g.save();
  g.fillStyle = `rgba(0,0,0,${alpha})`;
  g.beginPath();
  g.ellipse(x, y, rx, ry, 0, 0, TAU);
  g.fill();
  g.restore();
}

function drawStonePlatform(g, x, y, r) {
  g.save();
  g.fillStyle = "#656760";
  g.beginPath();
  g.ellipse(x, y, r, r * 0.34, 0, 0, TAU);
  g.fill();
  g.fillStyle = "rgba(255,255,255,0.12)";
  g.beginPath();
  g.ellipse(x - r * 0.16, y - r * 0.05, r * 0.52, r * 0.12, 0, 0, TAU);
  g.fill();
  g.restore();
}

function drawMinion(g) {
  g.fillStyle = "#7e3d32";
  g.beginPath();
  g.arc(0, 0, 20, 0, TAU);
  g.fill();
  g.fillStyle = "#d9b37a";
  g.fillRect(-10, -7, 6, 5);
  g.fillRect(4, -7, 6, 5);
}

function drawArcher(g) {
  g.fillStyle = "#664f36";
  g.beginPath();
  g.arc(0, 0, 20, 0, TAU);
  g.fill();
  g.strokeStyle = "#d2a15c";
  g.lineWidth = 4;
  g.beginPath();
  g.arc(16, -2, 16, -Math.PI / 2, Math.PI / 2);
  g.stroke();
}

function drawTank(g) {
  g.fillStyle = "#6f6f69";
  g.beginPath();
  g.arc(0, 0, 28, 0, TAU);
  g.fill();
  g.fillStyle = "#4d524e";
  g.fillRect(-18, -6, 36, 18);
}

function drawFlyer(g, t) {
  g.fillStyle = "#3d5169";
  g.beginPath();
  g.arc(0, Math.sin(t * 8) * 2, 20, 0, TAU);
  g.fill();
  g.fillStyle = "#6eb1d8";
  g.beginPath();
  g.ellipse(-24, -3, 16, 7, Math.sin(t * 12) * 0.4, 0, TAU);
  g.ellipse(24, -3, 16, 7, -Math.sin(t * 12) * 0.4, 0, TAU);
  g.fill();
}

function drawBoss(g, e) {
  g.fillStyle = "#4c2632";
  g.beginPath();
  g.arc(0, 0, 72, 0, TAU);
  g.fill();
  g.fillStyle = "#7b3340";
  g.beginPath();
  g.moveTo(-68, -16);
  g.lineTo(-112, 20);
  g.lineTo(-50, 32);
  g.closePath();
  g.moveTo(68, -16);
  g.lineTo(112, 20);
  g.lineTo(50, 32);
  g.closePath();
  g.fill();
  g.fillStyle = "#f1c45f";
  g.beginPath();
  g.moveTo(-26, -46);
  g.lineTo(-10, -78);
  g.lineTo(2, -42);
  g.lineTo(18, -78);
  g.lineTo(28, -44);
  g.closePath();
  g.fill();
  g.fillStyle = "#ff9b35";
  g.fillRect(-32, -13, 18, 9);
  g.fillRect(14, -13, 18, 9);
}

function drawSmallHp(g, x, y, w, p) {
  g.save();
  g.fillStyle = "rgba(0,0,0,0.45)";
  g.fillRect(x - w / 2, y, w, 5);
  g.fillStyle = p > 0.45 ? "#72c95d" : "#e05f4c";
  g.fillRect(x - w / 2, y, w * Util.clamp(p, 0, 1), 5);
  g.restore();
}

function drawGate(g, gate) {
  for (const side of [gate.left, gate.right]) {
    const y = gate.y;
    const s = Util.worldScale(y);
    drawShadow(g, side.x, y + 36 * s, 50 * s, 13 * s, 0.3);
    g.save();
    g.translate(side.x, y);
    g.scale(s, s);
    g.fillStyle = "#5b351b";
    g.fillRect(-42, 34, 9, 52);
    g.fillRect(33, 34, 9, 52);
    g.fillStyle = CONFIG.COLORS.wood;
    g.strokeStyle = "#422614";
    g.lineWidth = 4;
    roundRect(g, -68, -34, 136, 74, 8);
    g.fill();
    g.stroke();
    g.fillStyle = "#c99651";
    g.fillRect(-58, -20, 116, 8);
    g.fillRect(-58, 8, 116, 8);
    g.fillStyle = "#fff0c4";
    g.textAlign = "center";
    g.font = "bold 22px Microsoft YaHei, sans-serif";
    g.fillText(side.up.name, 0, -3);
    g.font = "14px Microsoft YaHei, sans-serif";
    wrapText(g, side.up.desc, 0, 24, 112, 16);
    g.restore();
  }
}

function drawChest(g, c) {
  const s = Util.worldScale(c.y);
  drawShadow(g, c.x, c.y + 26 * s, 38 * s, 11 * s, 0.36);
  g.save();
  g.translate(c.x, c.y);
  g.scale(s, s);
  g.shadowBlur = 24;
  g.shadowColor = CONFIG.COLORS.gold;
  g.fillStyle = "#70431f";
  g.fillRect(-36, -7, 72, 38);
  g.fillStyle = CONFIG.COLORS.gold;
  g.beginPath();
  g.moveTo(-38, -8);
  g.quadraticCurveTo(0, -44, 38, -8);
  g.closePath();
  g.fill();
  g.fillStyle = "#fff1a8";
  g.fillRect(-6, -9, 12, 34);
  g.strokeStyle = "#432916";
  g.lineWidth = 4;
  g.strokeRect(-36, -7, 72, 38);
  g.restore();
}

function drawUI(g, state) {
  if (state.state === "PLAY") drawHud(g, state);
  if (state.messageT > 0) {
    g.save();
    g.globalAlpha = Math.min(1, state.messageT);
    g.textAlign = "center";
    g.font = "bold 24px Microsoft YaHei, sans-serif";
    g.lineWidth = 5;
    g.strokeStyle = "rgba(20,12,4,0.85)";
    g.fillStyle = "#fff0c4";
    g.strokeText(state.message, CONFIG.W / 2, 154);
    g.fillText(state.message, CONFIG.W / 2, 154);
    g.restore();
  }
  if (state.state === "MENU") drawMenu(g, state);
  if (state.state === "GAME_OVER") drawGameOver(g, state);
}

function drawHud(g, state) {
  g.save();
  g.fillStyle = "rgba(13,20,14,0.62)";
  roundRect(g, 14, 16, 178, 56, 8); g.fill();
  g.fillStyle = "#43202a";
  roundRect(g, 28, 31, 136, 14, 7); g.fill();
  g.fillStyle = "#de5952";
  roundRect(g, 28, 31, 136 * state.player.hp / state.player.maxHp, 14, 7); g.fill();
  g.fillStyle = CONFIG.COLORS.ui;
  g.font = "14px Microsoft YaHei, sans-serif";
  g.fillText(`${Math.ceil(state.player.hp)}/${state.player.maxHp}`, 70, 62);
  g.textAlign = "right";
  g.fillStyle = "rgba(13,20,14,0.62)";
  roundRect(g, 324, 16, 202, 92, 8); g.fill();
  g.fillStyle = CONFIG.COLORS.ui;
  g.font = "bold 18px Microsoft YaHei, sans-serif";
  g.fillText(`${Math.floor(state.distance)}m  ${state.score}分`, 510, 42);
  g.font = "15px Microsoft YaHei, sans-serif";
  g.fillText(`第 ${state.wave} 波  击杀 ${state.kills}`, 510, 66);
  g.fillText(`御剑 ${state.player.swords.length}/3`, 510, 90);
  drawMute(g, state);
  if (state.boss && state.boss.active) {
    const p = Util.clamp(state.boss.hp / state.boss.maxHp, 0, 1);
    g.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(g, 92, 86, 356, 24, 8); g.fill();
    g.fillStyle = "#7a1f2f";
    roundRect(g, 98, 92, 344, 12, 6); g.fill();
    g.fillStyle = "#ff4f50";
    roundRect(g, 98, 92, 344 * p, 12, 6); g.fill();
    g.textAlign = "center";
    g.fillStyle = "#fff0d0";
    g.font = "bold 16px Microsoft YaHei, sans-serif";
    g.fillText("BOSS", CONFIG.W / 2, 81);
  }
  g.restore();
}

function drawMute(g) {
  g.save();
  g.fillStyle = "rgba(13,20,14,0.62)";
  roundRect(g, 20, 82, 42, 32, 8); g.fill();
  g.fillStyle = CONFIG.COLORS.ui;
  g.font = "18px Arial";
  g.textAlign = "center";
  g.fillText(audio.muted ? "×" : "♪", 41, 104);
  g.restore();
}

function drawMenu(g, state) {
  g.save();
  g.fillStyle = "rgba(7,12,8,0.62)";
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.textAlign = "center";
  g.shadowBlur = 24;
  g.shadowColor = CONFIG.COLORS.purple;
  g.fillStyle = "#f8e9ff";
  g.font = "bold 70px Microsoft YaHei, sans-serif";
  g.fillText("箭雨", CONFIG.W / 2, 250);
  g.shadowBlur = 0;
  g.fillStyle = "#d4c6af";
  g.font = "20px Microsoft YaHei, sans-serif";
  g.fillText("v2.0  自动飞行 · 左右穿门 · 箭剑齐发", CONFIG.W / 2, 292);
  drawButton(g, CONFIG.W / 2 - 105, 376, 210, 62, "开始");
  g.fillStyle = "#f1dfbf";
  g.font = "18px Microsoft YaHei, sans-serif";
  g.fillText(`最高分：${state.highScore}m`, CONFIG.W / 2, 478);
  g.font = "16px Microsoft YaHei, sans-serif";
  const lines = ["←→ / AD 控制横移，触摸拖拽控制角色 X", "每 250m 穿过左/右木牌获得对应升级", "每 5 波 Boss，击杀后穿过金色宝箱拿大奖励"];
  lines.forEach((line, i) => g.fillText(line, CONFIG.W / 2, 558 + i * 34));
  g.fillStyle = "#a9977d";
  g.font = "14px Microsoft YaHei, sans-serif";
  g.fillText(`音效：${audio.muted ? "关" : "开"}  点击左上角音符切换`, CONFIG.W / 2, 716);
  g.restore();
}

function drawGameOver(g, state) {
  g.save();
  g.fillStyle = "rgba(10,13,10,0.72)";
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.textAlign = "center";
  g.fillStyle = "#ffe3b0";
  g.font = "bold 52px Microsoft YaHei, sans-serif";
  g.fillText("飞行终止", CONFIG.W / 2, 260);
  g.fillStyle = "#f1dfbf";
  g.font = "22px Microsoft YaHei, sans-serif";
  g.fillText(`距离 ${Math.floor(state.distance)}m`, CONFIG.W / 2, 340);
  g.fillText(`击杀 ${state.kills}  第 ${state.wave} 波`, CONFIG.W / 2, 380);
  g.fillText(`最高分 ${state.highScore}m`, CONFIG.W / 2, 420);
  drawButton(g, CONFIG.W / 2 - 105, 504, 210, 62, "重开");
  g.restore();
}

function drawButton(g, x, y, w, h, text) {
  g.save();
  const grad = g.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, "#a865ff");
  grad.addColorStop(1, "#5a36bd");
  g.fillStyle = grad;
  g.shadowBlur = 22;
  g.shadowColor = CONFIG.COLORS.purple;
  roundRect(g, x, y, w, h, 8);
  g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = "rgba(255,255,255,0.45)";
  g.lineWidth = 2;
  roundRect(g, x + 2, y + 2, w - 4, h - 4, 7);
  g.stroke();
  g.fillStyle = "#fff7ff";
  g.font = "bold 26px Microsoft YaHei, sans-serif";
  g.textAlign = "center";
  g.fillText(text, x + w / 2, y + 39);
  g.restore();
}

function roundRect(g, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y, x + w, y + h, rr);
  g.arcTo(x + w, y + h, x, y + h, rr);
  g.arcTo(x, y + h, x, y, rr);
  g.arcTo(x, y, x + w, y, rr);
  g.closePath();
}

function wrapText(g, text, x, y, maxWidth, lineHeight) {
  let line = "";
  const chars = Array.from(text);
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (g.measureText(test).width > maxWidth && line) {
      g.fillText(line, x, y);
      line = chars[i];
      y += lineHeight;
    } else line = test;
  }
  if (line) g.fillText(line, x, y);
}

function canvasPoint(evt) {
  const rect = canvas.getBoundingClientRect();
  const p = evt.touches ? evt.touches[0] : evt;
  return {
    x: (p.clientX - rect.left) / rect.width * CONFIG.W,
    y: (p.clientY - rect.top) / rect.height * CONFIG.H
  };
}

function activateAt(x, y) {
  audio.ensure();
  if (x >= 20 && x <= 62 && y >= 82 && y <= 114) {
    audio.toggle();
    return;
  }
  if (game.state === "MENU") {
    if (x >= CONFIG.W / 2 - 105 && x <= CONFIG.W / 2 + 105 && y >= 376 && y <= 438) game.start();
  } else if (game.state === "GAME_OVER") {
    if (x >= CONFIG.W / 2 - 105 && x <= CONFIG.W / 2 + 105 && y >= 504 && y <= 566) game.start();
  }
}

window.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") game.input.left = 1;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") game.input.right = 1;
  if (e.key === " " || e.key === "Enter") {
    if (game.state !== "PLAY") game.start();
  }
  if (e.key === "m" || e.key === "M") audio.toggle();
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") game.input.left = 0;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") game.input.right = 0;
});
canvas.addEventListener("pointerdown", e => {
  const p = canvasPoint(e);
  activateAt(p.x, p.y);
  game.input.touching = true;
  game.input.touchX = p.x;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!game.input.touching) return;
  game.input.touchX = canvasPoint(e).x;
});
canvas.addEventListener("pointerup", e => {
  game.input.touching = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener("pointercancel", () => { game.input.touching = false; });

let last = performance.now();
let acc = 0;
function loop(now) {
  const frame = Math.min(0.05, (now - last) / 1000);
  last = now;
  acc += frame;
  while (acc >= CONFIG.FIXED_DT) {
    game.update(CONFIG.FIXED_DT);
    acc -= CONFIG.FIXED_DT;
  }
  game.render(ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
