}
function codexProgress(cat) {
  const total = cat === "monsters" ? CODEX_MONSTERS.length : cat === "skills" ? CODEX_SKILLS.length : WEAPON_SKINS.length;
  const got = (SaveSystem.data.codex[cat] || []).length;

}
function applyWeaponSkin(player) {
  if (isStaveMode()) {
    // 法杖：慢速高伤 + 自带元素
    const st = getWeaponStave();
    player.damage *= st.bonus.dmg || 1;
    player.fireRate *= st.bonus.rate || 1;
    if (st.bonus.elem === "fire") player.fire = true;
    if (st.bonus.elem === "ice") player.ice = true;
    if (st.bonus.elem === "volt") player.volt = Math.max(player.volt || 0, 1);
    if (st.bonus.elemBoost) player.elemBoost = Math.max(player.elemBoost || 1, st.bonus.elemBoost);
    if (st.bonus.crit) player.crit = Math.min(0.6, player.crit + st.bonus.crit);
    return;
  }
  const skin = getWeaponSkin();
  if (skin.bonus.dmg) player.damage *= skin.bonus.dmg;
  if (skin.bonus.rate) player.fireRate *= skin.bonus.rate;
  if (skin.bonus.crit) player.crit = Math.min(0.6, player.crit + skin.bonus.crit);
  if (skin.bonus.arrowSpeed) player.arrowSpeed = CONFIG.BASE_ARROW_SPEED * skin.bonus.arrowSpeed;
  // 弓武器自带元素（火焰弓灼烧 / 冰霜弓减速 / 雷神弓弹射）——武器不只是皮肤，有实际效果
  if (skin.bonus.elem === "fire") player.fire = true;
  if (skin.bonus.elem === "ice") player.ice = true;
  if (skin.bonus.elem === "volt") player.volt = Math.max(player.volt || 0, 1);
}

const SaveSystem = {
  data: null,
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) { this.data = { ...DEFAULTS, equip: { ...DEFAULTS.equip }, talents: { ...DEFAULTS.talents } }; return this.data; }
      const parsed = JSON.parse(raw);
      // 版本/字段迁移：缺字段用默认值补齐
      this.data = {
        gold: parsed.gold || 0,
        equip: { ...DEFAULTS.equip, ...(parsed.equip || {}) },
        talents: { ...DEFAULTS.talents, ...(parsed.talents || {}) },
        weaponSkin: parsed.weaponSkin || 0,
        weaponCat: parsed.weaponCat || 0,
        // 老档迁移：weaponSkin≥1 的弓视为已拥有；法杖默认只有 0
        weaponOwn: (parsed.weaponOwn && Array.isArray(parsed.weaponOwn.bow)) ? parsed.weaponOwn : { bow: Array.from({ length: (parsed.weaponSkin || 0) + 1 }, (_, i) => i), stave: Array.isArray(parsed.weaponOwn?.stave) ? parsed.weaponOwn.stave : [] },
        chapter: parsed.chapter || 1,
        bestWave: parsed.bestWave || 0,
        heroLevel: parsed.heroLevel || 1,
        heroExp: parsed.heroExp || 0,
        heroPoints: parsed.heroPoints || 0,
        heroTree: { ...DEFAULTS.heroTree, ...(parsed.heroTree || {}) },
        codex: { monsters: Array.isArray(parsed.codex?.monsters) ? parsed.codex.monsters : [], skills: Array.isArray(parsed.codex?.skills) ? parsed.codex.skills : [], skins: Array.isArray(parsed.codex?.skins) ? parsed.codex.skins : [] }
      };
      return this.data;
    } catch (e) {
      this.data = { ...DEFAULTS, equip: { ...DEFAULTS.equip }, talents: { ...DEFAULTS.talents } };
      return this.data;
    }
  },
  save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* 无痕模式静默失败 */ }
  },
  addGold(n) { this.data.gold = Math.max(0, Math.floor(this.data.gold + n)); this.save(); },
  // 装备/天赋价格：随等级递增
  equipPrice(slot) { const lv = this.data.equip[slot]; return [60, 150, 320][lv] || 0; },
  talentPrice(slot) { const lv = this.data.talents[slot]; return [80, 180, 380][lv] || 0; },
  canBuyEquip(slot) { return this.data.equip[slot] < 3 && this.data.gold >= this.equipPrice(slot); },
  canBuyTalent(slot) { return this.data.talents[slot] < 3 && this.data.gold >= this.talentPrice(slot); },
  buyEquip(slot) {
    if (!this.canBuyEquip(slot)) return false;
    this.data.gold -= this.equipPrice(slot);
    this.data.equip[slot]++;
    this.save();
    return true;
  },
  buyTalent(slot) {
    if (!this.canBuyTalent(slot)) return false;
    this.data.gold -= this.talentPrice(slot);
    this.data.talents[slot]++;
    this.save();
    return true;
  }
};

// 局外成长 → 玩家初始属性加成
// 永久成长仅 = 英雄天赋树（装备/天赋系统已移除，局内商店只做临时强化）
function applyMetaProgression(p) {
  const s = SaveSystem.data;
  // 英雄天赋树加成（局外唯一成长源）
  const ht = s.heroTree || {};
  p.damage *= 1 + (ht.dmg || 0) * 0.025;
  p.fireRate *= 1 + (ht.rate || 0) * 0.02;
  p.maxHp += (ht.hp || 0) * 8;
  p.hp = p.maxHp;
  p.crit = Math.min(0.6, p.crit + (ht.crit || 0) * 0.015);
  p.heroGoldMult = 1 + (ht.gold || 0) * 0.05;
  p.heroLuck = (ht.luck || 0) * 0.02;
  // 武器加成（局内购买的武器本局生效，免费武器无加成）
  applyWeaponSkin(p);
}

  update(dt) {
    // 时间缩放：命中顿帧 / 击杀慢镜
    if (this.hitStop > 0) {
      this.hitStop -= dt;
      dt *= this.hitStop > 0.02 ? 0.06 : 0.4;
    }
    if (this.slowMo > 0) {
      this.slowMo -= dt;
      dt *= 0.35;
    }
    // 暂停：完全冻结（玩家/怪/弹幕/计时全部停，画面保留）
    if (this.paused) return;
    if (this.state !== "PLAY") {
      this.updateBackdrop(dt);
      for (const p of this.particles.active()) p.update(dt);
      if (this.chooseT > 0) this.chooseT -= dt;
      if (this.awakenT > 0) this.awakenT -= dt;
      if (this.bossIntro > 0) this.bossIntro -= dt;
      if (this.roomTransition > 0) this.roomTransition -= dt;
      if (themeTrans > 0) themeTrans -= dt * 0.8;
      return;
    }
    this.flySpeed = 0;
    this.distance = (this.chapter - 1) * 600 + this.roomIndex * 100;
    this.updateBackdrop(dt);
    this.updateInRunShop(dt);
    // 局内商店/数值面板打开时暂停战斗（只更新玩家/粒子）
    if ((this.inRunShop && this.inRunShop.paused) || this.statsPanel) {
      for (const p of this.particles.active()) p.update(dt);
      return;
    }
    this.player.update(dt, this);
    for (const a of this.arrows.active()) a.update(dt, this);
    for (const e of this.enemies.active()) e.update(dt, this);
    for (const b of this.bullets.active()) b.update(dt, this);
    for (const z of this.zones.active()) z.update(dt, this);
    for (const c of this.coins.active()) c.update(dt, this);
    for (const p of this.particles.active()) p.update(dt);
    this.updateGate(dt);
    this.updateChest(dt);
    this.checkRoomClear();
    if (this.ring) {
      this.ring.r += (this.ring.maxR - this.ring.r) * Math.min(1, dt * 9);
      this.ring.life -= dt;
      if (this.ring.life <= 0) this.ring = null;
    }
    if (this.bossIntro > 0) this.bossIntro -= dt;
    if (this.roomTransition > 0) this.roomTransition -= dt;
    if (themeTrans > 0) themeTrans -= dt * 0.8;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 26);
    if (this.messageT > 0) this.messageT -= dt;
  }
  updateBackdrop(dt) {
    const scroll = 0;
    for (const d of this.decor) {
      d.rot += Math.sin(performance.now() * 0.001 + d.x) * 0.0003;
    }
    for (const l of this.leaves) {
      l.y += l.s * 12 * dt;
      l.x += Math.sin(l.a + performance.now() * 0.001) * 12 * dt;
      l.a += dt;
      if (l.y > CONFIG.H + 20) { l.y = -20; l.x = Util.rand(0, CONFIG.W); }
    }
  }
  makeDecor(y, type) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const road = Util.roadWidth(y);
    return {
      type,
      y,
      x: CONFIG.W / 2 + side * (road / 2 + Util.rand(22, 105)),
      layer: Util.rand(0.75, 1.08),
      rot: Util.rand(-0.25, 0.25),
      tone: Math.random()
    };
  }
  enterRoom(chapter, roomIndex) {
    // 跨章判定：进入新章节时商店商品刷新（同章内共享一批，防重复堆叠）
    const newChapter = chapter !== this.chapter;
    this.chapter = chapter;
    this.roomIndex = roomIndex;
    this.roomType = ROOM_SEQUENCE[this.roomIndex];
    this.wave = (chapter - 1) * ROOM_SEQUENCE.length + roomIndex + 1;
    this.spawnedWave = this.wave;
    this.roomCleared = false;
    this.roomStarted = true;
    this.roomTransition = 1.2;
    this.gate = null;
    this.chest = null;
    this.boss = null;
    // 房间临时增益重置：伤害/射速/护盾仅本房间有效（穿门撤销），HP 延续
    if (this.player.roomDmg) { this.player.damage = Math.max(CONFIG.BASE_ARROW_DAMAGE, this.player.damage - this.player.roomDmg); this.player.roomDmg = 0; }
    if (this.player.roomRate && this.player.roomRate !== 1) { this.player.fireRate = Math.min(6, this.player.fireRate / this.player.roomRate); this.player.roomRate = 1; }
    this.player.shield = 0; // 护盾每房间重置（不延续）
    // 商店商品每房间重置（价格回到基准、全部可买——阶梯涨价只对本房间生效）
    this.inRunShop = null;
    if (newChapter) this.inRunShop = null; // 保留兼容
    this.arrows.items.length = 0;
    this.bullets.items.length = 0;
    this.enemies.items.length = 0;
    this.coins.items.length = 0;
    this.player.x = CONFIG.W / 2;
    this.player.y = CONFIG.PLAYER_Y;
    checkThemeSwitch(this);
    this.spawnRoom();
    this.flashMessage(`第 ${this.chapter} 章 · 房间 ${this.roomIndex + 1}/6`);
  }
  spawnWave() {
    this.spawnRoom();
  }
  spawnRoom() {
    this.spawnedWave = this.wave;
    const difficulty = this.wave;
    if (this.roomType === "shop") {
      this.spawnShopRoom();
      this.spawnGate();
      return;
    }
    if (this.roomType === "boss") {
      this.boss = this.enemies.get("boss", CONFIG.W / 2, 135, difficulty);
      audio.boss();
      this.flashMessage(bossForChapter(this.chapter).title);
      // Boss 出场演出：暗幕 + 震屏 + 顶部红光
      this.bossIntro = 1.2;
      this.shake = Math.max(this.shake || 0, 10);
      return;
    }
    // 敌人数随章节成长（第三章起人海压制，破站桩无敌）
    const chBonus = Math.min(4, Math.floor(this.chapter / 2));
    const baseCount = this.roomType === "elite" ? Util.randi(3 + chBonus, 4 + chBonus) : this.roomIndex === 4 ? Util.randi(4 + chBonus, 6 + chBonus) : Util.randi(3 + Math.min(2, chBonus), 5 + chBonus);
    // 章节越高，混合兵种越多（第三章节出现飞行+射手+坦克混编）
    const types = [];
    types.push("minion");
    if (difficulty >= 2) types.push("flyer");
    if (difficulty >= 3) types.push("archer");
    if (difficulty >= 4) types.push("tank");
    if (difficulty >= 8) types.push("flyer", "tank", "archer");
    if (this.chapter >= 3) types.push("archer", "tank");
    if (this.chapter >= 4) types.push("flyer", "tank", "archer");
    for (let i = 0; i < baseCount; i++) {
      const y = Util.rand(145, 455) + (i % 2) * 26;
      const roadW = Util.roadWidth(y);
      const x = CONFIG.W / 2 + Util.rand(-roadW * 0.36, roadW * 0.36);
      const e = this.enemies.get(Util.pick(types), x, y, difficulty);
      if (this.roomType === "elite") {
        e.isElite = true;
        e.eliteAffix = e.eliteAffix || Util.pick(["swift", "huge", "armored", "splitter"]);
        e.hp = Math.round(e.hp * 1.8);
        e.maxHp = e.hp;
        e.r *= e.eliteAffix === "huge" ? 1.25 : 1;
      }
    }
  }
  spawnShopRoom() {
    // 商店商品每房间重置（价格回基准、全部可买；阶梯涨价只对本房间生效）
    if (!this.inRunShop) this.inRunShop = { items: getInRunShopItems(), pulse: 0 };
    for (const it of this.inRunShop.items) { it.price = it.basePrice; it.sold = false; }
    this.flashMessage("神秘商人：局内金币可购买临时强化（仅本房间有效）");
  }
  // 局内商店：战斗中随时打开（暂停战斗，花局内金币买临时强化）
  openInRunShop() {
    if (this.state !== "PLAY") return;
    if (!this.inRunShop) {
      this.inRunShop = { items: getInRunShopItems(), pulse: 0, tab: 0 };
      for (const it of this.inRunShop.items) { it.price = it.basePrice; it.sold = false; }
    }
    this.inRunShop.paused = true;
  }
  openStatsPanel() {
    if (this.state !== "PLAY") return;
    this.statsPanel = true;
  }
  closeStatsPanel() {
    this.statsPanel = false;
  }
  closeInRunShop() {
    if (this.inRunShop) this.inRunShop.paused = false;
  }
  // 关闭局内商店面板（商店房模式也用它关闭）
  dismissInRunShop() {
    this.inRunShop = null;
  }
  // 局内购买武器（花局内金币，本局生效，死亡回免费武器）
  // 局内不允许切换武器路线（开局选武器决定本局），只有同路线武器可购买
  buyMetaFromInRun(kind, slot) {
    const s = SaveSystem.data;
    if (kind === "weapon") {
      // 购买/装备当前路线武器（局内金币，本局生效）
      const w = isStaveMode() ? WEAPON_STAVES[slot] : WEAPON_SKINS[slot];
      if ((this.runGold || 0) >= w.price) {
        this.runGold -= w.price;
        this.player.weaponSkinOverride = slot; // 本局装备，死亡/下一局重置
        this.flashMessage(`已装备 ${w.name}（本局）`);
        codexUnlock("skins", String(slot));
        return true;
      }
      this.flashMessage(`局内金币不足（需要 ${w.price}）`);
      audio.death();
      return false;
    }
    SaveSystem.save();
    this.flashMessage("购买成功！");
    audio.upgrade();
    return true;
  }
  spawnGate() {
    // 传送门：房间中央偏上，玩家四向移动可达
    this.gate = { x: CONFIG.W / 2, y: CONFIG.H * 0.6, r: 48, pulse: 0 };
    audio.upgrade();
  }
  chooseUpgrade(idx) {
    const up = this.choices && this.choices[idx];
    if (!up) return;
    this.applyUpgrade(up);
    this.choices = null;
    this.state = "PLAY";
    this.spawnGate();
  }
  updateGate(dt) {
    if (!this.gate) return;
    this.gate.pulse += dt;
    const dx = this.gate.x - this.player.x;
    const dy = this.gate.y - this.player.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    if (d < 150) {
      const pull = (1 - d / 150) * 190;
      this.player.x += dx / d * pull * dt;
      this.player.y += dy / d * pull * dt;
    }
    if (d < this.gate.r + this.player.r) this.advanceRoom();
  }
  checkRoomClear() {
    if (this.roomCleared || this.gate || this.choices || this.roomType === "shop") return;
    if (this.chest || this.boss) return;
    const alive = this.enemies.active().some(e => !e.dead);
    if (alive) return;
    this.roomCleared = true;
    // 过关自动拾取：房间内所有剩余金币飞向玩家
    for (const c of this.coins.active()) {
      if (!c.active) continue;
      game.runGold = (game.runGold || 0) + c.value;
      c.active = false;
      game.particles.get(c.x, c.y, Util.rand(-20, 20), Util.rand(-40, 10), 0.3, "#f7c948", Util.rand(2, 4));
    }
    if (this.roomType === "battle" || this.roomType === "elite") {
      this.choices = rollChoices();
      this.state = "CHOOSE";
      this.chooseT = 0.35;
      audio.upgrade();
    } else if (this.roomType === "boss") {
      this.spawnGate();
    }
  }
  advanceRoom() {
    if (!this.gate) return;
    this.gate = null;
    this.inRunShop = null;
    this.arrows.items.length = 0;
    this.bullets.items.length = 0;
    if (this.roomIndex >= ROOM_SEQUENCE.length - 1) {
      this.settlementBonus += 50;
      const nextChapter = this.chapter + 1;
      SaveSystem.data.chapter = Math.max(SaveSystem.data.chapter || 1, nextChapter);
      SaveSystem.save();
      this.enterRoom(nextChapter, 0);
    } else {
      this.enterRoom(this.chapter, this.roomIndex + 1);
    }
  }
  updateInRunShop(dt) {
    if (this.inRunShop) this.inRunShop.pulse += dt;
  }
  buyInRunShop(idx) {
    if (!this.inRunShop) return false;
    const item = this.inRunShop.items[idx];
    if (!item || item.sold || (this.runGold || 0) < item.price) return false;
    this.runGold -= item.price;
    item.sold = true;
    item.apply(this);
    if (!this.player.pickedUpgrades) this.player.pickedUpgrades = [];
    this.player.pickedUpgrades.push({ id: item.id, name: item.name, icon: item.icon, rarity: "shop", faction: "shop" });
    // 图鉴解锁：商店技能
    codexUnlock("skills", item.id);
    // 价格阶梯：买一个 → 所有未买商品 ×1.5（只对本房间生效，下房间重置）
    for (const it of this.inRunShop.items) {
      if (!it.sold) it.price = Math.round((it.price || it.basePrice || 20) * 1.5);
    }
    this.flashMessage(`${item.name}：购买成功（其余商品已涨价）`);
    audio.upgrade();
    return true;
  }
  applyUpgrade(up) {
    up.apply(this);
    // 记录已选技能卡（详细面板展示）
    if (!this.player.pickedUpgrades) this.player.pickedUpgrades = [];
    this.player.pickedUpgrades.push({ id: up.id, name: up.name, icon: up.icon, rarity: up.rarity, faction: up.faction });
    // 图鉴解锁：技能卡
    codexUnlock("skills", up.id);
    // 流派计数 + 觉醒检测（每选 3 个同系触发）
    this.factionCount[up.faction] = (this.factionCount[up.faction] || 0) + 1;
    if (this.factionCount[up.faction] % 3 === 0 && !this.factionAwakened[up.faction]) {
      this.factionAwakened[up.faction] = true;
      const aw = FACTION_AWAKEN[up.faction];
      if (aw) {
        aw.apply(this);
        this.awakenMsg = `${aw.name}！${aw.desc}`;
        this.awakenT = 2.6;
        audio.boss();
        this.shake = Math.max(this.shake || 0, 12);
        this.ring = { x: this.player.x, y: this.player.y, r: 10, maxR: 260, life: 0.8 };
        for (let i = 0; i < 60; i++) this.particles.get(this.player.x, this.player.y, Util.rand(-220, 220), Util.rand(-260, 80), 1.0, Util.pick(["#f7c948", "#c77dff", "#5fc6ff"]), Util.rand(4, 11));
      }
    }
    // 升级演出：金色大字 + 扩散光圈 + 冲击粒子 + 屏幕微震
    this.flashMessage(`${up.name}：${up.desc}`);
    this.particles.get(this.player.x, this.player.y, 0, 0, 0.9, "#f7c948", 10, up.name, false); // 大字
    this.particles.get(this.player.x, this.player.y, 0, 0, 0.9, "#f7c948", 8, up.desc, false);
    this.ring = { x: this.player.x, y: this.player.y, r: 10, maxR: 190, life: 0.55 };
    this.shake = Math.max(this.shake || 0, 7);
    audio.upgrade();
    for (let i = 0; i < 34; i++) this.particles.get(this.player.x, this.player.y, Util.rand(-160, 160), Util.rand(-200, 60), 0.75, Util.pick(["#f7c948", "#a865ff", "#fff1a5"]), Util.rand(3, 9));
  }
  spawnChest() {
    this.chest = { x: CONFIG.W / 2, y: CONFIG.H * 0.73, r: 34, pulse: 0 };
    // 提示玩家吃宝箱（否则 Boss 房不出传送门会以为卡住）
    this.flashMessage("拾取宝箱开启传送门！");
  }
  updateChest(dt) {
    if (!this.chest) return;
    this.chest.pulse += dt;
    // 宝箱磁吸：靠近 90px 自动飞向玩家（防漏吃卡在 Boss 房）
    const dx = this.player.x - this.chest.x, dy = this.player.y - this.chest.y;
    const d = Math.hypot(dx, dy);
    if (d < 90 && d > 1) {
      this.chest.x += dx / d * 320 * dt;
      this.chest.y += dy / d * 320 * dt;
    }
    this.chest.y += this.flySpeed * dt;
    if (Util.circleHit(this.player, this.chest)) {
      const reward = Util.randi(0, 2);
      if (reward === 0) {
        this.player.damage *= 1.08;
        this.player.fireRate = Math.min(6, this.player.fireRate * 1.06);
        this.player.moveSpeed = Math.min(700, this.player.moveSpeed * 1.06);
        this.flashMessage("宝箱：全属性提升");
      } else if (reward === 1) {
        this.player.hp = Math.min(this.player.maxHp, this.player.hp + this.player.maxHp * 0.4);
        this.flashMessage("宝箱：回复 40%");
      } else {
        this.score += 300;
        // 宝箱金币：洒出 6 枚金币实体
        for (let i = 0; i < 6; i++) {
          this.coins.get(this.chest.x + Util.rand(-30, 30), this.chest.y + Util.rand(-20, 20), 8, Util.rand(-90, 90), Util.rand(-180, -60));
        }
        this.flashMessage("宝箱：金币 +48");
      }
      audio.chest();
      for (let i = 0; i < 35; i++) this.particles.get(this.chest.x, this.chest.y, Util.rand(-150, 150), Util.rand(-190, 40), 0.9, "#f7c948", Util.rand(4, 10));
      this.chest = null;
    } else if (this.chest.y > CONFIG.H + 80) this.chest = null;
  }
  fireArrows() {
    const n = this.player.arrowCount;
    // 狂暴：低血加伤（血低于 40% 时 +30%/级）
    let berserkMult = 1;
    if (this.player.berserk > 0 && this.player.hp / this.player.maxHp < 0.4) {
      berserkMult = 1 + this.player.berserk * 0.3;
    }
    // 自动瞄准：找最近的非死亡敌人（弓箭传说2 核心手感），无敌人时垂直向上
    let targetAngle = 0;
    let best = null, bestD = 999999;
    for (const e of this.enemies.active()) {
      if (e.dead) continue;
      const d = Util.dist2(this.player, e);
      if (d < bestD) { best = e; bestD = d; }
    }
    if (best) {
      targetAngle = Math.atan2(best.x - this.player.x, -(best.y - this.player.y));
    }
    // 多箭扩散角加大：0.3→0.45（之前夹角仅17°几乎重叠，视觉上像单箭，误以为多重箭失效）
    const spread = n === 1 ? 0 : 0.45;
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0 : (i / (n - 1) - 0.5) * spread;
      // 多箭伤害递减：1/0.85/0.7（防止多重箭无脑碾压）
      const dmgMul = n === 1 ? 1 : 1 - i * 0.15;
      // 法杖模式：能量球（高伤自带元素，穿透+1，弹速略慢）
      const isStave = isStaveMode();
      const st = isStave ? getWeaponStave() : null;
      const baseDmg = this.player.damage * dmgMul * berserkMult;
      const a = isStave
        ? this.arrows.get(this.player.x, this.player.y - 36, targetAngle + t, baseDmg, this.player.range, this.player.pierce, this.player.crit, this.player.fire || st.bonus.elem === "fire", this.player.ice || st.bonus.elem === "ice")
        : this.arrows.get(this.player.x, this.player.y - 36, targetAngle + t, baseDmg, this.player.range, this.player.pierce, this.player.crit, this.player.fire, this.player.ice);
      a.isStave = isStave;
      if (isStave) {
        a.vx *= 0.85; a.vy *= 0.85; // 能量球略慢
        if (st.bonus.elem === "volt") a.volt = Math.max(a.volt || 0, this.player.volt || 1);
        // 法杖专属卡生效
        a.damage *= 1 + (this.player.stavePower || 0) * 0.2; // 法力强化
        a.pierce += this.player.stavePierce || 0;            // 奥术穿透
        a.staveSplit = this.player.staveSplit || false;
        a.staveNova = this.player.staveNova || false;
        a.staveDrain = this.player.staveDrain || 0;
      }
      a.split = this.player.split;
      a.volt = this.player.volt;
      a.arrowIdx = i; // 多箭序号：追踪箭按序号锁不同目标，弹道分离不重叠
      a.frostfire = this.player.frostfire;
      a.lifesteal = this.player.lifesteal;
      a.homing = this.player.homing;
      a.pierceAll = this.player.pierceAll;
      if (this.player.pierceAll) a.pierce = 999;
      a.bounce = this.player.bounce || 0;
      a.poison = this.player.poison;
      a.critDmg = this.player.critDmg || 2;
      a.swift = this.player.swift || 0;
      if (a.swift > 0) a.speed *= 1 + a.swift * 0.15;
    }
    // 射击后座：弓口火光粒子 + 屏幕微震（不推人物位移，防止下滑）
    this.shake = Math.max(this.shake || 0, 1.2);
    for (let i = 0; i < 3; i++) {
      this.particles.get(this.player.x + Util.rand(-6, 6), this.player.y - 40, Util.rand(-20, 20), Util.rand(-60, -20), 0.2, Util.pick(["#eadcff", "#a865ff"]), Util.rand(2, 4));
    }
    audio.shoot();
  }
  damageNumber(x, y, amount, crit) {
    this.totalDmg = (this.totalDmg || 0) + Math.max(0, Math.round(amount || 0));
    this.particles.get(x, y, Util.rand(-18, 18), -78, 0.72, CONFIG.COLORS.orange, 1, String(amount), crit);
  }
  flashMessage(text) {
    this.message = text;
    this.messageT = 1.8;
  }
  render(g) {
    g.save();
    // 屏幕震动
    if (this.shake > 0.2) {
      g.translate(Util.rand(-this.shake, this.shake) * 0.5, Util.rand(-this.shake, this.shake) * 0.5);
    }
    drawWorld(g, this);
    if (this.gate) drawGate(g, this.gate);
    if (this.chest) drawChest(g, this.chest);
    const renderables = [];
    for (const e of this.enemies.active()) renderables.push(e);
    renderables.sort((a, b) => a.y - b.y);
    for (const e of renderables) e.render(g);
    for (const a of this.arrows.active()) a.render(g);
    for (const b of this.bullets.active()) b.render(g);
    for (const c of this.coins.active()) c.render(g);
    for (const z of this.zones.active()) z.render(g);
    this.player.render(g);
    // 升级光圈（画在粒子下层）
    if (this.ring) {
      const a = Util.clamp(this.ring.life / 0.55, 0, 1);
      g.strokeStyle = `rgba(247,201,72,${0.75 * a})`;
      g.lineWidth = 5 * a;
      g.beginPath();
      g.arc(this.ring.x, this.ring.y, this.ring.r, 0, TAU);
      g.stroke();
    }
    for (const p of this.particles.active()) p.render(g);
    drawUI(g, this);
    if (this.inRunShop) drawInRunShop(g, this);
    // 三选一卡牌界面（画在最上层）
    if (this.state === "CHOOSE" && this.choices) {
      drawChoiceCards(g, this);
    }
    // Boss 出场演出：红色暗幕 + 顶部血光
    if (this.bossIntro > 0) {
      const a = Util.clamp(this.bossIntro / 1.2, 0, 1);
      const grad = g.createLinearGradient(0, 0, 0, CONFIG.H * 0.5);
      grad.addColorStop(0, `rgba(200,30,40,${0.4 * a})`);
      grad.addColorStop(1, "rgba(200,30,40,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, CONFIG.W, CONFIG.H * 0.5);
      g.fillStyle = `rgba(0,0,0,${0.35 * a})`;
      g.fillRect(0, 0, CONFIG.W, CONFIG.H);
    }
    // 商店界面
    if (this.state === "SHOP") {
      drawShop(g, this);
    }
    // 觉醒大字（商店/面板打开时隐藏，避免遮挡）
    if (this.awakenT > 0 && this.awakenMsg && !this.inRunShop && !this.statsPanel) {
      g.save();
      g.globalAlpha = Math.min(1, this.awakenT);
      g.textAlign = "center";
      g.shadowBlur = 26;
      g.shadowColor = "#f7c948";
      g.font = "bold 46px Microsoft YaHei, sans-serif";
      g.fillStyle = "#ffd56a";
      g.fillText(this.awakenMsg.split("！")[0] + "！", CONFIG.W / 2, CONFIG.H * 0.38);
      g.shadowBlur = 0;
      g.font = "bold 22px Microsoft YaHei, sans-serif";
      g.fillStyle = "#fff0c4";
      g.fillText(this.awakenMsg.split("！").slice(1).join("！"), CONFIG.W / 2, CONFIG.H * 0.38 + 44);
      g.restore();
    }
    g.restore();
  }
}

const game = new Game();

// ── AI 演示模式（?demo=1）：游戏自己会玩，屏幕显示决策日志 ──
const DEMO = new URLSearchParams(location.search).has("demo");
const DemoAI = {
  log: [],
  lastLog: 0,
  say(text) {
    const now = performance.now();
    if (now - this.lastLog < 600) return; // 限频
    this.lastLog = now;
    this.log.push({ t: now, text });
    if (this.log.length > 5) this.log.shift();
  },
  think(dt) {
    if (!DEMO) return;
    if (game.state === "MENU" && !game._demoStarted) {
      game._demoStarted = true;
      game.start();
      this.say("AI 演示模式启动，开始第一局");
      return;
    }
    if (game.state === "CHOOSE" && game.choices) {
      // 选卡策略：优先稀有度高，同稀有度随机
      let best = 0;
      for (let i = 1; i < game.choices.length; i++) {
        if (RARITY[game.choices[i].rarity].weight < RARITY[game.choices[best].rarity].weight) best = i;
      }
      const picked = game.choices[best];
      this.say(`选择：${picked.name}（${RARITY[picked.rarity].label}）`);
      game.chooseUpgrade(best);
      return;
    }
    if (game.state === "GAME_OVER") {
      this.say(`本局结束：${Math.round(game.distance)}m，重启下一局`);
      game.start();
      return;
    }
    if (game.state !== "PLAY") return;
    const px = game.player.x, py = game.player.y;
    const setTarget = (x, y) => {
      game.input.hover = true;
      game.input.hoverX = Util.clamp(x, 62, CONFIG.W - 62);
      game.input.hoverY = Util.clamp(y == null ? py : y, 150, CONFIG.H - 70);
    };

    // 1. 宝箱优先：主动去吃（x+y 双轴）
    if (game.chest) {
      setTarget(game.chest.x, game.chest.y);
      if (Math.hypot(game.chest.x - px, game.chest.y - py) < 40) game.chest = null;
      return;
    }
    if (game.inRunShop) {
      const buyable = game.inRunShop.items.findIndex(item => !item.sold && (game.runGold || 0) >= item.price);
      if (buyable >= 0 && Math.random() < 0.08) {
        game.buyInRunShop(buyable);
        this.say("局内商店购买临时强化");
      }
      if (game.gate) setTarget(game.gate.x, game.gate.y);
      return;
    }
    if (game.gate) {
      // 主动走向传送门（x+y 双轴，y 必须移动才能碰到 576 高度的门）
      setTarget(game.gate.x, game.gate.y);
      return;
    }

    // 2. 危险检测：弹幕优先（致命），敌人次之
    let danger = null, dangerD = 1e9, dangerIsBullet = false;
    for (const b of game.bullets.active()) {
      const d = Math.hypot(b.x - px, b.y - py);
      if (d < dangerD && b.y > py - 340 && d < 300) { dangerD = d; danger = { x: b.x, y: b.y }; dangerIsBullet = true; }
    }
    if (!danger) {
      for (const e of game.enemies.active()) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - px, e.y - py);
        if (d < dangerD && e.y > py - 460) { dangerD = d; danger = { x: e.x, y: e.y, enemy: true }; }
      }
    }

    // 3. 目标计算（x 横移 + y 上下，四向移动）
    let targetX = CONFIG.W / 2;
    let targetY = py;
    if (danger) {
      if (dangerD < 230) {
        // 急躲：远离威胁；贴边时拉回中心，绝不卡边
        const away = px + (px - danger.x) * 1.4;
        targetX = away < 100 || away > CONFIG.W - 100 ? CONFIG.W / 2 : away;
        // 子弹从下方/上方来时上下闪避
        if (dangerIsBullet) {
          targetY = py + (py - danger.y) * 1.2;
          targetY = Util.clamp(targetY, 180, CONFIG.H - 80);
        }
        if (dangerD < 120) targetX = CONFIG.W / 2;
      } else {
        // 中距离：横向错开半个身位，保持输出
        targetX = px + (px - danger.x) * 0.35;
        targetX = Util.clamp(targetX, 90, CONFIG.W - 90);
      }
    } else {
      // 4. 无危险：主动索敌对齐射击（打怪意识）
      let bestE = null, bestD = 1e9;
      for (const e of game.enemies.active()) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - px, e.y - py);
        if (d < bestD && e.y > py - 520) { bestD = d; bestE = e; }
      }
      if (bestE) {
        // 轻微追向敌人正下方，让箭直射命中
        targetX = bestE.x + (bestE.x - px) * 0.12;
        // 保持 200-300 输出距离，不贴脸
        if (bestE.y - py > 260) targetY = py + (bestE.y - py - 220) * 0.5;
      } else {
        // 无敌人：回中心巡航
        targetX = CONFIG.W / 2 + Math.sin(performance.now() * 0.0004) * 60;
      }
    }
    setTarget(targetX, targetY);
    return;
  },
  render(g) {
    if (!DEMO) return;
    // 屏幕顶部 AI 决策日志
    g.save();
    g.fillStyle = "rgba(7,12,8,0.66)";
    roundRect(g, 330, 118, 196, 118, 8); g.fill();
    g.fillStyle = "#7cf8a8";
    g.font = "bold 13px Microsoft YaHei, sans-serif";
    g.textAlign = "left";
    g.fillText("🤖 AI 演示", 342, 140);
    g.font = "12px Microsoft YaHei, sans-serif";
    const now = performance.now();
    const rows = this.log.slice(-4);
    rows.forEach((l, i) => {
      const age = (now - l.t) / 1000;
      g.globalAlpha = Math.max(0.25, 1 - age / 6);
      g.fillStyle = "#d8e6f5";
      g.fillText(l.text, 342, 162 + i * 18);
    });
    g.globalAlpha = 1;
    g.restore();
  }
};

function drawWorld(g, state) {
  const th = getTheme();
  // 房间地板：固定场地（弓箭传说2 风格），不再滚动道路
  const grad = g.createLinearGradient(0, 0, 0, CONFIG.H);
  grad.addColorStop(0, th.grassFar);
  grad.addColorStop(1, th.grassNear);
  g.fillStyle = grad;
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  // 房间边界：上下左右深色边框（场地感）
  const border = "rgba(20,16,10,0.55)";
  g.fillStyle = border;
  g.fillRect(0, 0, CONFIG.W, 18);                       // 顶
  g.fillRect(0, CONFIG.H - 22, CONFIG.W, 22);           // 底
  g.fillRect(0, 0, 16, CONFIG.H);                       // 左
  g.fillRect(CONFIG.W - 16, 0, 16, CONFIG.H);           // 右
  // 场地地面：中央石板区（内层浅色，有边界线）
  const floorGrad = g.createLinearGradient(0, 90, 0, CONFIG.H - 30);
  floorGrad.addColorStop(0, th.roadFar);
  floorGrad.addColorStop(1, th.roadNear);
  g.fillStyle = floorGrad;
  g.fillRect(24, 24, CONFIG.W - 48, CONFIG.H - 52);
  // 地面网格线（石板拼缝，固定不滚动）
  g.strokeStyle = "rgba(0,0,0,0.12)";
  g.lineWidth = 2;
  g.beginPath();
  for (let row = 0; row < 9; row++) {
    const gy = 40 + row * ((CONFIG.H - 80) / 8);
    g.moveTo(28, gy);
    g.lineTo(CONFIG.W - 28, gy);
  }
  for (let col = 0; col < 6; col++) {
    const gx = 40 + col * ((CONFIG.W - 80) / 5);
    g.moveTo(gx, 28);
    g.lineTo(gx, CONFIG.H - 28);
  }
  g.stroke();
  // 场地边缘高光
  g.strokeStyle = th.roadEdge;
  g.lineWidth = 4;
  g.strokeRect(24, 24, CONFIG.W - 48, CONFIG.H - 52);
  // 房间角落装饰（柱子）
  g.fillStyle = "rgba(0,0,0,0.25)";
  for (const [cx, cy] of [[30, 30], [CONFIG.W - 30, 30], [30, CONFIG.H - 30], [CONFIG.W - 30, CONFIG.H - 30]]) {
    g.beginPath();
    g.arc(cx, cy, 8, 0, TAU);
    g.fill();
  }
  // 场景装饰（树/石头等，房间内点缀）
  for (const d of [...state.decor].sort((a, b) => a.y - b.y)) drawDecor(g, d);
  drawLeaves(g, state.leaves, th.leaf);
  // 场景过渡横幅（淡入淡出）
  if (themeTrans > 0) {
    const a = Math.min(1, themeTrans * 2);
    g.save();
    g.globalAlpha = a;
    g.fillStyle = "rgba(0,0,0,0.5)";
    g.fillRect(0, CONFIG.H * 0.42 - 50, CONFIG.W, 100);
    g.fillStyle = "#f5ecd9";
    g.font = "bold 26px Microsoft YaHei, sans-serif";
    g.textAlign = "center";
    g.fillText(`— ${th.name} —`, CONFIG.W / 2, CONFIG.H * 0.42 + 6);
    g.restore();
  }
  if (state.roomTransition > 0) {
    const a = Util.clamp(state.roomTransition / 1.2, 0, 1);
    g.save();
    g.globalAlpha = a;
    g.fillStyle = "rgba(0,0,0,0.42)";
    g.fillRect(0, CONFIG.H * 0.33 - 46, CONFIG.W, 92);
    g.fillStyle = "#fff0c4";
    g.font = "bold 24px Microsoft YaHei, sans-serif";
    g.textAlign = "center";
    g.fillText(`第 ${state.chapter} 章 · 房间 ${state.roomIndex + 1}/6 · ${ROOM_LABEL[state.roomType]}`, CONFIG.W / 2, CONFIG.H * 0.33 + 8);
    g.restore();
  }
}

function drawDecor(g, d) {
  const s = Util.worldScale(d.y) * (d.type === "tree" || d.type === "pine" || d.type === "shadetree" ? 1 : 0.75);
  g.save();
  g.translate(d.x, d.y);
  g.rotate(d.rot);
  drawShadow(g, 0, 16 * s, 18 * s, 7 * s, 0.25);
  if (d.type === "tree") {
    g.fillStyle = "#5c3b26";
    g.fillRect(-5 * s, -2 * s, 10 * s, 28 * s);
    g.fillStyle = d.tone > 0.5 ? "#2f6b35" : "#3f813b";
    g.beginPath();
    g.moveTo(0, -42 * s);
    g.lineTo(-28 * s, 8 * s);
    g.lineTo(24 * s, 12 * s);
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(255,255,255,0.12)";
    g.beginPath();
    g.moveTo(-4 * s, -34 * s);
    g.lineTo(-18 * s, -2 * s);
    g.lineTo(3 * s, -8 * s);
    g.closePath();
    g.fill();
  } else if (d.type === "pine") {
    // 雪原松树
    g.fillStyle = "#4a3a28";
    g.fillRect(-4 * s, -2 * s, 8 * s, 24 * s);
    for (let k = 0; k < 3; k++) {
      const y = -10 - k * 14;
      g.fillStyle = k === 2 ? "#2e5c4a" : "#3a6e58";
      g.beginPath();
      g.moveTo(0, (y - 18) * s);
      g.lineTo(-22 * s, y * s + 8 * s);
      g.lineTo(22 * s, y * s + 8 * s);
      g.closePath();
      g.fill();
    }
    g.fillStyle = "rgba(255,255,255,0.35)";
    g.beginPath();
    g.moveTo(-8 * s, -30 * s);
    g.lineTo(-4 * s, -40 * s);
    g.lineTo(0, -34 * s);
    g.closePath();
    g.fill();
  } else if (d.type === "shadetree") {
    // 暗域树：深紫+发光
    g.fillStyle = "#2a1a3a";
    g.fillRect(-5 * s, -2 * s, 10 * s, 26 * s);
    g.fillStyle = d.tone > 0.5 ? "#4a2a6a" : "#3a2058";
    g.beginPath();
    g.arc(0, -20 * s, 22 * s, 0, TAU);
    g.fill();
    g.fillStyle = "rgba(190,140,255,0.25)";
    g.beginPath();
    g.arc(-6 * s, -24 * s, 8 * s, 0, TAU);
    g.fill();
  } else if (d.type === "cactus") {
    // 沙漠仙人掌
    g.fillStyle = "#3a6a3a";
    g.fillRect(-4 * s, -4 * s, 8 * s, 30 * s);
    g.fillRect(-14 * s, -2 * s, 8 * s, 14 * s);
    g.fillRect(6 * s, 4 * s, 8 * s, 12 * s);
    g.fillStyle = "rgba(255,255,255,0.15)";
    g.fillRect(-3 * s, -4 * s, 3 * s, 14 * s);
  } else if (d.type === "magrock") {
    // 岩浆岩石：暗红+裂纹发光
    g.fillStyle = "#3a1a14";
    g.beginPath();
    g.moveTo(-20 * s, 5 * s);
    g.lineTo(-8 * s, -16 * s);
    g.lineTo(15 * s, -11 * s);
    g.lineTo(24 * s, 7 * s);
    g.lineTo(7 * s, 17 * s);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(255,120,60,0.6)";
    g.lineWidth = 2.5 * s;
    g.beginPath();
    g.moveTo(-6 * s, -8 * s);
    g.lineTo(8 * s, -2 * s);
    g.stroke();
  } else if (d.type === "snowrock") {
    g.fillStyle = "#7a93ab";
    g.beginPath();
    g.moveTo(-20 * s, 5 * s);
    g.lineTo(-8 * s, -16 * s);
    g.lineTo(15 * s, -11 * s);
    g.lineTo(24 * s, 7 * s);
    g.lineTo(7 * s, 17 * s);
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(255,255,255,0.5)";
    g.beginPath();
    g.moveTo(-8 * s, -16 * s);
    g.lineTo(0, -6 * s);
    g.lineTo(-12 * s, 0);
    g.closePath();
    g.fill();
  } else if (d.type === "crystal") {
    // 暗域水晶
    g.fillStyle = "#8a6aff";
    g.beginPath();
    g.moveTo(0, -26 * s);
    g.lineTo(9 * s, -4 * s);
    g.lineTo(4 * s, 10 * s);
    g.lineTo(-4 * s, 10 * s);
    g.lineTo(-9 * s, -4 * s);
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(220,200,255,0.6)";
    g.beginPath();
    g.moveTo(0, -26 * s);
    g.lineTo(4 * s, -8 * s);
    g.lineTo(-2 * s, 4 * s);
    g.closePath();
    g.fill();
  } else if (d.type === "rock") {
    g.fillStyle = d.tone > 0.5 ? "#7a8178" : "#646b66";
    g.beginPath();
    g.moveTo(-20 * s, 5 * s);
    g.lineTo(-8 * s, -16 * s);
    g.lineTo(15 * s, -11 * s);
    g.lineTo(24 * s, 7 * s);
    g.lineTo(7 * s, 17 * s);
    g.closePath();
    g.fill();
  } else {
    g.strokeStyle = "#7b5632";
    g.lineWidth = 6 * s;
    g.beginPath();
    g.moveTo(-28 * s, -8 * s);
    g.lineTo(28 * s, 8 * s);
    g.moveTo(-20 * s, -18 * s);
    g.lineTo(-20 * s, 14 * s);
    g.moveTo(14 * s, -8 * s);
    g.lineTo(14 * s, 24 * s);
    g.stroke();
  }
  g.restore();
}

function drawLeaves(g, leaves, color) {
  g.save();
  for (const l of leaves) {
    g.translate(l.x, l.y);
    g.rotate(l.a);
    g.fillStyle = color || "rgba(205,151,61,0.38)";
    g.beginPath();
    g.ellipse(0, 0, 5 * l.s, 2.5 * l.s, 0, 0, TAU);
    g.fill();
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
  g.restore();
}

function drawShadow(g, x, y, rx, ry, alpha) {
  g.save();
  g.fillStyle = `rgba(0,0,0,${alpha})`;
  g.beginPath();
  g.ellipse(x, y, rx, ry, 0, 0, TAU);
  g.fill();
  g.restore();
}

function drawStonePlatform(g, x, y, r) {
  g.save();
  g.fillStyle = "#656760";
  g.beginPath();
  g.ellipse(x, y, r, r * 0.34, 0, 0, TAU);
  g.fill();
  g.fillStyle = "rgba(255,255,255,0.12)";
  g.beginPath();
  g.ellipse(x - r * 0.16, y - r * 0.05, r * 0.52, r * 0.12, 0, 0, TAU);
  g.fill();
  g.restore();
}

function drawMinion(g) {
  // 哥布林：绿皮小怪，红眼，尖耳
  g.fillStyle = "#3f7a3a";
  g.beginPath();
  g.ellipse(0, 2, 17, 19, 0, 0, TAU);
  g.fill();
  // 尖耳
  g.fillStyle = "#3f7a3a";
  g.beginPath();
  g.moveTo(-12, -8); g.lineTo(-20, -20); g.lineTo(-6, -2); g.closePath();
  g.moveTo(12, -8); g.lineTo(20, -20); g.lineTo(6, -2); g.closePath();
  g.fill();
  // 脸
  g.fillStyle = "#5a9a4a";
  g.beginPath();
  g.ellipse(0, -3, 12, 13, 0, 0, TAU);
  g.fill();
  // 红眼
  g.fillStyle = "#ff4433";
  g.fillRect(-8, -8, 4, 4);
  g.fillRect(4, -8, 4, 4);
  // 嘴巴
  g.fillStyle = "#2a4a25";
  g.fillRect(-5, 4, 10, 3);
  // 獠牙
  g.fillStyle = "#fff";
  g.beginPath(); g.moveTo(-4, 6); g.lineTo(-2, 10); g.lineTo(-1, 6); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(4, 6); g.lineTo(2, 10); g.lineTo(1, 6); g.closePath(); g.fill();
}

function drawArcher(g) {
  // 骷髅弓手：白骨 + 兜帽 + 弓
  g.fillStyle = "#d8d4c8";
  g.beginPath();
  g.ellipse(0, 0, 16, 19, 0, 0, TAU);
  g.fill();
  // 头骨
  g.fillStyle = "#f0ece0";
  g.beginPath();
  g.arc(0, -6, 9, 0, TAU);
  g.fill();
  // 眼窝
  g.fillStyle = "#1a1a22";
  g.fillRect(-6, -9, 4, 5);
  g.fillRect(2, -9, 4, 5);
  // 兜帽
  g.fillStyle = "#5a4a3a";
  g.beginPath();
  g.moveTo(-10, -8); g.quadraticCurveTo(0, -22, 10, -8);
  g.lineTo(8, 4); g.lineTo(-8, 4); g.closePath();
  g.fill();
  // 弓（骨弓）
  g.strokeStyle = "#b8b0a0";
  g.lineWidth = 3;
  g.beginPath();
  g.arc(18, -2, 12, -Math.PI / 2.3, Math.PI / 2.3);
  g.stroke();
  g.strokeStyle = "rgba(200,190,170,0.6)";
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(18 + Math.cos(-Math.PI / 2.3) * 12, -2 + Math.sin(-Math.PI / 2.3) * 12);
  g.lineTo(18 + Math.cos(Math.PI / 2.3) * 12, -2 + Math.sin(Math.PI / 2.3) * 12);
  g.stroke();
}

function drawTank(g) {

function drawChoiceCards(g, state) {
  const cards = state.choices;
  const fade = Util.clamp(1 - state.chooseT / 0.35, 0, 1);
  const pop = 1 + Math.max(0, state.chooseT - 0.25) * 2.2;
  const cardW = 146, cardH = 224, gap = 18;
  const total = cardW * 3 + gap * 2;
  const startX = (CONFIG.W - total) / 2;
  const y = CONFIG.H * 0.42 - cardH / 2;
  const FACTION_LABEL = { shot: "弹道", elem: "元素", summon: "召唤", surv: "生存" };

  // 背景遮罩
  g.save();
  g.globalAlpha = 0.72 * fade;
  g.fillStyle = "#05070a";
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.globalAlpha = fade;
  g.textAlign = "center";
  g.fillStyle = "#f5ecd9";
  g.font = "bold 30px Microsoft YaHei, sans-serif";
  g.fillText("选择一项强化", CONFIG.W / 2, y - 44);

  for (let i = 0; i < cards.length; i++) {
    const up = cards[i];
    const rar = RARITY[up.rarity];
    const cx = startX + i * (cardW + gap) + cardW / 2;
    // 弹出动画
    const cy = y + Math.sin((i + 0.5) * 0.9) * (1 - fade) * 40;
    g.save();
    g.translate(cx, cy);
    g.scale(pop, pop);
    // 稀有度外框发光
    g.shadowBlur = 22;
    g.shadowColor = rar.color;
    // 卡片主体：背景渐变（顶部稀有度色 → 深底）
    const bgGrad = g.createLinearGradient(0, 0, 0, cardH);
    bgGrad.addColorStop(0, rar.color + "33");
    bgGrad.addColorStop(0.25, "#1a2029");
    bgGrad.addColorStop(1, "#12161d");
    g.fillStyle = bgGrad;
    roundRect(g, -cardW / 2, 0, cardW, cardH, 12);
    g.fill();
    g.shadowBlur = 0;
    g.lineWidth = 3;
    g.strokeStyle = rar.color;
    roundRect(g, -cardW / 2, 0, cardW, cardH, 12);
    g.stroke();
    // 稀有度顶部色条：渐变高光
    const barGrad = g.createLinearGradient(0, 0, 0, 46);
    barGrad.addColorStop(0, rar.color + "55");
    barGrad.addColorStop(1, rar.color + "00");
    g.fillStyle = barGrad;
    roundRect(g, -cardW / 2, 0, cardW, 46, 12);
    g.fill();
    // 专精徽章：弓专属=「弓专精」金徽章 / 法杖专属=「杖专精」紫徽章（右上角）
    if (up.weapon === "bow" || up.weapon === "stave") {
      const spec = up.weapon === "bow" ? "弓专精" : "杖专精";
      const specColor = up.weapon === "bow" ? "#f7c948" : "#c77dff";
      g.fillStyle = "rgba(0,0,0,0.55)";
      roundRect(g, cardW / 2 - 52, 8, 46, 18, 9); g.fill();
      g.strokeStyle = specColor;
      g.lineWidth = 1;
      roundRect(g, cardW / 2 - 52, 8, 46, 18, 9); g.stroke();
      g.fillStyle = specColor;
      g.font = "bold 11px Microsoft YaHei, sans-serif";
      g.fillText(spec, cardW / 2 - 29, 21);
    }
    // 图标底座：渐变圆环 + 内发光
    const iconGrad = g.createRadialGradient(0, 74, 4, 0, 74, 30);
    iconGrad.addColorStop(0, "rgba(255,255,255,0.14)");
    iconGrad.addColorStop(1, "rgba(0,0,0,0.5)");
    g.fillStyle = iconGrad;
    g.beginPath();
    g.arc(0, 74, 30, 0, TAU);
    g.fill();
    g.strokeStyle = rar.color;
    g.lineWidth = 2;
    g.globalAlpha = 0.7;
    g.beginPath();
    g.arc(0, 74, 30, 0, TAU);
    g.stroke();
    g.globalAlpha = fade;
    g.fillStyle = rar.color;
    g.font = "bold 32px Microsoft YaHei, sans-serif";
    g.fillText(up.icon, 0, 86);
    // 传说卡：金色粒子环绕（视觉稀缺性）
    if (up.rarity === "legendary") {
      const t = performance.now() * 0.004;
      for (let k = 0; k < 6; k++) {
        const ang = t + k * TAU / 6;
        g.fillStyle = "rgba(247,201,72,0.8)";
        g.beginPath();
        g.arc(Math.cos(ang) * 52, 74 + Math.sin(ang) * 52 * 0.35, 2.5, 0, TAU);
        g.fill();
      }
    }
    // 名称
    g.fillStyle = rar.color;
    g.font = "bold 22px Microsoft YaHei, sans-serif";
    g.fillText(up.name, 0, 132);
    // 稀有度标签
    g.fillStyle = rar.color;
    g.globalAlpha = 0.9;
    g.font = "12px Microsoft YaHei, sans-serif";
    g.fillText(rar.label, 0, 152);
    g.globalAlpha = fade;
    // 描述（两行）
    g.fillStyle = "#d8dde6";
    g.font = "14px Microsoft YaHei, sans-serif";
    wrapText(g, up.desc, 0, 180, cardW - 24, 20);
    // 流派标签：彩色胶囊（弹道金/元素紫/召唤蓝/生存绿）
    const FAC_COLOR = { shot: "#f7c948", elem: "#c77dff", summon: "#5fc6ff", surv: "#8affc1" };
    const fc = FAC_COLOR[up.faction] || "#b9c2d0";
    g.fillStyle = fc + "22";
    roundRect(g, -34, 196, 68, 20, 10);
    g.fill();
    g.strokeStyle = fc + "88";
    g.lineWidth = 1;
    roundRect(g, -34, 196, 68, 20, 10);
    g.stroke();
    g.fillStyle = fc;
    g.font = "bold 12px Microsoft YaHei, sans-serif";
    g.fillText(FACTION_LABEL[up.faction] || up.faction, 0, 210);
    g.restore();
  }
  // 底部提示
  g.fillStyle = "#8a94a3";
  g.font = "14px Microsoft YaHei, sans-serif";
  g.fillText("点击卡片选择 · 键盘 1/2/3", CONFIG.W / 2, y + cardH + 40);
  g.restore();
}

function drawInRunShop(g, state) {
  if (!state.inRunShop) return;
  const items = state.inRunShop.items || [];
  g.save();
  g.fillStyle = "rgba(9,13,16,0.82)";
  roundRect(g, 24, 132, 492, 476, 10); g.fill();
  g.strokeStyle = "rgba(247,201,72,0.42)";
  g.lineWidth = 2;
  roundRect(g, 24, 132, 492, 476, 10); g.stroke();
  g.textAlign = "center";
  g.fillStyle = "#fff0c4";
  g.font = "bold 28px Microsoft YaHei, sans-serif";
  g.fillText("神秘商人", CONFIG.W / 2, 166);
  g.fillStyle = "#f7c948";
  g.font = "bold 16px Microsoft YaHei, sans-serif";
  g.fillText(`局内金币 ${state.runGold || 0}`, CONFIG.W / 2, 192);
  // 局内强化 6 格（2 行 3 列）
  const w = 146, h = 88, gap = 14;
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const col = i % 3;
    const row = Math.floor(i / 3);
    const x = 48 + col * (w + gap);
    const y = 246 + row * 102;
    const afford = (state.runGold || 0) >= item.price;
    g.fillStyle = item.sold ? "rgba(255,255,255,0.08)" : afford ? "rgba(247,201,72,0.16)" : "rgba(255,255,255,0.08)";
    roundRect(g, x, y, w, h, 8); g.fill();
    g.strokeStyle = item.sold ? "rgba(255,255,255,0.14)" : afford ? "rgba(247,201,72,0.55)" : "rgba(255,255,255,0.18)";
    g.lineWidth = 2;
    roundRect(g, x, y, w, h, 8); g.stroke();
    g.fillStyle = item.sold ? "#8a94a3" : "#f7c948";
    g.font = "bold 22px Microsoft YaHei, sans-serif";
    g.fillText(item.icon, x + w / 2, y + 28);
    g.fillStyle = "#f5ecd9";
    g.font = "bold 14px Microsoft YaHei, sans-serif";
    g.fillText(item.name, x + w / 2, y + 50);
    g.fillStyle = item.sold ? "#8a94a3" : afford ? "#f7c948" : "#c2a06a";
    g.font = "12px Microsoft YaHei, sans-serif";
    g.fillText(item.sold ? "已购买" : `${item.price} 金币`, x + w / 2, y + 72);
  }
  // 武器区（局内金币购买，本局生效，死亡回免费武器）
  const s = SaveSystem.data;
  const wy = 458;
  g.fillStyle = "#9aa5b4";
  g.font = "12px Microsoft YaHei, sans-serif";
  g.textAlign = "left";
  g.fillText(isStaveMode() ? "武器（法杖，本局）" : "武器（弓，本局）", 44, wy - 6);
  g.font = "10px Microsoft YaHei, sans-serif";
  g.fillStyle = "#7a8594";
  g.fillText("本局生效 · 死亡回免费武器", 44, wy + 6);
  const wList = isStaveMode() ? WEAPON_STAVES : WEAPON_SKINS;
  wList.forEach((w, i) => {
    const wx = 44 + i * 120;
    const current = (typeof game.player.weaponSkinOverride === "number" ? game.player.weaponSkinOverride : 0) === i;
    const afford = (state.runGold || 0) >= w.price;
    g.fillStyle = current ? "#2a2418" : "#1a2029";
    roundRect(g, wx, wy + 14, 112, 76, 8); g.fill();
    if (current) { g.strokeStyle = "#f7c948"; g.lineWidth = 2; roundRect(g, wx, wy + 14, 112, 76, 8); g.stroke(); }
    else if (afford) { g.strokeStyle = "rgba(247,201,72,0.4)"; g.lineWidth = 1; roundRect(g, wx, wy + 14, 112, 76, 8); g.stroke(); }
    g.fillStyle = w.color;
    g.font = "bold 16px Microsoft YaHei, sans-serif";
    g.fillText(w.icon, wx + 24, wy + 36);
    g.fillStyle = current ? "#f7c948" : "#e8eef6";
    g.font = "bold 11px Microsoft YaHei, sans-serif";
    g.fillText(w.name, wx + 44, wy + 30);
    // 武器基础说明（特效说明，9px 短描述）
    g.fillStyle = "#9aa5b4";
    g.font = "9px Microsoft YaHei, sans-serif";
    g.textAlign = "left";
    g.fillText(String(w.shortDesc || w.desc || "").slice(0, 11), wx + 6, wy + 48);
    g.fillStyle = current ? "#f7c948" : afford ? "#f7c948" : "#8a94a3";
    g.font = "10px Microsoft YaHei, sans-serif";
    g.fillText(current ? "使用中" : `${w.price}💰`, wx + 44, wy + 66);
  });
  // 武器选择提示：自带特效的武器不会再出同效果元素卡（符合逻辑）
  g.textAlign = "center";
  g.fillStyle = "#7a8594";
  g.font = "10px Microsoft YaHei, sans-serif";
  g.fillText("武器自带特效，对应元素卡不再出现（可出增伤变体）", CONFIG.W / 2, 560);
  // 关闭按钮（所有模式都可关闭，固定底部）
  g.fillStyle = "rgba(255,255,255,0.14)";
  roundRect(g, CONFIG.W / 2 - 50, 578, 100, 30, 8); g.fill();
  g.fillStyle = "#e8eef6";
  g.font = "bold 14px Microsoft YaHei, sans-serif";
  g.fillText("关闭", CONFIG.W / 2, 598);
  g.restore();
}

function drawStatsPanel(g, state) {
  const p = state.player;
  g.save();
  g.fillStyle = "rgba(9,13,16,0.85)";
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.textAlign = "center";
  g.fillStyle = "#fff0c4";
  g.font = "bold 34px Microsoft YaHei, sans-serif";
  g.fillText("属性面板", CONFIG.W / 2, 76);
  // 基础属性（两列）+ DPS 估算
  const dps = Math.round(p.damage * p.fireRate * (1 + (p.crit || 0) * ((p.critDmg || 2) - 1)) * (p.arrowCount || 1));
  const rows = [
    ["攻击", Math.round(p.damage), "#ffd56a"],
    ["射速", p.fireRate.toFixed(2) + "/秒", "#7fe0ff"],
    ["暴击", Math.round(p.crit * 100) + "%", "#ff9ecb"],
    ["穿透", p.pierce + " 次", "#c77dff"],
    ["箭矢", p.arrowCount + " 支", "#8affc1"],
    ["射程", Math.round(p.range) + " px", "#ffb15b"],
    ["护盾", (p.shield || 0) + " 层", "#7fe0ff"],
    ["生命", p.maxHp, "#ff6b81"],
    ["御剑", p.swords.length + " 把", "#c77dff"],
    ["御剑CD", Math.round((0.9 * (p.swordCd || 1)) * 100) / 100 + "s", "#c77dff"]
  ];
  rows.forEach((r, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const x = 60 + col * 250;
    const y = 108 + row * 34;
    g.fillStyle = "#9aa5b4";
    g.font = "15px Microsoft YaHei, sans-serif";
    g.textAlign = "left";
    g.fillText(r[0], x, y);
    g.fillStyle = r[2];
    g.font = "bold 17px Microsoft YaHei, sans-serif";
    g.fillText(String(r[1]), x + 90, y);
  });
  // DPS 估算 + 武器路线
  g.fillStyle = "#f7c948";
  g.font = "bold 16px Microsoft YaHei, sans-serif";
  g.textAlign = "left";
  g.fillText(`预估秒伤 ≈ ${dps}`, 60, 274);
  g.fillStyle = isStaveMode() ? "#c77dff" : "#ffd56a";
  g.fillText(isStaveMode() ? "🪄 法杖路线" : "🏹 弓箭路线", 220, 274);
  // 特殊机制
  const mechs = [];
  if (p.fire) mechs.push("🔥灼烧");
  if (p.ice) mechs.push("❄减速");
  if (p.split) mechs.push("➿分裂");
  if (p.volt) mechs.push("⚡弹射");
  if (p.frostfire) mechs.push("💥冰爆");
  if (p.homing) mechs.push("🎯追踪");
  if (p.pierceAll) mechs.push("🗡贯穿");
  if (p.lifesteal) mechs.push("🩸吸血");
  if (p.orb) mechs.push("🌀火球");
  if (p.regen) mechs.push("💚再生");
  if (p.dodge) mechs.push("🕊闪避" + Math.round(p.dodge * 100) + "%");
  if (p.thorns) mechs.push("🌵荆棘" + p.thorns);
  if (p.berserk) mechs.push("🔥狂暴");
  if (p.poison) mechs.push("☠剧毒");
  if (p.staveNova) mechs.push("💥新星");
  if (p.staveSplit) mechs.push("➿分裂球");
  if (p.staveDrain) mechs.push("🩸汲取");
  if (p.elemBoost > 1) mechs.push("🔮元素×" + p.elemBoost.toFixed(1));
  if (p.burnMult) mechs.push("🔥灼烧×" + p.burnMult.toFixed(1));

function drawCodex(g, state) {
  g.save();
  g.fillStyle = "rgba(7,12,8,0.9)";
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.textAlign = "center";
  g.fillStyle = "#fff0c4";
  g.font = "bold 34px Microsoft YaHei, sans-serif";
  g.fillText("图鉴", CONFIG.W / 2, 72);
  // 页签：怪物 / 技能 / 皮肤
  const tabs = [
    { key: "monsters", label: "怪物" },
    { key: "skills", label: "技能" },
    { key: "skins", label: "皮肤" }
  ];
  const tabW = 130, tabH = 38, gap = 12;
  const startX = (CONFIG.W - tabW * 3 - gap * 2) / 2;
  tabs.forEach((tb, i) => {
    const x = startX + i * (tabW + gap);
    const active = state.codexTab === tb.key;
    g.fillStyle = active ? "#a865ff" : "rgba(255,255,255,0.1)";
    roundRect(g, x, 92, tabW, tabH, 8); g.fill();
    g.fillStyle = active ? "#fff" : "#9aa5b4";
    g.font = "bold 15px Microsoft YaHei, sans-serif";
    g.fillText(tb.label, x + tabW / 2, 117);
  });
  // 收集进度
  const p = codexProgress(state.codexTab);
  g.fillStyle = "#f7c948";
  g.font = "bold 15px Microsoft YaHei, sans-serif";
  g.fillText(`已收集 ${p.got} / ${p.total}`, CONFIG.W / 2, 152);
  const progP = p.total ? p.got / p.total : 0;
  g.fillStyle = "rgba(255,255,255,0.12)";
  roundRect(g, 120, 162, 300, 10, 5); g.fill();
  g.fillStyle = "#f7c948";
  roundRect(g, 120, 162, 300 * progP, 10, 5); g.fill();
  // 卡片网格（4 列）
  let list = [];
  let colors = {};
  if (state.codexTab === "monsters") list = CODEX_MONSTERS;
  else if (state.codexTab === "skills") list = CODEX_SKILLS;
  else list = WEAPON_SKINS.map(w => ({ id: String(w.id), name: w.name, icon: w.icon, rarity: "skin", desc: w.desc }));
  const rarColor = { common: "#b8c4d0", rare: "#5fc6ff", epic: "#c77dff", legendary: "#f7c948", shop: "#ffd56a", skin: "#ffd56a" };
  const rarLabel = { common: "普通", rare: "稀有", epic: "史诗", legendary: "传说", shop: "商店", skin: "皮肤" };
  list.forEach((item, i) => {
    const col = i % 4;
    const row = Math.floor(i / 4);
    const x = 70 + col * 108;
    const y = 198 + row * 128;
    const unlocked = (SaveSystem.data.codex[state.codexTab] || []).includes(String(item.id)) ||
      (state.codexTab === "skins" && (SaveSystem.data.weaponSkin >= Number(item.id)));
    const c = rarColor[item.rarity] || "#b8c4d0";
    g.fillStyle = "rgba(0,0,0,0.4)";
    roundRect(g, x - 42, y - 10, 96, 100, 8); g.fill();
    g.strokeStyle = unlocked ? c : "rgba(255,255,255,0.12)";
    g.lineWidth = 2;
    roundRect(g, x - 42, y - 10, 96, 100, 8); g.stroke();
    if (unlocked) {
      g.fillStyle = c;
      g.font = "bold 26px Microsoft YaHei, sans-serif";
      g.fillText(item.icon, x, y + 22);
      g.fillStyle = "#e8eef6";
      g.font = "bold 12px Microsoft YaHei, sans-serif";
      g.fillText(item.name, x, y + 46);
      g.fillStyle = "#8a94a3";
      g.font = "10px Microsoft YaHei, sans-serif";
      g.fillText(rarLabel[item.rarity] || "", x, y + 62);
      g.fillStyle = "#6b7686";
      g.font = "9px Microsoft YaHei, sans-serif";
      g.fillText(item.desc ? Array.from(item.desc).slice(0, 8).join("") + "…" : "", x, y + 78);
    } else {
      g.fillStyle = "#5a6472";
      g.font = "bold 26px Microsoft YaHei, sans-serif";
      g.fillText("?", x, y + 22);
      g.font = "bold 12px Microsoft YaHei, sans-serif";
      g.fillText("未解锁", x, y + 46);
      g.font = "10px Microsoft YaHei, sans-serif";
      g.fillText(state.codexTab === "monsters" ? "击杀解锁" : state.codexTab === "skills" ? "获得解锁" : "购买解锁", x, y + 62);
    }
  });
  // 返回按钮
  g.fillStyle = "rgba(255,255,255,0.12)";
  roundRect(g, 210, 882, 120, 44, 10); g.fill();
  g.fillStyle = "#e8eef6";
  g.font = "bold 18px Microsoft YaHei, sans-serif";
  g.fillText("返回", 270, 912);
  g.restore();
}

function drawUI(g, state) {
  if (state.state === "PLAY") drawHud(g, state);
  drawMute(g); // 音效开关：所有页面可见
  drawPause(g, state); // 暂停键 + 暂停菜单
  // 顶部提示消息（商店/面板打开时隐藏，避免遮挡内容）
  if (state.messageT > 0 && !state.inRunShop && !state.statsPanel) {
    g.save();
    g.globalAlpha = Math.min(1, state.messageT);
    g.textAlign = "center";
    g.font = "bold 24px Microsoft YaHei, sans-serif";
    g.lineWidth = 5;
    g.strokeStyle = "rgba(20,12,4,0.85)";
    g.fillStyle = "#fff0c4";
    g.strokeText(state.message, CONFIG.W / 2, 154);
    g.fillText(state.message, CONFIG.W / 2, 154);
    g.restore();
  }
  if (state.statsPanel) drawStatsPanel(g, state);
  if (state.state === "MENU") drawMenu(g, state);
  else if (state.state === "WEAPON_SELECT") drawWeaponSelect(g, state);

}

// 开局武器选择页：先选武器再开局（弓=快速弹道 / 法杖=重击元素）
function drawWeaponSelect(g, state) {
  g.save();
  g.fillStyle = "rgba(7,12,8,0.9)";
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.textAlign = "center";
  g.fillStyle = "#f8e9ff";
  g.font = "bold 34px Microsoft YaHei, sans-serif";

  g.fillStyle = "#a9977d";
  g.font = "14px Microsoft YaHei, sans-serif";
  g.fillText("武器决定本局卡池 · 局内不可切换", CONFIG.W / 2, 144);
  const pick = state.weaponPick || 0;
  // 两张武器卡
  const cards = [
    { id: 0, name: "🏹 弓箭", tag: "快速弹道流", desc: "高频弹幕 · 多重箭/追踪/贯穿", detail: "伤害 14 · 射速 2.0/秒\n卡池：强弓/多重箭/分裂箭/追踪箭/贯穿箭" },
    { id: 1, name: "🪄 法杖", tag: "重击元素流", desc: "低频重击 · 能量球/元素/分裂", detail: "伤害 27 · 射速 1.1/秒\n卡池：火焰/冰霜/雷电法球/法力强化/元素新星" }
  ];
  cards.forEach((c, i) => {
    const x = 36 + i * 240;
    const y = 180;
    const selected = pick === c.id;
    g.fillStyle = selected ? "#2a2418" : "#141a22";
    roundRect(g, x, y, 228, 300, 14); g.fill();
    if (selected) { g.strokeStyle = "#f7c948"; g.lineWidth = 3; roundRect(g, x, y, 228, 300, 14); g.stroke(); }
    else { g.strokeStyle = "rgba(255,255,255,0.15)"; g.lineWidth = 1; roundRect(g, x, y, 228, 300, 14); g.stroke(); }
    if (selected) { g.fillStyle = "#f7c948"; g.font = "bold 12px Microsoft YaHei, sans-serif"; g.fillText("✓ 已选择", x + 114, y + 26); }
    g.fillStyle = "#e8eef6";
    g.font = "bold 22px Microsoft YaHei, sans-serif";
    g.fillText(c.name, x + 114, y + 72);
    g.fillStyle = selected ? "#f7c948" : "#5fc6ff";
    g.font = "bold 14px Microsoft YaHei, sans-serif";
    g.fillText(c.tag, x + 114, y + 104);
    g.fillStyle = "#c9d4e0";
    g.font = "13px Microsoft YaHei, sans-serif";
    g.fillText(c.desc, x + 114, y + 134);
    // 分隔线
    g.strokeStyle = "rgba(255,255,255,0.12)";
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x + 24, y + 152); g.lineTo(x + 204, y + 152); g.stroke();
    // 数值 + 卡池说明（自动换行，不截断）
    g.textAlign = "left";
    g.fillStyle = "#8a94a3";
    g.font = "12px Microsoft YaHei, sans-serif";
    const lines = c.detail.split("\n");
    let ty = y + 176;
    lines.forEach((ln, li) => {
      if (li > 0) {
        // 卡池行：自动换行（卡宽 180px 内）
        let line = "";
        for (const ch2 of ln) {
          const test = line + ch2;
          if (g.measureText(test).width > 180 && line) {
            g.fillText(line, x + 24, ty);
            line = ch2;
            ty += 34;
          } else {
            line = test;
          }
        }
        g.fillText(line, x + 24, ty);
        ty += 34;
      } else {
        g.fillText(ln, x + 24, ty);
        ty += 34;
      }
    });
    g.textAlign = "center";
  });
  // 开始 / 返回
  drawButton(g, CONFIG.W / 2 - 105, 520, 210, 58, "开始游戏");
  g.fillStyle = "rgba(255,255,255,0.14)";
  roundRect(g, CONFIG.W / 2 - 60, 596, 120, 40, 8); g.fill();
  g.fillStyle = "#e8eef6";
  g.font = "bold 15px Microsoft YaHei, sans-serif";
  g.fillText("返回", CONFIG.W / 2, 622);
  g.restore();
}

  g.fillStyle = "rgba(255,170,90,0.16)";
  roundRect(g, CONFIG.W / 2 + 90, 856, 120, 42, 10); g.fill();
  g.strokeStyle = "rgba(255,170,90,0.5)";
  g.lineWidth = 2;
  roundRect(g, CONFIG.W / 2 + 90, 856, 120, 42, 10); g.stroke();
  g.fillStyle = "#ffaa5a";
  g.font = "bold 15px Microsoft YaHei, sans-serif";
  g.fillText("改名", CONFIG.W / 2 + 150, 884);
  g.restore();
}

function drawGameOver(g, state) {
  g.save();
  g.fillStyle = "rgba(10,13,10,0.72)";
  g.fillRect(0, 0, CONFIG.W, CONFIG.H);
  g.textAlign = "center";
  g.fillStyle = "#ffe3b0";
  g.font = "bold 52px Microsoft YaHei, sans-serif";
  g.fillText("闯关失败", CONFIG.W / 2, 260);
  g.fillStyle = "#f1dfbf";
  g.font = "22px Microsoft YaHei, sans-serif";
  g.fillText(`进度 第 ${state.chapter} 章 · 房间 ${state.roomIndex + 1}/6`, CONFIG.W / 2, 340);
  g.fillText(`击杀 ${state.kills}  评分 ${state.score}`, CONFIG.W / 2, 380);
  g.fillStyle = "#f7c948";
  g.fillText(`入账金币 +${(state.runGold || 0) + (state.settlementBonus || 0)}`, CONFIG.W / 2, 420);
  g.fillStyle = "#f1dfbf";
  g.fillText(`局内剩余 ${state.runGold || 0} · 章节奖励 ${state.settlementBonus || 0}`, CONFIG.W / 2, 460);
  drawButton(g, CONFIG.W / 2 - 105, 504, 210, 62, "重开");
  if (state.heroLeveledMsg) {
    // 升级提示放按钮下方，留足间距（之前 y560 压在按钮 504-566 底部）
    g.fillStyle = "rgba(0,0,0,0.35)";
    roundRect(g, CONFIG.W / 2 - 140, 588, 280, 34, 8); g.fill();
    g.fillStyle = "#ffd56a";
    g.font = "bold 16px Microsoft YaHei, sans-serif";
    g.fillText(state.heroLeveledMsg, CONFIG.W / 2, 610);
  }
  g.fillStyle = "#a9977d";
  g.font = "13px Microsoft YaHei, sans-serif";
  g.fillText(`英雄 Lv.${SaveSystem.data.heroLevel}（经验 ${SaveSystem.data.heroExp}/${heroExpNeed(SaveSystem.data.heroLevel)}）`, CONFIG.W / 2, 656);
  g.restore();
}

function drawButton(g, x, y, w, h, text) {
  g.save();
  const grad = g.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, "#a865ff");
  grad.addColorStop(1, "#5a36bd");
  g.fillStyle = grad;
  g.shadowBlur = 22;
  g.shadowColor = CONFIG.COLORS.purple;
  roundRect(g, x, y, w, h, 8);
  g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = "rgba(255,255,255,0.45)";
  g.lineWidth = 2;
  roundRect(g, x + 2, y + 2, w - 4, h - 4, 7);
  g.stroke();
  g.fillStyle = "#fff7ff";
  g.font = "bold 26px Microsoft YaHei, sans-serif";
  g.textAlign = "center";
  g.fillText(text, x + w / 2, y + 39);
  g.restore();
}

function roundRect(g, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y, x + w, y + h, rr);
  g.arcTo(x + w, y + h, x, y + h, rr);
  g.arcTo(x, y + h, x, y, rr);
  g.arcTo(x, y, x + w, y, rr);
  g.closePath();
}

function wrapText(g, text, x, y, maxWidth, lineHeight) {
  let line = "";
  const chars = Array.from(text);
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (g.measureText(test).width > maxWidth && line) {
      g.fillText(line, x, y);
      line = chars[i];
      y += lineHeight;
    } else line = test;
  }
  if (line) g.fillText(line, x, y);
}

function canvasPoint(evt) {
  const rect = canvas.getBoundingClientRect();
  const p = evt.touches ? evt.touches[0] : evt;
  return {
    x: (p.clientX - rect.left) / rect.width * CONFIG.W,
    y: (p.clientY - rect.top) / rect.height * CONFIG.H
  };
}

function activateAt(x, y) {
  audio.ensure();
  if (x >= 20 && x <= 62 && y >= 82 && y <= 114) {
    audio.toggle();
    return;
  }
  if (game.state === "CHOOSE" && game.choices) {
    // 三张卡：与 drawChoiceCards 布局一致
    const cardW = 146, cardH = 224, gap = 18;
    const total = cardW * 3 + gap * 2;
    const startX = (CONFIG.W - total) / 2;
    const y0 = CONFIG.H * 0.42 - cardH / 2;
    for (let i = 0; i < 3; i++) {
      const cx = startX + i * (cardW + gap);
      if (x >= cx && x <= cx + cardW && y >= y0 && y <= y0 + cardH) {
        game.chooseUpgrade(i);
        return;
      }
    }
    return;
  }
  if (game.state === "PLAY" && !game.inRunShop && !game.statsPanel) {
    // 局内商店入口按钮（右下角）
    if (x >= CONFIG.W - 92 && x <= CONFIG.W - 14 && y >= CONFIG.H - 66 && y <= CONFIG.H - 16) {
      game.openInRunShop();
      return;
    }
    // 详细面板按钮（右上角 📊）
    if (x >= CONFIG.W - 40 && x <= CONFIG.W - 10 && y >= 16 && y <= 46) {
      game.openStatsPanel();
      return;
    }
  }
  if (game.state === "PLAY" && game.statsPanel) {
    // 关闭面板
    if (x >= CONFIG.W / 2 - 60 && x <= CONFIG.W / 2 + 60 && y >= 880 && y <= 924) {
      game.closeStatsPanel();
      return;
    }
    return;
  }
  // 音效开关按钮：全局右上角（所有状态最先判断）
  if (x >= CONFIG.W - 86 && x <= CONFIG.W - 46 && y >= 16 && y <= 46) { audio.toggle(); return; }
  // 暂停系统：战斗中的 ⏸ 键 + 暂停菜单按钮（最优先，先于一切战斗交互）
  if (game.state === "PLAY") {
    if (!game.paused && x >= 16 && x <= 76 && y >= 78 && y <= 122) { game.paused = true; return; }
    if (game.paused) {
      if (x >= CONFIG.W / 2 - 90 && x <= CONFIG.W / 2 + 90 && y >= 400 && y <= 454) { game.paused = false; return; }
      if (x >= CONFIG.W / 2 - 90 && x <= CONFIG.W / 2 + 90 && y >= 468 && y <= 522) { game.toMenu(); return; }
      if (x >= CONFIG.W / 2 - 90 && x <= CONFIG.W / 2 + 90 && y >= 536 && y <= 590) { game.saveRun(); return; }
      if (x >= CONFIG.W / 2 - 90 && x <= CONFIG.W / 2 + 90 && y >= 604 && y <= 658) { audio.toggle(); return; }
      return;
    }
  }
  if (game.state === "PLAY" && game.inRunShop) {
    const shop = game.inRunShop;
    // 关闭按钮（y 578-608，所有模式）
    if (x >= CONFIG.W / 2 - 50 && x <= CONFIG.W / 2 + 50 && y >= 578 && y <= 608) {
      game.dismissInRunShop();
      return;
    }
    // 局内强化 6 格（y 246/348，h 88）
    const w = 146, h = 88, gap = 14;
    for (let i = 0; i < shop.items.length; i++) {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const bx = 48 + col * (w + gap);
      const by = 246 + row * 102;
      if (x >= bx && x <= bx + w && y >= by && y <= by + h) {
        game.buyInRunShop(i);
        return;
      }
    }
    // 武器区（wy=458：武器卡 y 472-528，x=44+120i 宽 112）
    const wList = isStaveMode() ? WEAPON_STAVES : WEAPON_SKINS;
    for (let i = 0; i < wList.length; i++) {
      const wx = 44 + i * 120;
      if (x >= wx && x <= wx + 112 && y >= 472 && y <= 528) {
        game.buyMetaFromInRun("weapon", i);
        return;
      }
    }
  }
  if (game.state === "MENU") {
    if (x >= CONFIG.W / 2 - 105 && x <= CONFIG.W / 2 + 105 && y >= 376 && y <= 438) { game.state = "WEAPON_SELECT"; audio.ensure(); }
    // 继续游戏（有局内存档时）：恢复保存的进度
    else if (x >= CONFIG.W / 2 - 105 && x <= CONFIG.W / 2 + 105 && y >= 444 && y <= 486) { game.loadRun(); }
    else if (x >= CONFIG.W / 2 - 88 && x <= CONFIG.W / 2 + 88 && y >= 500 && y <= 542) { game.enterDaily(); }
    else if (x >= CONFIG.W / 2 - 88 && x <= CONFIG.W / 2 + 88 && y >= 596 && y <= 638) game.openHeroTree();
    else if (x >= CONFIG.W / 2 - 88 && x <= CONFIG.W / 2 + 88 && y >= 648 && y <= 690) game.openCodex();
    else if (x >= CONFIG.W / 2 - 88 && x <= CONFIG.W / 2 + 88 && y >= 700 && y <= 742) game.openLeaderboard();
  } else if (game.state === "WEAPON_SELECT") {
    // 两张武器卡：弓箭(36,180,228,300) / 法杖(276,180,228,300)
    if (x >= 36 && x <= 264 && y >= 180 && y <= 480) { game.weaponPick = 0; return; }
    if (x >= 276 && x <= 504 && y >= 180 && y <= 480) { game.weaponPick = 1; return; }
    // 开始游戏
    if (x >= CONFIG.W / 2 - 105 && x <= CONFIG.W / 2 + 105 && y >= 520 && y <= 578) { game.start(); return; }
    // 返回
    if (x >= CONFIG.W / 2 - 60 && x <= CONFIG.W / 2 + 60 && y >= 596 && y <= 636) { game.state = "MENU"; return; }
  } else if (game.state === "CODEX") {
    // 返回
    if (x >= 210 && x <= 330 && y >= 882 && y <= 926) { game.closeCodex(); return; }
    // 页签切换
    const tabW = 130, tabH = 38, gap = 12;
    const startX = (CONFIG.W - tabW * 3 - gap * 2) / 2;
    const tabs = ["monsters", "skills", "skins"];
    tabs.forEach((key, i) => {
      const tx = startX + i * (tabW + gap);
      if (x >= tx && x <= tx + tabW && y >= 92 && y <= 130) game.codexTab = key;
    });
  } else if (game.state === "HERO") {
    // 返回
    if (x >= 210 && x <= 330 && y >= 882 && y <= 926) { game.closeHeroTree(); return; }
    // 加点（6 卡 3x2 网格）
    HERO_TALENTS.forEach((t, i) => {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const cx = 24 + col * 172;
      const cy = 228 + row * 190;
      if (x >= cx && x <= cx + 160 && y >= cy && y <= cy + 172) {
        game.spendHeroPoint(t.id);
      }
    });
  } else if (game.state === "LEADERBOARD") {
    const tabY = 154, tabW = 112, tabH = 42, gap = 8;
    const startX = (CONFIG.W - tabW * Leaderboard.tabs.length - gap * (Leaderboard.tabs.length - 1)) / 2;
    for (let i = 0; i < Leaderboard.tabs.length; i++) {
      const tx = startX + i * (tabW + gap);
      if (x >= tx && x <= tx + tabW && y >= tabY && y <= tabY + tabH) {
        game.leaderboardTab = Leaderboard.tabs[i].key;
        return;
      }
    }
    if (x >= CONFIG.W / 2 - 70 && x <= CONFIG.W / 2 + 70 && y >= 850 && y <= 904) game.closeLeaderboard();
    // 改名按钮（返回按钮右侧）
    if (x >= CONFIG.W / 2 + 90 && x <= CONFIG.W / 2 + 210 && y >= 856 && y <= 898) Leaderboard.resetName();
  } else if (game.state === "SHOP") {
    const tab = game.shopTab || 0;
    // 返回按钮（y 882-926）
    if (x >= 210 && x <= 330 && y >= 882 && y <= 926) { game.closeShop(); return; }
    // 页签切换
    if (y >= 156 && y <= 190) {
      if (x >= 35 && x <= 245) { game.shopTab = 0; return; }
      if (x >= 280 && x <= 440) { game.shopTab = 1; return; }
    }
    if (tab === 0) {
      // 装备购买（y: 252/344/436 + 78 高）
      const eqSlots = ["bow", "charm", "sigil"];
      for (let i = 0; i < 3; i++) {
        const by = 252 + i * 92;
        if (x >= 28 && x <= 512 && y >= by && y <= by + 78) {
          if (x >= 388 && x <= 496 && y >= by + 46 && y <= by + 70 && SaveSystem.canBuyEquip(eqSlots[i])) {
            if (SaveSystem.buyEquip(eqSlots[i])) audio.upgrade();
            return;
          }
          return;
        }
      }
      // 天赋购买（y: 578/656/734 + 64 高）
      const tSlots = ["dmg", "hp", "arrow"];
      for (let i = 0; i < 3; i++) {
        const ty = 578 + i * 78;
        if (x >= 28 && x <= 512 && y >= ty && y <= ty + 64) {
          if (x >= 388 && x <= 496 && y >= ty + 20 && y <= ty + 44 && SaveSystem.canBuyTalent(tSlots[i])) {
            if (SaveSystem.buyTalent(tSlots[i])) audio.upgrade();
            return;
          }
          return;
        }
      }
    } else {
      // 武器皮肤（2x2 网格：28/276 x, 270/460 y，卡 232x170）
      for (let i = 0; i < WEAPON_SKINS.length; i++) {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const wx = 28 + col * 248;
        const wy = 270 + row * 190;
        if (x >= wx && x <= wx + 232 && y >= wy && y <= wy + 170) {
          // 购买/装备按钮（左下角）
          if (x >= wx + 12 && x <= wx + 92 && y >= wy + 150 && y <= wy + 172) {
            if (SaveSystem.data.weaponSkin >= i) {
              SaveSystem.data.weaponSkin = i;
              SaveSystem.save();
              audio.upgrade();
            } else if (SaveSystem.data.gold >= WEAPON_SKINS[i].price) {
              SaveSystem.data.gold -= WEAPON_SKINS[i].price;
              SaveSystem.data.weaponSkin = i;
              SaveSystem.save();
              audio.upgrade();
              game.flashMessage(`获得「${WEAPON_SKINS[i].name}」`);
            }
            return;
          }
          return;
        }
      }
    }
  } else if (game.state === "GAME_OVER") {
    if (x >= CONFIG.W / 2 - 105 && x <= CONFIG.W / 2 + 105 && y >= 504 && y <= 566) game.start();
  }
}

window.addEventListener("keydown", e => {
  // AI 演示模式：键盘不干预
  if (DEMO) return;
  // ESC：暂停/继续（PC 快捷键；商店/面板打开时不抢焦点）
  if (e.key === "Escape" && game.state === "PLAY" && !game.inRunShop && !game.statsPanel) {
    game.paused = !game.paused;
    return;
  }
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") game.input.left = 1;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") game.input.right = 1;
  if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") game.input.up = 1;
  if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") game.input.down = 1;
  // 三选一：键盘 1/2/3 直接选择
  if (game.state === "CHOOSE" && game.choices) {
    if (e.key === "1") { game.chooseUpgrade(0); return; }
    if (e.key === "2") { game.chooseUpgrade(1); return; }
    if (e.key === "3") { game.chooseUpgrade(2); return; }
  }
  if (e.key === " " || e.key === "Enter") {
    if (game.state === "MENU" || game.state === "GAME_OVER") game.start();
  }
  if (e.key === "Escape" && game.state === "LEADERBOARD") game.closeLeaderboard();
  if (e.key === "Escape" && game.statsPanel) game.closeStatsPanel();
  if (e.key === "m" || e.key === "M") audio.toggle();
});
window.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") game.input.left = 0;
  if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") game.input.right = 0;
  if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") game.input.up = 0;
  if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") game.input.down = 0;
});
canvas.addEventListener("pointerdown", e => {
  // AI 演示模式：禁用一切指针输入
  if (DEMO) return;
  audio.ensure(); // 用户手势：立即初始化音频（浏览器自动播放策略要求）
  const p = canvasPoint(e);
  activateAt(p.x, p.y);
  game.input.touching = true;
  game.input.touchX = p.x;
  game.input.touchY = p.y;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  // AI 演示模式：禁用鼠标悬停控制，AI 独占
  if (DEMO) return;
  const p = canvasPoint(e);
  // PC 鼠标：未按下时悬停即可控制角色（跟随鼠标XY）
  if (!game.input.touching && e.pointerType === "mouse") {
    game.input.hoverX = p.x;
    game.input.hoverY = p.y;
    game.input.hover = true;
    return;
  }
  game.input.touchX = p.x;
  game.input.touchY = p.y;
});
canvas.addEventListener("pointerup", e => {
  game.input.touching = false;
  game.input.hover = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener("pointercancel", () => { game.input.touching = false; game.input.hover = false; });

let last = performance.now();
let acc = 0;
let lastErr = 0;
function loop(now) {
  try {
    const frame = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += frame;
    while (acc >= CONFIG.FIXED_DT) {
      game.update(CONFIG.FIXED_DT);
      DemoAI.think(CONFIG.FIXED_DT);
      acc -= CONFIG.FIXED_DT;
    }
    game.render(ctx);
    DemoAI.render(ctx);
  } catch (e) {
    // 保险：任何单帧异常都不允许中断主循环（否则游戏永久冻结=“房间卡住”）
    // 记录错误但不冻结，下一帧继续
    const now2 = performance.now();
    if (now2 - lastErr > 3000 && typeof console !== "undefined") {
      lastErr = now2;
      console.error("[loop guard]", e);
    }
    last = now;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
